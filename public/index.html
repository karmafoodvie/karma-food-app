let allergeneCache=[];
async function loadAllergeneCheatsheet(){
  allergeneCache=await api('allergene_rezepturen?select=*&order=gericht.asc').catch(()=>[]);
  // Heute's Menü aus MENU_DATA oben anzeigen
  const todayMenu=getTodayMenu()||[];
  renderAllergeneCheatlist(allergeneCache, todayMenu);
}

function renderAllergeneCheatlist(list, todayMenu=[]){
  const wrap=document.getElementById('all-cheatlist');
  if(!wrap) return;
  let html='';

  function parseZutatenSections(zutaten){
    if(!zutaten) return [];
    // Split on double newline or "ÖL" appearing after first section
    const parts = zutaten.split(/\n\s*\n|(?=ÖL\s*[,\.])/g).filter(p=>p.trim());
    if(parts.length<=1) return [{label:null, text:zutaten.replace(/\n/g,' ').trim()}];
    return parts.map((p,i)=>({
      label: i===0?null:'Dressing',
      text: p.replace(/\n/g,' ').trim()
    }));
  }

  function isZutatAllergen(item){
    const up = item.toUpperCase().trim();
    return (
      // A — Glutenhaltiges Getreide
      /\b(WEIZEN|DINKEL|ROGGEN|GERSTE|HAFER|KAMUT|TEIGBLÄTTER|TEIGBLATT|LASAGNE\s*BLÄTTER|EBLY|MEHL)\b/.test(up) ||
      // C — Eier
      /\b(EIER|EIDOTTER)\b/.test(up) || up === 'EI' ||
      // E — Erdnüsse
      /\b(ERDNUSS|ERDNÜSSE)\b/.test(up) ||
      // F — Soja (nicht Kokosmilch!)
      /\b(SOJA|TOFU|SOJAHACK|SOJAJOGHURT|SOJAFASCHIERTES|SOJAMILCH)\b/.test(up) ||
      // G — Milch: aber NICHT KOKOSMILCH
      (/\b(KÄSE|JOGHURT|BUTTER|RAHM|SAHNE|PARMESAN|MOZZARELLA|KUHMILCH|HAFERMILCH)\b/.test(up) ||
       (/MILCH/.test(up) && !/KOKOS/.test(up))) ||
      // H — Schalenfrüchte/Nüsse (nicht Kokosnuss!)
      /\b(MANDELN?|HASELNUSS|HASELNÜSSE|WALNUSS|WALNÜSSE|CASHEW|PEKANNUSS|PISTAZIE|MACADAMIA)\b/.test(up) ||
      // L — Sellerie
      /\b(SELLERIE|SELLIERE)\b/.test(up) ||
      // M — Senf
      /\b(SENF)\b/.test(up) ||
      // N — Sesam
      /\b(SESAM)\b/.test(up) ||
      // P — Lupinen
      /\b(LUPINEN?)\b/.test(up)
    );
  }

  function renderZutatItems(text){
    return text.split(/[,]+/).map(s=>s.trim()).filter(Boolean).map(item=>{
      return isZutatAllergen(item)
        ? `<strong style="color:#92400E;">${item}</strong>`
        : item;
    }).join(' · ');
  }

  function renderDishCard(name, zutaten, allergene, isToday=false){
    // allergene can be {main:[], dressing:[]} or a plain string (from Supabase)
    let mainCodes=[], dressingCodes=[];
    if(typeof allergene==='object' && allergene!==null){
      mainCodes=allergene.main||[];
      dressingCodes=allergene.dressing||[];
    } else if(typeof allergene==='string'){
      // parse string: "A,G,L,C" or from Supabase array stored as string
      mainCodes=allergene.split(/[,\s\-]+/).map(c=>c.trim().toUpperCase()).filter(c=>c&&/^[A-R]$/.test(c));
    }
    const sections = parseZutatenSections(zutaten);
    const hasAllergene = mainCodes.length>0 || dressingCodes.length>0;
    return `<div class="card" style="padding:14px;margin-bottom:10px;${isToday?'border-left:3px solid var(--green);':''}" data-gericht="${name.toLowerCase()}">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px;">${name}</div>
      <div style="margin-bottom:10px;">
        <span style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;">⚠️ ALLERGENE&nbsp;&nbsp;</span>
        ${hasAllergene
          ? `<strong style="font-size:14px;color:#92400E;letter-spacing:.06em;">${mainCodes.join(', ')}${dressingCodes.length?`<span style="font-size:11px;font-weight:400;color:#78350F;margin-left:8px;">· Dressing: <strong>${dressingCodes.join(', ')}</strong></span>`:''}
</strong>`
          : `<span style="font-size:12px;color:var(--muted);">–</span>`}
      </div>
      ${sections.length?`<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:6px;">🧂 ZUTATEN</div>
      ${sections.map(sec=>`
        ${sec.label?`<div style="font-size:10px;font-weight:700;color:#185FA5;letter-spacing:.05em;margin:6px 0 3px;">🥗 DRESSING</div>`:''}
        <div style="font-size:12px;color:var(--sub);line-height:1.8;">${renderZutatItems(sec.text)}</div>
      `).join('')}`:''}
    </div>`;
  }

  if(todayMenu.length){
    const validDishes = todayMenu.filter(d=>d.name&&!d.name.startsWith('ÖL')&&!d.name.startsWith('ZUTATEN'));
    if(validDishes.length){
      html+=`<div style="font-size:11px;font-weight:700;color:var(--green);letter-spacing:.05em;margin-bottom:8px;">📋 HEUTE</div>`;
      validDishes.forEach(dish=>{
        const override=(allergeneCache||[]).find(e=>e.gericht===dish.name);
        // Zutaten: Supabase override takes priority if filled
        const zutaten = (override?.zutaten?.trim()) || dish.zutaten || '';
        // Allergene: MENU_DATA is the source of truth (has main+dressing)
        // Only use Supabase codes if they're actually set AND non-empty
        let allergene = dish.allergene || {main:[],dressing:[]};
        if(override?.allergene_codes?.length){
          allergene = {
            main: override.allergene_codes,
            dressing: dish.allergene?.dressing || []
          };
        }
        html += renderDishCard(dish.name, zutaten, allergene, true);
      });
    }
  }

  if((list||[]).length){
    if(todayMenu.length) html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:14px 0 8px;">📂 ALLE GERICHTE</div>`;
    list.forEach(entry=>{
      // Supabase stores codes as array, wrap in {main, dressing} structure
      const codes = entry.allergene_codes||[];
      const dressing = entry.dressing_allergene_codes||[];
      html+=renderDishCard(entry.gericht, entry.zutaten||'', {main:codes, dressing});
    });
  } else if(!todayMenu.length){
    html='<div style="font-size:13px;color:var(--muted);padding:8px 2px;">Noch keine Gerichte angelegt.</div>';
  }
  wrap.innerHTML=html;
}

function filterAllergeneCheatsheet(){
  const q=document.getElementById('all-search').value.toLowerCase();
  // Filter both today's menu and Supabase list
  const filteredMenu=getTodayMenu()?.filter(d=>d.name?.toLowerCase().includes(q))||[];
  renderAllergeneCheatlist(allergeneCache.filter(e=>e.gericht.toLowerCase().includes(q)), filteredMenu);
}

async function buildSchulungMatrixHtml(){
  const [themen, stores, entries] = await Promise.all([
    api('schulungsthemen?select=*&order=titel.asc').catch(()=>[]),
    api('stores?select=id,name&order=id').catch(()=>[]),
    api('schulungen?select=*').catch(()=>[])
  ]);
  const storeList=(stores||[]).filter(s=>s.id!=='zentrale' && s.id!=='1070');
  if(!themen?.length || !storeList.length) return '<div style="font-size:13px;color:var(--muted);padding:8px 2px;">Noch keine Themen oder Filialen vorhanden.</div>';
  const latest={};
  (entries||[]).forEach(e=>{
    const key=e.thema_id+'|'+e.store_id;
    if(!latest[key] || new Date(e.datum)>new Date(latest[key])) latest[key]=e.datum;
  });
  let html=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr><th style="text-align:left;">Thema</th>${storeList.map(s=>`<th data-no-translate>${s.name}</th>`).join('')}</tr></thead><tbody>`;
  themen.forEach(t=>{
    html+=`<tr><td>${t.titel}</td>`;
    storeList.forEach(s=>{
      const d=latest[t.id+'|'+s.id];
      let cell;
      if(!d){
        cell='<span class="badge badge-warn">nie</span>';
      }else{
        const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-t.intervall_monate);
        const dd=new Date(d).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});
        cell=(new Date(d)>=cutoff)?`<span class="badge badge-ok">${dd}</span>`:`<span class="badge badge-warn">${dd}</span>`;
      }
      html+=`<td>${cell}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

async function saveSchulungThema(){
  const titel=document.getElementById('sch-titel').value.trim();
  const erklaerung=document.getElementById('sch-erklaerung').value.trim();
  const intervall=parseInt(document.getElementById('sch-intervall').value)||12;
  if(!titel){ alert('Bitte ein Thema eingeben.'); return; }
  try{
    await api('schulungsthemen',{method:'POST',body:JSON.stringify([{titel,erklaerung,intervall_monate:intervall}])});
  }catch(e){ console.error(e); alert('Fehler beim Speichern.'); return; }
  document.getElementById('sch-titel').value='';
  document.getElementById('sch-erklaerung').value='';
  document.getElementById('sch-intervall').value='12';
  refreshSchulungThemenAdmin();
  fillSchulungDropdowns();
}

async function deleteSchulungThema(id){
  if(!confirm('Thema wirklich löschen? Bereits eingetragene Schulungen bleiben als Verlauf erhalten.')) return;
  try{ await api(`schulungsthemen?id=eq.${id}`,{method:'DELETE'}); }catch(e){ console.error(e); return; }
  refreshSchulungThemenAdmin();
  fillSchulungDropdowns();
}

async function loadLatestHygienePerson(){
  const wrap=document.getElementById('hs-latest-person');
  if(!wrap) return;
  const entries=await api(`hygiene_schulungen?stores=ilike.*${currentStore.id}*&select=*&order=datum.desc&limit=1`).catch(()=>[]);
  const last=entries?.[0];
  if(!last){
    wrap.innerHTML=`<span style="color:var(--muted);font-size:13px;">Noch keine Schulung für diese Filiale eingetragen.</span>`;
    return;
  }

  wrap.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline;">

}

function toggleHsChip(el, kind, val){
  const set = kind==='store'?hygieneSelectedStores:hygieneSelectedInhalte;
  const selected = set.has(val);
  if(selected) set.delete(val); else set.add(val);
  if(kind==='store'){
    el.style.borderColor = selected?'var(--border)':'var(--green)';
    el.style.background = selected?'var(--card)':'var(--green-light)';
    el.style.color = selected?'var(--sub)':'var(--green)';
  } else {
    const box = el.querySelector('.check-box');
    box.classList.toggle('done', !selected);
    box.innerHTML = !selected ? CHECK_SVG : '';
  }
}
window.toggleHsChip=toggleHsChip;

async function saveHygieneSchulung(){
  const name=document.getElementById('hs-name')?.value.trim();
  const datum=document.getElementById('hs-datum')?.value;
  const trainer=document.getElementById('hs-trainer')?.value;
  if(!name){ showToast('Bitte Namen eingeben'); return; }
  if(!hygieneSelectedStores.size){ showToast('Bitte mindestens eine Filiale wählen'); return; }
  if(!datum){ showToast('Bitte Datum wählen'); return; }
  if(!trainer){ showToast('Bitte auswählen, wer die Schulung durchgeführt hat'); return; }
  if(!hygieneSelectedInhalte.size){ showToast('Bitte mindestens einen Inhalt anhaken'); return; }
  const storesStr=[...hygieneSelectedStores].join(',');
  const inhalteStr=[...hygieneSelectedInhalte].sort((a,b)=>a-b).map(i=>HYGIENE_INHALTE[i]).join(', ');
  try{
    await api('hygiene_schulungen',{method:'POST',body:JSON.stringify([{name,stores:storesStr,datum,durchgefuehrt_von:trainer,inhalte:inhalteStr}])});
    showToast('✔ Schulung protokolliert');
    renderHygieneSchulung();
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}

let hsOrgData = {byName:{}, storeMap:{}}; // Cache für die Client-seitige Filterung

  const wrap=document.getElementById('hs-org-list');
  if(!wrap) return;
  const entries=await api('hygiene_schulungen?select=*&order=datum.desc').catch(()=>[]);
  const storeMap=Object.fromEntries((storeList||[]).map(s=>[s.id,s.name]));
  const byName={};
  (entries||[]).forEach(e=>{
    if(!byName[e.name] || new Date(e.datum)>new Date(byName[e.name].datum)) byName[e.name]=e;
  });
  hsOrgData={byName, storeMap};
  const names=Object.keys(byName).sort();

  let html=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
    <select id="hs-filter-store" onchange="renderHsFilteredTable()" style="flex:1;min-width:100px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px;box-sizing:border-box;" data-no-translate>
      <option value="">Alle Standorte</option>
      ${storeList.map(s=>`<option value="${s.id}" ${defaultStoreFilter===s.id?'selected':''}>${s.name}</option>`).join('')}
    </select>
    <select id="hs-filter-person" onchange="renderHsFilteredTable()" style="flex:1;min-width:100px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px;box-sizing:border-box;" data-no-translate>
      <option value="">Alle Mitarbeitenden</option>
      ${names.map(n=>`<option value="${n}">${n}</option>`).join('')}
    </select>
    <select id="hs-filter-status" onchange="renderHsFilteredTable()" style="flex:1;min-width:100px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px;box-sizing:border-box;">
      <option value="">Alle Status</option>
      <option value="ausstaendig">Nur ausständige</option>
    </select>
  </div>
  <div id="hs-table-body"></div>
  <div style="font-size:10.5px;color:var(--muted);padding:6px 2px;">Eine Schulung gilt genau 1 Jahr — danach automatisch "ausständig".</div>`;

  wrap.innerHTML=html;
  renderHsFilteredTable();
  checkAndNotifyOverdueHygiene(byName).catch(e=>console.error(e));
}

function renderHsFilteredTable(){
  const {byName, storeMap}=hsOrgData;
  const storeFilter=document.getElementById('hs-filter-store')?.value||'';
  const personFilter=document.getElementById('hs-filter-person')?.value||'';
  const statusFilter=document.getElementById('hs-filter-status')?.value||'';
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-12); // Schulung ist genau 1 Jahr gültig

  let names=Object.keys(byName).sort();
  if(personFilter) names=names.filter(n=>n===personFilter);
  if(storeFilter) names=names.filter(n=>(byName[n].stores||'').split(',').map(x=>x.trim()).includes(storeFilter));
  if(statusFilter==='ausstaendig') names=names.filter(n=>new Date(byName[n].datum)<cutoff);

  const wrap=document.getElementById('hs-table-body');
  if(!wrap) return;
  if(!names.length){
    wrap.innerHTML=`<div class="card" style="padding:14px;text-align:center;color:var(--muted);font-size:13px;">Keine Einträge für diese Auswahl</div>`;
    return;
  }
  let html=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table" style="width:100%;">
    <thead><tr><th style="text-align:left;">Person</th><th style="text-align:left;">Filiale(n)</th><th>Zuletzt</th><th>Von</th><th>Status</th></tr></thead><tbody>`;
  names.forEach(n=>{
    const e=byName[n];
    const overdue=new Date(e.datum)<cutoff;
    const storeNames=(e.stores||'').split(',').filter(Boolean).map(id=>storeMap[id.trim()]||id.trim()).join(', ');
    html+=`<tr><td style="text-align:left;font-weight:500;font-size:12px;" data-no-translate>${n}</td><td style="text-align:left;font-size:11px;" data-no-translate>${storeNames}</td><td style="font-size:12px;">${new Date(e.datum).toLocaleDateString('de-AT')}</td><td style="font-size:11px;" data-no-translate>${e.durchgefuehrt_von}</td><td>${overdue?'<span class="badge badge-warn">ausständig</span>':'<span class="badge badge-ok">aktuell</span>'}</td></tr>`;
  });
  html+='</tbody></table></div></div>';
  wrap.innerHTML=html;
}
window.renderHsFilteredTable=renderHsFilteredTable;

async function checkAndNotifyOverdueHygiene(byName){
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-12);
  const overdueNames=Object.keys(byName).filter(n=>new Date(byName[n].datum)<cutoff);
  if(!overdueNames.length) return;
  // Nicht jedes Mal beim Öffnen der Seite erneut mailen — nur wenn seit der letzten Erinnerung
  // für diese Person mind. 30 Tage vergangen sind (oder noch nie erinnert wurde).
  const notified=await api('hygiene_notifications?select=name,notified_at').catch(()=>[]);
  const notifiedMap=Object.fromEntries((notified||[]).map(x=>[x.name,x.notified_at]));
  const toNotify=overdueNames.filter(n=>{
    const last=notifiedMap[n];
    if(!last) return true;
    const daysSince=(Date.now()-new Date(last).getTime())/86400000;
    return daysSince>30;
  });
  if(!toNotify.length) return;
  try{
    await emailjs.send('service_xla195w','template_9uiq1wf',{
      name: 'Hygiene-Schulung fällig',
      time: new Date().toLocaleString('de-AT'),
      message: `Folgende Personen sind mit ihrer Hygiene-Schulung überfällig (älter als 12 Monate):\n\n${toNotify.map(n=>`- ${n} (zuletzt: ${new Date(byName[n].datum).toLocaleDateString('de-AT')})`).join('\n')}\n\nBitte neue Schulung einplanen.`,
      title: 'Hygiene-Schulung fällig',
      to_email: 'tini@karmafood.at'
    });
    const today=new Date().toISOString().split('T')[0];
    for(const n of toNotify){
      await api(`hygiene_notifications?name=eq.${encodeURIComponent(n)}`,{method:'DELETE'});
      await api('hygiene_notifications',{method:'POST',body:JSON.stringify([{name:n, notified_at:today}])});
    }
  }catch(e){console.error('Hygiene-Erinnerungs-Mail fehlgeschlagen', e);}
}

async function saveDailyCheckAll(){
  const today=new Date().toISOString().split('T')[0];
  const tempRows=[...document.querySelectorAll('[id^="wek-temp-row-"]')].filter(r=>r.style.display!=='none');
  if(!tempRows.length){ showToast('Bitte mindestens eine angelieferte Ware auswählen'); return; }
  const temperaturen={};
  let anyInvalid=false, minTemp=null;
  tempRows.forEach(row=>{
    const input=row.querySelector('input');
    const dish=input?.dataset.dish;
    const v=parseFloat(input?.value);
    if(isNaN(v)){ anyInvalid=true; return; }
    if(dish) temperaturen[dish]=v;
    if(minTemp===null||v<minTemp) minTemp=v;
  });
  if(anyInvalid || minTemp===null){ showToast('Bitte bei jedem Gericht eine Temperatur eintragen'); return; }
  const massnahmeEl=document.getElementById('wek-massnahme');
  const massnahme=massnahmeEl?massnahmeEl.value.trim():'';
  if(minTemp<65 && !massnahme){ showToast('Bitte Maßnahme bei Temperatur unter 65° eintragen'); return; }
  const klein=parseFloat(document.getElementById('kuehl-klein')?.value);
  const gross=parseFloat(document.getElementById('kuehl-gross')?.value);
  if(isNaN(klein)||isNaN(gross)){ showToast('Bitte beide Kühltemperaturen eintragen'); return; }
  const ware=getSelectedWaren()||'';
  const wareOk=document.getElementById('wek-ware-ok-box')?.dataset.value==='1';
  try{
    await Promise.all([
      (async()=>{
        await api(`wareneingang?store_id=eq.${currentStore.id}&datum=eq.${today}`,{method:'DELETE'});
        await api('wareneingang',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,datum:today,lieferant:FIXER_LIEFERANT||null,ware:ware||null,ware_ok:wareOk,temperatur:minTemp,temperaturen,massnahme:massnahme||null,mitarbeiter:currentStore.name}])});
      })(),
      (async()=>{
        await api(`kuehleinrichtungen?store_id=eq.${currentStore.id}&datum=eq.${today}`,{method:'DELETE'});
        await api('kuehleinrichtungen',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,datum:today,temp_klein:klein,temp_gross:gross,mitarbeiter:currentStore.name}])});
      })()
    ]);
    showToast('✔ Daily Check-up gespeichert!');
    goTo('waehrend');
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}

          ${badges || '<span style="font-size:11px;color:var(--muted);">keine Allergene angegeben</span>'}
        </div>
      </div>`;
    });
  }

  html+=`<div style="margin-top:12px;">
    <button onclick="goTo('allergene')" style="width:100%;background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;font-weight:500;color:var(--green);">
      <span>📋 Alle Zutaten im Detail nachschlagen</span><span>→</span>
    </button>
  </div>

  <div style="margin-top:8px;">
    <button onclick="goTo('home')" style="width:100%;background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;">
      ✓ Zur Startseite — guten Service! 🌟
    </button>
  </div>
  <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px;">Entsorgung bitte am Ende der Schicht eintragen</div>`;

  el.innerHTML=html;
  translateEl(el);
}

function toggleWareChip(el, ware, i){
  const selected=el.style.borderColor==='var(--green)'||el.style.borderColor==='rgb(15, 110, 86)';
  el.style.borderColor=selected?'var(--border)':'var(--green)';
  el.style.background=selected?'var(--card)':'var(--green-light)';
  el.style.color=selected?'var(--sub)':'var(--green)';
  if(i!=null){
    const row=document.getElementById('wek-temp-row-'+i);
    if(row) row.style.display=selected?'none':'flex';
  }
  checkWareneingangTemp();
}
function getSelectedWaren(){
  const chips=document.querySelectorAll('#wek-ware-chips div');
  const sel=[];
  chips.forEach(c=>{if(c.style.color==='var(--green)'||c.style.color==='rgb(15, 110, 86)')sel.push(c.textContent.trim());});
  return sel.join(', ');
}

function toggleWareOkUI(){
  const box=document.getElementById('wek-ware-ok-box');
  const next=!(box.dataset.value==='1');
  box.dataset.value=next?'1':'0';
  box.classList.toggle('done', next);
  box.innerHTML=next?'<svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>':'';
}

function checkWareneingangTemp(){
  const rows=document.querySelectorAll('[id^="wek-temp-row-"]');
  let anyLow=false;
  rows.forEach(row=>{
    if(row.style.display==='none') return;
    const v=parseFloat(row.querySelector('input')?.value);
    if(!isNaN(v) && v<65) anyLow=true;
  });
  const wrap=document.getElementById('wek-massnahme-wrap');
  if(wrap) wrap.style.display=anyLow?'block':'none';
}

async function toggleReinigungField(field, itemEl){
  const today=new Date().toISOString().split('T')[0];
  const cur=(await api(`reinigungsprotokoll?store_id=eq.${currentStore.id}&datum=eq.${today}&select=reinigung_erledigt,desinfektion_erledigt`).catch(()=>[]))[0]||{};
  const updated={reinigung_erledigt:!!cur.reinigung_erledigt, desinfektion_erledigt:!!cur.desinfektion_erledigt};
  updated[field]=!updated[field];
  try{
    await api(`reinigungsprotokoll?store_id=eq.${currentStore.id}&datum=eq.${today}`,{method:'DELETE'});
    await api('reinigungsprotokoll',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,datum:today,...updated,mitarbeiter:currentStore.name}])});
    showToast('✔ Gespeichert');
    // Diese Funktion lebt nur noch auf der Schichtende-Seite. Ein voller Reload ist hier sicher —
    // wir sichern nur einen evtl. noch nicht gespeicherten Übergabe-Notiz-Entwurf davor.
    const notizDraft=document.getElementById('uebergabe-text')?.value||'';
    await renderSchichtende();
    if(notizDraft){ const ta=document.getElementById('uebergabe-text'); if(ta && !ta.value) ta.value=notizDraft; }
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}

async function saveKuehleinrichtungen(){
  const klein=parseFloat(document.getElementById('kuehl-klein').value);
  const gross=parseFloat(document.getElementById('kuehl-gross').value);
  if(isNaN(klein)||isNaN(gross)){ showToast('Bitte beide Temperaturen eingeben'); return; }
  const today=new Date().toISOString().split('T')[0];
  try{
    await api(`kuehleinrichtungen?store_id=eq.${currentStore.id}&datum=eq.${today}`,{method:'DELETE'});
    await api('kuehleinrichtungen',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,datum:today,temp_klein:klein,temp_gross:gross,mitarbeiter:currentStore.name}])});
    showToast('✔ Gespeichert');
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}

// ---- MÄNGEL / SCHADENSMELDUNG ----
async function renderMaengel(){
  const el=document.getElementById('v-maengel');
  const isOrg=currentStore?.id==='zentrale';
  if(isOrg){
    const [rows, stores] = await Promise.all([
      api('maengel?select=*&order=gemeldet_am.desc').catch(()=>[]),
      api('stores?select=id,name').catch(()=>[])
    ]);
    const storeMap=Object.fromEntries((stores||[]).map(s=>[s.id,s.name]));
    const statusLabel={offen:'offen',in_bearbeitung:'in Bearbeitung',behoben:'abgeschlossen'};
    const statusClass={offen:'badge-warn',in_bearbeitung:'badge-info',behoben:'badge-ok'};
    el.innerHTML=(rows||[]).map(m=>{
      const status=m.status||'offen';
      return `
      <div class="card" style="padding:12px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <strong data-no-translate>${storeMap[m.store_id]||m.store_id}</strong>
          <span class="badge ${statusClass[status]||'badge-warn'}">${statusLabel[status]||status}</span>
        </div>
        <div style="font-size:13px;color:var(--sub);margin-top:6px;">${m.beschreibung}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">gemeldet: ${new Date(m.gemeldet_am).toLocaleDateString('de-AT')}${m.gemeldet_von?' · '+m.gemeldet_von:''}${m.behoben_am?` · abgeschlossen: ${new Date(m.behoben_am).toLocaleDateString('de-AT')}`:''}</div>
        ${status!=='behoben'?`<div style="margin-top:8px;display:flex;gap:8px;">
          ${status==='offen'?`<button onclick="setMangelStatus(${m.id},'in_bearbeitung')" style="background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:#0369A1;cursor:pointer;">▶ In Bearbeitung</button>`:''}
          <button onclick="setMangelStatus(${m.id},'behoben')" style="background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--green);cursor:pointer;">✓ Abschließen</button>
        </div>`:''}
      </div>
    `;}).join('') || '<div style="font-size:13px;color:var(--muted);padding:8px 2px;">Keine Meldungen vorhanden.</div>';
    translateEl(el);
    return;
  }
  el.innerHTML = `
    <div class="section-lbl" style="color:var(--green);">🔧 Schaden melden</div>
    <div class="card" style="padding:14px;">
      <textarea id="mangel-text" placeholder="Was ist kaputt oder fehlt? (z.B. Handwaschbecken defekt)" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:14px;min-height:100px;resize:vertical;font-family:inherit;box-sizing:border-box;"></textarea>
      <button class="submit-btn" onclick="sendMangelMeldung()">Schaden melden ✓</button>
    </div>
  `;
  translateEl(el);
}

async function sendMangelMeldung(){
  const text=document.getElementById('mangel-text')?.value?.trim();
  if(!text){ showToast('Bitte Beschreibung eingeben'); return; }
  const now=new Date().toLocaleString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  try{
    await api('maengel',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,beschreibung:text,gemeldet_von:currentStore.name,status:'offen'}])});
    await emailjs.send('service_xla195w','template_9uiq1wf',{
      name: currentStore.name+' — Schadensmeldung',
      time: now,
      message: text,
      title: 'Karma Food Schadensmeldung',
      to_email: 'tini@karmafood.at'
    });
    showToast('✓ Gemeldet & E-Mail verschickt!');
    document.getElementById('mangel-text').value='';
  }catch(e){console.error(e);showToast('Fehler — bitte nochmal versuchen');}
}

async function setMangelStatus(id, newStatus){
  try{
    const rows=await api(`maengel?id=eq.${id}&select=*`).catch(()=>[]);
    const m=(rows||[])[0];
    if(!m) return;
    await api(`maengel?id=eq.${id}`,{method:'DELETE'});
    await api('maengel',{method:'POST',body:JSON.stringify([{
      store_id:m.store_id, beschreibung:m.beschreibung, gemeldet_am:m.gemeldet_am, gemeldet_von:m.gemeldet_von,
      status:newStatus,
      behoben_am:newStatus==='behoben'?new Date().toISOString():null,
      behoben_von:newStatus==='behoben'?(currentStore?.name||'Organisation'):null
    }])});
    renderMaengel();
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}
window.setMangelStatus=setMangelStatus;

// ---- SCHICHTENDE ----
async function renderSchichtende(){
  const el=document.getElementById('v-schichtende');
  const today=new Date().toISOString().split('T')[0];
  const tomorrow=new Date(Date.now()+86400000).toISOString().split('T')[0];

  // Alle Daten parallel laden
  const [clTemplates, clDoneToday, disposalToday, wochensalatToday, wekToday, reinToday, kuehlToday, uebergabeToday, ordersToday, kcSubToday, forecastTomorrow] = await Promise.all([
    api('checklist_templates?list_type=eq.abschluss&select=id').catch(()=>[]),
    api(`checklist_done?store_id=eq.${currentStore.id}&done_date=eq.${today}&select=template_id`).catch(()=>[]),
    api(`disposal?store_id=eq.${currentStore.id}&disposal_date=eq.${today}&select=id`).catch(()=>[]),
    api(`wochensalat_restbestand?store_id=eq.${currentStore.id}&report_date=eq.${today}&select=id`).catch(()=>[]),
    api(`wareneingang?store_id=eq.${currentStore.id}&datum=eq.${today}&select=id`).catch(()=>[]),
    api(`reinigungsprotokoll?store_id=eq.${currentStore.id}&datum=eq.${today}&select=reinigung_erledigt,desinfektion_erledigt`).catch(()=>[]),
    api(`kuehleinrichtungen?store_id=eq.${currentStore.id}&datum=eq.${today}&select=id`).catch(()=>[]),
    api(`schicht_uebergabe?store_id=eq.${currentStore.id}&datum=eq.${today}&select=*`).catch(()=>[]),
    api(`orders?store_id=eq.${currentStore.id}&order_date=eq.${today}&select=article_id`).catch(()=>[]),
    api(`kc_submissions?store_id=eq.${currentStore.id}&order_date=eq.${today}&select=id`).catch(()=>[]),
    api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=eq.${tomorrow}&select=id`).catch(()=>[])
  ]);

  const clDoneIds=new Set((clDoneToday||[]).map(x=>x.template_id));
  const clTotal=(clTemplates||[]).length;
  const clDoneCount=(clTemplates||[]).filter(t=>clDoneIds.has(t.id)).length;
  const sweetsDone=(ordersToday||[]).some(o=>articles.find(a=>a.id===o.article_id&&a.category==='Sweets'));
  const transporterDone=(ordersToday||[]).some(o=>articles.find(a=>a.id===o.article_id&&TRANSPORTER_CATS.includes(a.category)));
  const kcDone=(kcSubToday||[]).length>0;
  const forecastDone=(forecastTomorrow||[]).length>0;

  const schritte=[
    {id:'dailycheck', label:'Daily Check-up vollständig', sub:'Wareneingang & Kühlung', done:(wekToday||[]).length>0 && (kuehlToday||[]).length>0, link:'dailycheck', group:'kueche'},
    {id:'entsorgung', label:'Entsorgung eingetragen', sub:'Restmengen aller Gerichte', done:(disposalToday||[]).length>0, link:'disposal', group:'kueche'},
    {id:'forecast_menge', label:'Portionsmengen für morgen', sub:'Forecast anpassen/bestätigen', done:forecastDone, link:'order', orderTab:'forecast', group:'kueche'},
    {id:'wochensalat', label:'Wochensalat-Meldung', sub:'Restmenge & Bedarf für morgen', done:(wochensalatToday||[]).length>0, link:'order', orderTab:'kueche', group:'kueche'},
    {id:'reinigung_protokoll', label:'Reinigung & Desinfektion', sub:'Endreinigung bestätigen', done:!!(reinToday||[])[0]?.reinigung_erledigt && !!(reinToday||[])[0]?.desinfektion_erledigt, link:null, group:'kueche'},
    {id:'sweets', label:'Sweets bestellt', sub:'Bestellung für morgen', done:sweetsDone, link:'order', orderTab:'sweets', group:'bestellungen'},
    {id:'transporter', label:'Transporter bestellt', sub:'Verpackungen, Reinigung, Food & Drinks', done:transporterDone, link:'order', orderTab:'transporter', group:'bestellungen'},
    {id:'kc', label:'KC ausgefüllt', sub:'IST-Bestände der Webshop-Produkte', done:kcDone, link:'order', orderTab:'kc', group:'bestellungen'},
    {id:'uebergabe', label:'Übergabe-Notiz', sub:'Hinweise für die nächste Schicht', done:(uebergabeToday||[]).length>0 && (uebergabeToday[0]?.notiz?.trim()?.length>0), link:null, group:'sonstiges'},
    {id:'abschluss', label:'Abschluss-Checkliste', sub:`${clDoneCount} von ${clTotal} Punkten — optionale Hilfe`, done:clDoneCount===clTotal && clTotal>0, link:'check', group:'sonstiges', optional:true}
  ];
  const GROUP_LABELS={kueche:'🍽️ Küche & Tagesablauf', bestellungen:'📦 Bestellungen', sonstiges:'📋 Sonstiges'};

  const SCHRITT_META={
    abschluss: {emoji:'💡', label:'Abschluss-Checkliste (optionale Hilfe)', sub:`${clDoneCount} von ${clTotal} Punkten — kein Pflichtschritt`, link:'check'},
    entsorgung: {emoji:'🗑️', label:'Entsorgung eingetragen', sub:'Restmengen aller Gerichte', link:'disposal'},
    forecast_menge: {emoji:'📅', label:'Portionsmengen für morgen', sub:'Forecast anpassen/bestätigen', link:'order', orderTab:'forecast'},
    wochensalat: {emoji:'🥗', label:'Wochensalat-Meldung', sub:'Restmenge & Bedarf für morgen', link:'order', orderTab:'kueche'},
    dailycheck: {emoji:'🌡️', label:'Daily Check-up', sub:'Wareneingang · Kühlung', link:'dailycheck'},
    reinigung_protokoll: {emoji:'🧽', label:'Reinigung & Desinfektion', sub:'Endreinigung bestätigen', link:null},
    sweets:     {emoji:'🍰', label:'Sweets bestellt', sub:'Bestellung für morgen', link:'order', orderTab:'sweets'},
    transporter:{emoji:'🚚', label:'Transporter bestellt', sub:'Verpackungen & Reinigung', link:'order', orderTab:'transporter'},
    kc:         {emoji:'📦', label:'KC ausgefüllt', sub:'IST-Bestände Webshop', link:'order', orderTab:'kc'},
    uebergabe:  {emoji:'✍️', label:'Übergabe-Notiz', sub:'Hinweis für nächste Schicht', link:null}
  };

  const requiredSteps=schritte.filter(s=>!s.optional);
  const open=schritte.filter(s=>!s.done);
  const done=schritte.filter(s=>s.done);
  const requiredOpen=requiredSteps.filter(s=>!s.done);
  const allDone=requiredOpen.length===0; // optionale Schritte (Abschluss-Checkliste) blockieren den Abschluss nicht
  const alreadySubmitted=(uebergabeToday||[]).length>0 && allDone;

  let html=backToHomeHtml();

  if(alreadySubmitted){
    html+=`<div style="background:var(--green-light);border:1.5px solid var(--green);border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;">
      <div style="font-size:30px;margin-bottom:8px;">🌙</div>
      <div style="font-weight:600;color:var(--green);font-size:16px;">Schicht abgeschlossen!</div>
      <div style="font-size:12px;color:var(--sub);margin-top:4px;">Zusammenfassung wurde an Tini geschickt.</div>
    </div>`;
  } else {
    // Fortschrittsanzeige + spielerische, motivierende Ansage statt nackter Liste
    const pct=requiredSteps.length?Math.round((requiredSteps.length-requiredOpen.length)/requiredSteps.length*100):100;
    const encouragement = pct===0?'Los geht\'s! 💪' : pct<50?'Weiter so! 🔥' : pct<100?'Fast geschafft! 🎉' : 'Alles bereit! ✨';
    html+=`<div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <span style="font-size:14px;font-weight:600;">${encouragement}</span>
        <span style="font-size:12px;color:var(--muted);">${requiredSteps.length-requiredOpen.length} von ${requiredSteps.length}</span>
      </div>
      <div class="progress-bar" style="margin-bottom:0;"><div class="progress-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }

  // OFFENE SCHRITTE — nach Themen gruppiert, damit es nicht wie eine riesige Liste wirkt
  if(open.length>0){
    const GROUP_ORDER=['kueche','bestellungen','sonstiges'];
    GROUP_ORDER.forEach(g=>{
      const groupSteps=open.filter(s=>s.group===g && !s.optional);
      if(!groupSteps.length) return;
      html+=`<div class="section-lbl" style="margin-top:10px;">${GROUP_LABELS[g]}</div>`;
      groupSteps.forEach(s=>{
        const m=SCHRITT_META[s.id];
        const returnableTabs=['sweets','transporter','kc'];
        const setFlag=(m.orderTab && returnableTabs.includes(m.orderTab))?'schichtendeReturnFlag=true;':'';
        const linkFn=m.orderTab?`${setFlag}goToReminder('order','${m.orderTab}')`:m.link?`goTo('${m.link}')`:null;
        const isReinigung=s.id==='reinigung_protokoll';
        html+=`<div class="card" style="padding:14px;margin-bottom:8px;border:1.5px solid var(--border);${s.id==='uebergabe'?'border-color:#BA7517;':''}">
          <div style="display:flex;align-items:center;gap:12px;">
            <span style="font-size:24px;flex-shrink:0;">${m.emoji}</span>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:14px;">${m.label}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:1px;">${m.sub}</div>
            </div>
            ${linkFn?`<button onclick="${linkFn}" style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;">→</button>`:''}
          </div>
          ${s.id==='uebergabe'?`<textarea id="uebergabe-text" placeholder="Was soll die nächste Schicht wissen?" style="width:100%;margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;min-height:80px;resize:vertical;font-family:inherit;box-sizing:border-box;"></textarea><button class="submit-btn" style="margin-top:8px;" onclick="saveUebergabeNotiz()">Notiz speichern ✔</button>`:''}
          ${isReinigung?(()=>{
            const r=(reinToday||[])[0];
            return `<div style="margin-top:10px;border-top:0.5px solid var(--border);padding-top:8px;">
              <div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;">Vorreinigen → Hauptreinigen → Desinfizieren → Nachspülen → Trocknen</div>
              <div class="cl-item" onclick="toggleReinigungField('reinigung_erledigt', this)">
                <div class="check-box${r?.reinigung_erledigt?' done':''}">${r?.reinigung_erledigt?'<svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
                <span class="cl-text">Reinigung erledigt</span>
              </div>
              <div class="cl-item" onclick="toggleReinigungField('desinfektion_erledigt', this)">
                <div class="check-box${r?.desinfektion_erledigt?' done':''}">${r?.desinfektion_erledigt?'<svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
                <span class="cl-text">Desinfektion erledigt</span>
              </div>
            </div>`;
          })():''}
        </div>`;
      });
    });

    if(!alreadySubmitted && allDone){
      html+=`<button class="submit-btn" style="margin-top:8px;font-size:15px;padding:14px;" onclick="submitSchichtende()">🌙 Schicht abschließen & E-Mail senden</button>`;
    }
  } else if(!alreadySubmitted){
    html+=`<button class="submit-btn" style="font-size:15px;padding:14px;margin-bottom:16px;" onclick="submitSchichtende()">🌙 Schicht abschließen & E-Mail senden</button>`;
  }

  // ERLEDIGTE SCHRITTE
  if(done.length>0){
    html+=`<div style="display:flex;align-items:center;gap:8px;margin:${open.length?'20px':'8px'} 0 10px;">
      <div style="flex:1;height:1px;background:var(--border);"></div>
      <span style="font-size:11px;color:var(--muted);font-weight:500;">✓ erledigt (${done.length})</span>
      <div style="flex:1;height:1px;background:var(--border);"></div>
    </div>`;
    html+=`<div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    done.forEach(s=>{
      const m=SCHRITT_META[s.id];
      html+=`<div style="background:#F8FDF9;border:0.5px solid #9FE1CB;border-radius:20px;padding:5px 10px;font-size:12px;color:var(--green);display:flex;align-items:center;gap:4px;">
        <span>${m.emoji}</span>
        <span>${m.label}</span>
        <svg width="10" height="10" viewBox="0 0 24 24" stroke="var(--green)" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
      </div>`;
    });
    html+=`</div>`;

    // Übergabe-Notiz von heute anzeigen wenn erledigt
    const uebergabeDone=done.find(s=>s.id==='uebergabe');
    if(uebergabeDone && uebergabeToday[0]?.notiz){
      html+=`<div style="margin-top:10px;background:#FFF7ED;border:0.5px solid #F97316;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub);">
        <div style="font-weight:500;color:#E0521F;margin-bottom:3px;">✍️ Deine Übergabe-Notiz</div>
        ${uebergabeToday[0].notiz}
      </div>`;
    }
  }

  // OPTIONALE SCHRITTE — separat & dezent, ganz unten, blockiert nichts
  const optionalOpen=open.filter(s=>s.optional);
  if(optionalOpen.length>0){
    html+=`<div style="margin-top:20px;">`;
    optionalOpen.forEach(s=>{
      const m=SCHRITT_META[s.id];
      const linkFn=m.link?`goTo('${m.link}')`:null;
      html+=`<div onclick="${linkFn}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:0.5px dashed var(--border);border-radius:10px;cursor:pointer;opacity:0.75;">

  const el=document.getElementById('v-pack');

    let html=pageHeaderHtml('📦','KC — Webshop-Produkte','Bestellung je Filiale (SOLL − IST)','#A855F7');

    <button class="pack-tab" onclick="switchTransporterSubTab('samosas')" style="border-color:${transporterSubTab==='samosas'?'#F97316':'var(--border)'};background:${transporterSubTab==='samosas'?'#FFF7ED':'var(--card)'};color:${transporterSubTab==='samosas'?'#F97316':'#1a1a18'};font-weight:${transporterSubTab==='samosas'?'600':'400'};">🥟 Samosas</button>
    <button class="pack-tab" onclick="switchTransporterSubTab('beilagen')" style="border-color:${transporterSubTab==='beilagen'?'#F97316':'var(--border)'};background:${transporterSubTab==='beilagen'?'#FFF7ED':'var(--card)'};color:${transporterSubTab==='beilagen'?'#F97316':'#1a1a18'};font-weight:${transporterSubTab==='beilagen'?'600':'400'};">🥗 Beilagen</button>

    return;
  }

    html+=await renderBeilagenTableHtml();
    el.innerHTML=html;
    translateEl(el);
    return;
  }

  // --- Bestellliste (Standard-Tab) ---
  const allOrdRaw=await api(`orders?order_date=eq.${today}&select=store_id,article_id,quantity,eingepackt`);
  const specRaw=await api(`special_orders?order_date=eq.${today}&select=store_id,note`).catch(()=>[]);
  const allOrd={};
  allOrdRaw.forEach(o=>{if(!allOrd[o.article_id])allOrd[o.article_id]={};allOrd[o.article_id][o.store_id]=o;});
  const activeColor='#F97316';

  html+=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Zahl antippen = als eingepackt markieren</div>`;

  let hasAny=false;
  TRANSPORTER_CATS.forEach(cat=>{
    const items=articles.filter(a=>a.category===cat&&storeList.some(s=>(allOrd[a.id]||{})[s.id]?.quantity>0));
    if(!items.length) return;
    hasAny=true;
    html+=`<div class="section-lbl" style="font-size:11px;color:var(--muted);font-weight:500;">${cat}</div><div class="card"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr><th>Artikel</th>`;
    storeList.forEach(s=>html+=`<th style="color:${STORE_COLORS[s.id]||'#888'};" data-no-translate>${s.name.split(' ')[0]}</th>`);
    html+=`<th style="color:${activeColor};">∑</th></tr></thead><tbody>`;
    items.forEach(a=>{
      const total=storeList.reduce((acc,s)=>acc+((allOrd[a.id]||{})[s.id]?.quantity||0),0);
      const verfuegbar=a.verfuegbar!==false;
      html+=`<tr><td><div style="display:flex;align-items:center;gap:6px;">

      });
      html+=`<td style="font-weight:600;color:${activeColor};background:${activeColor}10;">${total}</td></tr>`;
    });
    html+='</tbody></table></div></div>';
  });

  const specs=(specRaw||[]).filter(s=>s.store_id!=='zentrale' && s.store_id!=='1070');
  if(specs.length){
    html+=`<div class="section-lbl">📝 Sonderbestellungen</div><div class="card">`;
    specs.forEach(s=>{const store=stores.find(x=>x.id===s.store_id);const col=STORE_COLORS[s.store_id]||'#888';html+=`<div style="padding:9px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;"><span style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0;margin-top:3px;"></span><div><div style="font-size:12px;font-weight:500;" data-no-translate>${store?.name||s.store_id}</div><div style="font-size:13px;color:var(--sub);">${s.note}</div></div></div>`;});
    html+='</div>';
  }
  if(!hasAny&&!specs.length) html+='<div class="card" style="padding:2rem;text-align:center;color:var(--muted);font-size:14px;">Noch keine Bestellungen heute</div>';

  // Alle Transporter-Artikel — auch ohne heutige Bestellung, damit Lieferbarkeit VORAB gemeldet werden
  // kann (z.B. wenn Servietten leer sind, bevor überhaupt eine Filiale sie nachbestellt hat).
  // Gleiches Prinzip wie bei KC: erst die Artikel ohne Bestand-Daten aussortieren, aber jederzeit einsehbar.
  const notOrderedToday=[];
  TRANSPORTER_CATS.forEach(cat=>{
    articles.filter(a=>a.category===cat && !storeList.some(s=>(allOrd[a.id]||{})[s.id]?.quantity>0)).forEach(a=>notOrderedToday.push(a));
  });
  if(notOrderedToday.length){
    html+=`<details style="margin-top:10px;">
      <summary style="font-size:12px;color:var(--muted);cursor:pointer;padding:6px 2px;">Alle Artikel — Lieferbarkeit verwalten (${notOrderedToday.length})</summary>
      <div class="card" style="margin-top:6px;">`;
    notOrderedToday.forEach(a=>{
      const verfuegbar=a.verfuegbar!==false;
      html+=`<div class="item-row">
        <div style="display:flex;align-items:center;gap:10px;flex:1;">
          ${a.image_url?`<img src="${a.image_url}" alt="" style="width:32px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0;">`:''}
          <div>
            <div class="item-name">${a.name}</div>
            ${!verfuegbar?`<div style="font-size:11px;color:#DC2626;">${verfuegbarLabel(a)}</div>`:''}
          </div>
        </div>
        <button onclick="toggleArticleVerfuegbarPack(${a.id},${verfuegbar})" style="background:${verfuegbar?'var(--green-light)':'#FEE2E2'};color:${verfuegbar?'var(--green)':'#DC2626'};border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;">${verfuegbar?'✅ Lieferbar':'❌ Nicht lieferbar'}</button>
      </div>`;
    });
    html+='</div></details>';
  }

  el.innerHTML=html;
  translateEl(el);
}

async function toggleKcPacked(articleId, storeId, soll){
  // "Eingepackt" heißt: die Filiale hat nach der Lieferung wieder SOLL-Bestand — wir schreiben das
  // direkt in den IST-Bestand, statt den Bedarf nur zu verstecken. Der Bedarf verschwindet dadurch
  // ganz natürlich aus der Berechnung (SOLL − IST = 0), keine separate Versteck-Logik nötig.
  const today=new Date().toISOString().split('T')[0];
  try{
    await api(`kc_stock?store_id=eq.${storeId}&article_id=eq.${articleId}`,{method:'DELETE'});
    await api('kc_stock',{method:'POST',body:JSON.stringify([{store_id:storeId,article_id:articleId,ist_bestand:soll,updated_date:today}])});
    showToast('✔ Eingepackt — IST-Bestand auf SOLL gesetzt');
    renderPack();
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}
window.toggleKcPacked=toggleKcPacked;

async function renderKCOverview(el, tabHtml, storeList){
  let html=tabHtml;
  const today=new Date().toISOString().split('T')[0];
  const kcItems=articles.filter(a=>a.category==='Webshop-Produkte');
  const allIst=await api(`kc_stock?select=store_id,article_id,ist_bestand,updated_date`).catch(()=>[]);
  const istMap={};
  (allIst||[]).forEach(d=>{if(!istMap[d.article_id])istMap[d.article_id]={};istMap[d.article_id][d.store_id]=d;});

  // Nur Artikel mit echtem Nachbestell-Bedarf (SOLL > IST) in mind. einer Filiale direkt zeigen —
  // der Rest (kein Bedarf oder noch keine IST-Daten) wandert in eine einklappbare Sektion darunter.
  const needsAction=[], noAction=[];
  kcItems.forEach(a=>{
    const soll=a.min_stock||0;
    const hasBedarf=storeList.some(s=>{
      const ist=(istMap[a.id]||{})[s.id]?.ist_bestand;
      return ist!=null && (soll-ist)>0;
    });
    (hasBedarf?needsAction:noAction).push(a);
  });

  const activeColor='#A855F7'; // gleiche Rolle wie activeColor bei Transporter, nur in KC-Lila

  // Gleicher Tabellenaufbau wie bei Transporter: Artikel | Filialen | ∑ — für einheitliche Optik
  const renderHeader=()=>{
    let h=`<th style="text-align:left;">Artikel</th>`;
    storeList.forEach(s=>h+=`<th style="color:${STORE_COLORS[s.id]||'#888'};" data-no-translate>${s.name.split(' ')[0]}</th>`);
    h+=`<th style="color:${activeColor};">∑</th>`;
    return h;
  };

  const renderRow=(a)=>{
    const soll=a.min_stock||0;
    const verfuegbar=a.verfuegbar!==false;
    let totalBedarf=0;
    let r=`<tr><td><div style="display:flex;align-items:center;gap:6px;">
      <button onclick="toggleArticleVerfuegbarPack(${a.id},${verfuegbar})" title="${verfuegbar?'Lieferbar':'Nicht lieferbar'}" style="font-size:12px;padding:0;border:none;background:transparent;cursor:pointer;line-height:1;flex-shrink:0;">${verfuegbar?'✅':'❌'}</button>
      ${a.image_url?`<img src="${a.image_url}" alt="" style="width:24px;height:24px;border-radius:5px;object-fit:cover;flex-shrink:0;">`:''}
      <span>${a.name}</span>
    </div></td>`;
    storeList.forEach(s=>{
      const rec=(istMap[a.id]||{})[s.id];
      const ist=rec?.ist_bestand;
      if(ist===undefined||ist===null){
        r+=`<td style="color:var(--border);">·</td>`;
        return;
      }
      const b=soll-ist;
      if(b>0){
        totalBedarf+=b;
        r+=`<td><span onclick="toggleKcPacked(${a.id},'${s.id}',${soll})" style="cursor:pointer;display:inline-block;padding:2px 7px;border-radius:6px;font-weight:600;color:#3B6D11;">+${b}</span></td>`;
      } else {
        const col=b<0?'#A32D2D':'var(--muted)';
        r+=`<td style="color:${col};">${b}</td>`;
      }
    });
    r+=`<td style="font-weight:600;color:${activeColor};background:${activeColor}10;">${totalBedarf||'·'}</td></tr>`;
    return r;
  };

  html+=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Grüne Zahl antippen = eingepackt (setzt IST auf SOLL)</div>`;

  if(needsAction.length){
    html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr>${renderHeader()}</tr></thead><tbody>`;
    needsAction.forEach(a=>{ html+=renderRow(a); });
    html+='</tbody></table></div></div>';
  } else {
    html+=`<div style="text-align:center;padding:1.5rem;color:var(--muted);font-size:13px;background:var(--green-light);border-radius:10px;">✓ Aktuell überall genug Bestand — kein Nachbestell-Bedarf</div>`;
  }

  html+=`<div style="font-size:10px;color:var(--muted);padding:8px 2px 4px;">+X = Nachbestellbedarf (SOLL − IST) · Zahl antippen setzt IST auf SOLL, also "eingepackt & geliefert"</div>`;

  if(noAction.length){
    html+=`<details style="margin-top:10px;">
      <summary style="font-size:12px;color:var(--muted);cursor:pointer;padding:6px 2px;">Kein Bedarf / noch keine Daten (${noAction.length}) — trotzdem anzeigen</summary>
      <div class="card" style="margin-top:6px;"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr>${renderHeader()}</tr></thead><tbody>`;
    noAction.forEach(a=>{ html+=renderRow(a); });
    html+='</tbody></table></div></div></details>';
  }

  el.innerHTML=html;
  translateEl(el);
}

  const dayIdx=(new Date().getDay()+6)%7; // Mon=0..Sun=6
  const weekday=WEEKDAYS[dayIdx]?.k;

  if(!weekday){
    el.innerHTML=`<div style="padding:2rem;text-align:center;color:var(--muted);font-size:14px;">Am Wochenende gibt es keinen Speiseplan.</div>`;
    return;
  }

  const disp=await api(`disposal?store_id=eq.${currentStore.id}&disposal_date=eq.${today}&select=slot,dish_name,sold_out_time,leftover_qty,note`).catch(()=>[]);
  const dispMap={};
  (disp||[]).forEach(d=>dispMap[d.slot]=d);

  // Tatsächliche Hauptgerichte aus dem aktuell laufenden Menü
  const menuDishes=getMenuDishNamesForDay(weekday); // [Gericht A, Gericht B] dieser Woche
  const daySlots=[
    {k:'salat', l:'Salat', name:'Salat'},
    ...menuDishes.slice(0,2).map((name,i)=>({k: i===0?'gericht2':'gericht3', l: `Gericht ${i+1}`, name})),
    {k:'reis', l:'Reis', name:REIS_DISH_NAME}
  ];

  let html=backToHomeHtml();
  html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
    <div style="font-size:12px;color:var(--muted);">${new Date().toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'2-digit'})} — Uhrzeit & Restmenge pro Gericht eintragen</div>
    <button onclick="showContainerInfo()" style="flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:13px;font-weight:600;cursor:pointer;line-height:1;">i</button>
  </div>`;

  html+=`<div class="card"><table class="pack-table" style="width:100%;"><thead><tr>
    <th style="text-align:left;">Gericht</th><th>Ausverkauft</th><th>Rest (Port.)</th>
  </tr></thead><tbody>`;
  daySlots.forEach(s=>{
    const dishName=s.name;
    const rec=dispMap[s.k];

async function updateSoldOutTime(slot, dishName, value){
  const today=new Date().toISOString().split('T')[0];
  const v=value===''?null:value+':00';
  try{
    const existing=await api(`disposal?store_id=eq.${currentStore.id}&disposal_date=eq.${today}&slot=eq.${slot}&select=leftover_qty,note`).catch(()=>[]);
    const leftover=existing?.[0]?.leftover_qty ?? null;
    const note=existing?.[0]?.note ?? null;
    await api(`disposal?store_id=eq.${currentStore.id}&disposal_date=eq.${today}&slot=eq.${slot}`,{method:'DELETE'});
    if(v!==null || leftover!==null || note){
      await api('disposal',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,disposal_date:today,slot,dish_name:dishName,sold_out_time:v,leftover_qty:leftover,note}])});
    }
    showToast('✓ Gespeichert');
    renderDisposal();
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}

function getWeekDates(offset){
  const now=new Date();
  const monday=new Date(now);
  const dayNum=(now.getDay()+6)%7;
  monday.setDate(now.getDate()-dayNum+offset*7);
  const days=[];
  for(let i=0;i<5;i++){
    const d=new Date(monday);
    d.setDate(monday.getDate()+i);
    days.push(d);
  }
  return days;
}

      if(!valMap[d.supply_date][d.store_id])valMap[d.supply_date][d.store_id]={};

    if(anyAdjusted){
      html+=`<div style="background:#FFF7ED;border:1px solid #FDBA74;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#C2410C;display:flex;align-items:center;gap:6px;">

        const dateLabel=new Date(dateStr+'T00:00:00').toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});

        dayHtml+=`<div class="card" style="${isToday?'border:1.5px solid #3B6D11;':''}"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr>
          <th style="text-align:left;">Artikel</th>
          ${storeList.map(st=>`<th style="color:${STORE_COLORS[st.id]||'#888'};font-size:11px;" data-no-translate>${st.name.split(' ')[0]}</th>`).join('')}
          <th style="font-weight:700;">Gesamt</th>
        </tr></thead><tbody>`;

            const b=dayItems.find(x=>x.store_id===st.id && x.article_name===name);
            if(!b) return '<td style="color:var(--border);">·</td>';
            const rec=(valMap[dateStr]?.[st.id]||{})[name];
            const val=rec?rec.qty:b.base_qty;
            sum+=parseFloat(val)||0;
            const adjusted=rec?.is_adjusted;
            return `<td style="font-weight:${adjusted?'700':'400'};color:${adjusted?'#C2410C':'#1a1a18'};font-size:12px;">${formatQty(val)}${adjusted?'*':''}</td>`;
          }).join('');
          const sumDisplay = Number.isInteger(sum) ? sum : Math.round(sum*1000)/1000;
          dayHtml+=`<tr>
            <td data-no-translate style="font-size:12px;font-weight:600;color:${ARTICLE_COLORS[name]||'#444'};">${name}<div style="font-size:9px;font-weight:400;color:var(--muted);">${unit}</div></td>
            ${cells}
            <td style="font-weight:700;color:#3B6D11;font-size:12px;">${formatQty(sumDisplay)}</td>
          </tr>`;
        });
        dayHtml+='</tbody></table></div></div>';
        const hasAnyAdjusted=articleNames.some(name=>storeList.some(st=>(valMap[dateStr]?.[st.id]||{})[name]?.is_adjusted));
        if(hasAnyAdjusted){
          dayHtml+=`<div style="font-size:10px;color:#C2410C;padding:2px 4px 8px;">* von Filiale angepasst</div>`;
        }

        if(isToday){
          html+=dayHtml; // heutiger Tag immer direkt sichtbar

          otherDaysHtml+=dayHtml; // restliche Tage gesammelt einklappbar
        }
      }
      if(otherDaysHtml){
        html+=`<details style="margin-top:8px;">
          <summary style="font-size:12px;color:var(--muted);cursor:pointer;padding:6px 2px;">Andere Tage anzeigen</summary>
          <div style="margin-top:6px;">${otherDaysHtml}</div>
        </details>`;
      }
    }
    return html;
  }

function formatZutatenFuerKoch(zutaten, allergene){
  if(!zutaten) return '';
  // Bold allergen-relevant ingredients by checking against known allergy markers
  const allergenKeywords = {
    'A':'GLUTEN|WEIZEN|MEHL|DINKEL|ROGGEN|GERSTE|HAFER|KAMUT|LASAGNE BLÄTTER|TEIGBLÄTTER|TEIG BLATTE',
    'C':'SELLERIE|SELLIERE',
    'F':'SOJA|SOJAJOGHURT|SOJAFASCHIERTES|SOJAHACK|TOFU',
    'G':'MILCH|KÄSE|JOGHURT|BUTTER|RAHM|PARMESAN|MOZZARELLA',
    'L':'SESAM|SESAM SAMEN',
    'M':'SENF|DRESSING.*SENF',
    'N':'ERDNUSS|MANDEL|HASELNUSS|CASHEW|WALNUSS|PEKANNUSS|PISTAZIE'
  };
  let items = zutaten.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean);
  return items.map(item=>{
    const upper = item.toUpperCase();
    const isAllergen = Object.values(allergenKeywords).some(kw=>new RegExp(kw).test(upper));
    return isAllergen
      ? `<strong style="color:#0F6E56;">${item}</strong>`
      : item;
  }).join(' · ');
}

  const DAY_NAME = {mo:'Montag',di:'Dienstag',mi:'Mittwoch',do:'Donnerstag',fr:'Freitag',sa:'Samstag',so:'Sonntag'};

  const stores = await api('stores?select=id,name&order=id');
  const storeList = (stores||[]).filter(s=>s.id!=='zentrale'&&s.id!=='1070'&&s.id!=='kitchen');

  const forecasts = await api(`forecast_qty?forecast_date=eq.${tomorrowStr}&select=store_id,dish_name,qty,source,changed_at,groesse`).catch(()=>[]);
  const fMap = {};

    if(!dishes.length) return;
    const isToday = day===todayWd;
    html += `<div style="font-size:12px;font-weight:700;color:${isToday?'var(--green)':'var(--sub)'};letter-spacing:.04em;margin:12px 0 6px;padding-bottom:4px;border-bottom:2px solid ${isToday?'var(--green)':'var(--border)'};">${DAYS_DE[day]}${isToday?' 👈 HEUTE':''}</div>`;
    dishes.filter(d=>d.name&&!d.name.startsWith('ÖL')).forEach(dish=>{
      const override = overrideMap[dish.name];
      const zutaten = (override?.zutaten||dish.zutaten||'').replace(/\n/g,' ').trim();
      const allergene = override?.allergene_codes||[];
      const allergenStr = dish.allergene?.main?.length ? dish.allergene.main.join(', ') : (allergene.join(', ')||'');
      const dressingStr = dish.allergene?.dressing?.length ? dish.allergene.dressing.join(', ') : '';
      html += `<div style="border:0.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;">
        <div style="background:var(--green-light);padding:10px 14px;display:flex;align-items:center;gap:8px;">
          <span style="font-size:20px;">${SLOT_EMOJI[dish.slot]||'🍽️'}</span>
          <div>
            <div style="font-weight:700;font-size:14px;color:var(--green);">${dish.name}</div>
            ${allergenStr?`<div style="font-size:11px;margin-top:2px;">⚠️ <strong style="color:#92400E;">${allergenStr}</strong>${dressingStr?` · Dressing: <strong style="color:#92400E;">${dressingStr}</strong>`:''}</div>`:'<div style="font-size:11px;color:var(--muted);">✅ Keine Allergene</div>'}
          </div>
        </div>
        ${zutaten?`<div style="padding:8px 14px;">
          <div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;">🧂 ZUTATEN</div>
          <div style="font-size:12px;color:var(--sub);line-height:1.6;">${zutaten.split(',').map(z=>z.trim()).filter(Boolean).map(z=>{
            const up=z.toUpperCase();
            const isAllergen=/(SESAM|KÄSE|JOGHURT|BUTTER|TEIGBLÄTTER|SOJA|TOFU|SELLERIE|SELLIERE|SENF|WEIZEN|MEHL)/.test(up);
            return isAllergen?`<strong style="color:#92400E;">${z}</strong>`:z;
          }).join(' · ')}</div>
        </div>`:''}
      </div>`;
    });
  });

  el.innerHTML=html;
  translateEl(el);
}

async function saveMenuDish(dishName, editKey){
  const zutaten = document.getElementById(`zut-${editKey}`)?.value?.trim()||'';
  const allergenStr = document.getElementById(`all-${editKey}`)?.value?.trim()||'';
  const codes = allergenStr.split(/[,\s]+/).map(c=>c.trim().toUpperCase()).filter(c=>c);
  try{
    // Delete existing entry for this dish name, then re-insert
    await api(`allergene_rezepturen?gericht=eq.${encodeURIComponent(dishName)}`,{method:'DELETE'});
    await api('allergene_rezepturen',{method:'POST',body:JSON.stringify([{gericht:dishName,zutaten,allergene_codes:codes,verantwortlich:'Küchenchef',aktualisiert_am:new Date().toISOString()}])});
    showToast(`✔ ${dishName} gespeichert`);
    // Refresh the view
    renderKitchen();
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}
window.changeWeek=changeWeek;
window.switchKitchenTab=switchKitchenTab;

// ---- SWEETS LISTE KÜCHE ----
async function renderSweets(){
  const stores=await api('stores?select=id,name&order=id');
  const today=new Date().toISOString().split('T')[0];
  const allOrdRaw=await api(`orders?order_date=eq.${today}&select=store_id,article_id,quantity`);
  const allOrd={};
  allOrdRaw.forEach(o=>{if(!allOrd[o.article_id])allOrd[o.article_id]={};allOrd[o.article_id][o.store_id]=o.quantity;});
  const storeList=stores.filter(s=>s.id!=='zentrale' && s.id!=='1070');
  const sweetsItems=articles.filter(a=>a.category==='Sweets');
  const todayStr=new Date().toLocaleDateString('de-AT');

  const el=document.getElementById('v-sweets');
  let html=`<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Für morgen · Stand: ${todayStr}</div>`;
  html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table">
    <thead><tr>
      <th style="text-align:left;">Sweets 🍰</th>`;
  storeList.forEach(s=>{
    const col=STORE_COLORS[s.id]||'#888';
    const hasOrder=sweetsItems.some(a=>(allOrd[a.id]||{})[s.id]>0);
    html+=`<th style="color:${col};" data-no-translate>${s.name.split(' ')[0]}${hasOrder?' ✓':''}</th>`;
  });
  html+=`</tr></thead><tbody>`;
  sweetsItems.forEach(a=>{
    html+=`<tr><td style="font-size:12px;"><div style="display:flex;align-items:center;gap:6px;">${a.image_url?`<img src="${a.image_url}" alt="" style="width:24px;height:24px;border-radius:5px;object-fit:cover;flex-shrink:0;">`:''}<span>${a.name}</span></div></td>`;
    storeList.forEach(s=>{
      const v=(allOrd[a.id]||{})[s.id]||0;
      const hasOrder=sweetsItems.some(x=>(allOrd[x.id]||{})[s.id]>0);
      html+=`<td style="font-weight:${v?'600':'400'};color:${v?'#1a1a18':'var(--border)'};background:${hasOrder?'#F0FDF4':'transparent'};">${v||'·'}</td>`;
    });
    html+=`</tr>`;
  });
  html+='</tbody></table></div></div>';

  html+=`<div class="section-lbl">Bestellstatus</div><div class="card">`;
  storeList.forEach(s=>{
    const hasOrder=sweetsItems.some(a=>(allOrd[a.id]||{})[s.id]>0);
    const col=STORE_COLORS[s.id]||'#888';
    html+=`<div style="display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);gap:10px;">
      <span style="width:12px;height:12px;border-radius:50%;background:${col};flex-shrink:0;"></span>
      <span style="flex:1;font-size:13px;" data-no-translate>${s.name}</span>
      <span class="badge ${hasOrder?'badge-ok':'badge-warn'}">${hasOrder?'✓ aktualisiert heute':'noch ausstehend'}</span>
    </div>`;
  });
  html+='</div>';

  el.innerHTML=html;
  translateEl(el);
}

// ---- KC LAGER (IST/SOLL/Bestellung — echtes System wie Google Sheets) ----
let kcLagerStoreId = null;
const KC_KITCHEN_ITEMS=[{p:'Masalas',v:'Masala Gläser',n:'960',e:'4 Karton á 240'},{p:'',v:'Deckel (Masala)',n:'930',e:'2 Karton á 930'},{p:'Toppings/Saucen',v:'Toppings/Saucen Gläser',n:'720',e:'4 Karton á 180'},{p:'Chai',v:'Flasche Braun',n:'120',e:'1 Karton á 120 Stk'},{p:'',v:'Schraubverschluss grau',n:'150',e:'3 Karton á 50 Stk'},{p:'Masala Trio Karton',v:'Einlage (innen)',n:'20',e:'1 Karton á 20 Stk'},{p:'',v:'Box',n:'20',e:'1 Karton á 20 Stk'},{p:'Catering Gläser',v:'Gläser',n:'0',e:''},{p:'',v:'Catering Deckel',n:'0',e:''},{p:'Ghee',v:'Ghee Gläser',n:'0',e:'genug'}];
let kcTab='shop';

async function renderKCLager(){
  const el=document.getElementById('v-kclager');
  const stores=await api('stores?select=id,name&order=id');
  const storeList=stores.filter(s=>s.id!=='zentrale' && s.id!=='1070');
  if(!kcLagerStoreId) kcLagerStoreId=storeList[0]?.id;

  let html=`<div class="cl-tabs"><button class="cl-tab${kcTab==='shop'?' active':''}" onclick="switchKCTab('shop')">Lager Shop</button><button class="cl-tab${kcTab==='kitchen'?' active':''}" onclick="switchKCTab('kitchen')">Lager Küche</button></div>`;

  if(kcTab==='shop'){
    // Store selector pills
    html+=`<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;">`;
    storeList.forEach(s=>{
      const col=STORE_COLORS[s.id]||'#888';
      const active=s.id===kcLagerStoreId;
      html+=`<button onclick="switchKCStore('${s.id}')" data-no-translate style="flex-shrink:0;padding:7px 14px;border:1.5px solid ${active?col:'var(--border)'};border-radius:20px;background:${active?col+'15':'#fff'};color:${active?col:'#1a1a18'};font-size:12px;font-weight:${active?'600':'400'};cursor:pointer;">${s.name.split(' ')[0]}</button>`;
    });
    html+=`</div>`;

    const kcItems=articles.filter(a=>a.category==='Webshop-Produkte');
    const today=new Date().toISOString().split('T')[0];
    const istData=await api(`kc_stock?store_id=eq.${kcLagerStoreId}&select=article_id,ist_bestand,updated_date`).catch(()=>[]);
    const istMap={};
    (istData||[]).forEach(d=>istMap[d.article_id]=d);

    html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table">
      <thead><tr><th style="text-align:left;">Artikel</th><th>IST BEST</th><th>SOLL</th><th>Bestellung</th></tr></thead><tbody>`;
    kcItems.forEach(a=>{
      const rec=istMap[a.id];
      const ist=rec?.ist_bestand ?? '';
      const soll=a.min_stock||0;
      const bestellung=(ist!=='' && ist!==null) ? (soll - ist) : null;
      const updatedToday=rec?.updated_date===today;
      html+=`<tr>
        <td style="font-size:12px;">${a.name}</td>
        <td><input type="number" value="${ist}" data-article="${a.id}" onchange="updateIstBestand(${a.id}, this.value)" style="width:50px;text-align:center;border:1.5px solid ${updatedToday?'#22C55E':'var(--border)'};border-radius:5px;font-size:12px;padding:4px;background:${updatedToday?'#F0FDF4':'#fff'};"></td>
        <td style="color:var(--muted);">${soll}</td>
        <td style="font-weight:600;color:${bestellung===null?'var(--muted)':bestellung<0?'#A32D2D':bestellung>0?'#3B6D11':'var(--muted)'};">${bestellung===null?'·':bestellung}</td>
      </tr>`;
    });
    html+='</tbody></table></div></div>';
    html+=`<div style="font-size:11px;color:var(--muted);padding:4px 2px;">Negative Bestellung = Überbestand. Grün hinterlegtes Feld = heute aktualisiert.</div>`;
  }else{
    html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr><th>Produkt</th><th>Verpackung</th><th>Bestand</th><th style="text-align:left;">Einheit</th></tr></thead><tbody>`;
    KC_KITCHEN_ITEMS.forEach(r=>{html+=`<tr><td style="color:var(--muted);">${r.p}</td><td style="text-align:left;">${r.v}</td><td><input type="number" min="0" style="width:50px;text-align:center;border:1px solid var(--border);border-radius:4px;font-size:12px;padding:2px;" placeholder="${r.n}"></td><td style="text-align:left;font-size:11px;color:var(--muted);">${r.e}</td></tr>`;});
    html+='</tbody></table></div></div>';
  }
  el.innerHTML=html;
  translateEl(el);
}
function switchKCTab(t){kcTab=t;renderKCLager();}
function switchKCStore(id){kcLagerStoreId=id;renderKCLager();}
async function updateIstBestand(articleId, value){
  const today=new Date().toISOString().split('T')[0];
  const v=value===''?null:parseFloat(value);
  try{
    await api(`kc_stock?store_id=eq.${kcLagerStoreId}&article_id=eq.${articleId}`,{method:'DELETE'});
    if(v!==null){
      await api('kc_stock',{method:'POST',body:JSON.stringify([{store_id:kcLagerStoreId,article_id:articleId,ist_bestand:v,updated_date:today}])});
    }
    renderKCLager();
  }catch(e){showToast('Fehler beim Speichern');}
}
window.switchKCTab=switchKCTab;
window.switchKCStore=switchKCStore;
window.updateIstBestand=updateIstBestand;

// ---- LAGER ----
function renderLager(){
  const warn=articles.filter(a=>(stockData[a.id]||0)<(a.min_stock||4));
  const el=document.getElementById('v-lager');
  let html=`<div class="metric-grid">
    <div class="metric-card"><div style="font-size:11px;color:var(--muted);">Artikel gesamt</div><div style="font-size:26px;font-weight:600;">${articles.length}</div></div>
    <div class="metric-card"><div style="font-size:11px;color:var(--muted);">Nachbestellen</div><div style="font-size:26px;font-weight:600;color:${warn.length?'#A32D2D':'inherit'}">${warn.length}</div></div>
  </div>`;
  CATS.forEach(cat=>{
    const items=articles.filter(a=>a.category===cat);
    if(!items.length) return;
    html+=`<div class="section-lbl">${cat}</div><div class="card">`;
    items.forEach(a=>{const qty=stockData[a.id]||0;const low=qty<(a.min_stock||4);html+=`<div style="display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);"><span style="flex:1;font-size:14px;">${a.name}</span><span style="width:40px;text-align:center;font-size:13px;color:var(--muted);">${qty}</span><span class="badge ${low?'badge-warn':'badge-ok'}">${low?'nachbestellen':'ok'}</span></div>`;});
    html+='</div>';
  });
  el.innerHTML=html;
  translateEl(el);
}
