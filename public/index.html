<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karma Food">
<meta name="theme-color" content="#0F6E56">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
<title>Karma Food</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
:root{--green:#0F6E56;--green-mid:#1D9E75;--green-light:#E1F5EE;--border:#e5e5e2;--muted:#888;--card:#fff;--sub:#666;--brand:#E0521F;--brand-light:#F5A57A;}

/* LOGIN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;gap:1.5rem;position:relative;background:var(--green);background-image:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.25) 30%, rgba(15,110,86,0.92) 68%, rgba(15,110,86,1) 80%), url('/images/hero.jpg');background-size:cover;background-position:center top;}
.login-logo{color:#fff;font-size:30px;font-weight:400;font-family:'Boldonse',sans-serif;letter-spacing:1.5px;text-shadow:0 2px 14px rgba(0,0,0,0.35);}
.login-logo{color:#fff;font-size:30px;font-weight:400;font-family:'Boldonse',sans-serif;letter-spacing:1.5px;}
.tb-title{font-family:'Boldonse',sans-serif;font-weight:400 !important;letter-spacing:0.5px;}
.login-sub{color:#9FE1CB;font-size:14px;letter-spacing:0.3px;}
.login-card{background:#fff;border-radius:18px;padding:1.5rem;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,0.35);position:relative;z-index:1;}
#store-list{display:flex;flex-direction:column;gap:10px;}
.store-btn{padding:12px 16px;border:2px solid var(--border);border-radius:10px;background:#fff;font-size:14px;color:#1a1a18;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:border-color .15s;}
.store-btn-color{position:relative;height:64px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;padding:0 16px;width:100%;}
.role-btn-color{position:relative;min-height:64px;border-radius:12px;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:10px 16px;width:100%;}
.role-btn-role{color:#fff;font-family:'Boldonse',sans-serif;font-weight:400;font-size:16px;letter-spacing:0.3px;}
.role-btn-name{color:rgba(255,255,255,0.85);font-family:inherit;font-size:12.5px;margin-top:3px;}
.store-btn-color-label{color:#fff;font-family:'Boldonse',sans-serif;font-weight:400;font-size:14.5px;letter-spacing:0.3px;}
.store-btn:active{border-color:var(--brand);}
.store-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.pin-input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:18px;text-align:center;letter-spacing:4px;outline:none;}
.pin-input:focus{border-color:var(--brand);}
.login-btn{width:100%;padding:13px;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;}
.back-btn{background:transparent;border:none;color:var(--brand);font-size:14px;cursor:pointer;}

/* TOPBAR */
#topbar{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.tb-title{font-weight:600;font-size:17px;}
.tb-sub{font-size:12px;color:#9FE1CB;margin-top:1px;}
.tb-avatar{width:34px;height:34px;border-radius:50%;background:var(--green-mid);display:flex;align-items:center;justify-content:center;color:#9FE1CB;font-size:11px;font-weight:600;}

/* LANG MENU */
.lang-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:5px 9px;border-radius:6px;font-size:14px;cursor:pointer;position:relative;}
#lang-menu{display:none;position:absolute;right:0;top:36px;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:999;min-width:150px;overflow:hidden;}
#lang-menu button{display:block;width:100%;padding:10px 14px;border:none;background:transparent;text-align:left;font-size:13px;cursor:pointer;color:#1a1a18;}
#lang-menu button:hover{background:#f5f5f3;}
.size-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:5px 9px;border-radius:6px;font-size:14px;cursor:pointer;position:relative;}
#size-menu{display:none;position:absolute;right:0;top:36px;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:999;min-width:130px;overflow:hidden;}
#size-menu button{display:block;width:100%;padding:10px 14px;border:none;background:transparent;text-align:left;font-size:13px;cursor:pointer;color:#1a1a18;}
#size-menu button:hover{background:#f5f5f3;}
#size-menu button.active{color:var(--green);font-weight:600;}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:12px 12px 80px;}
.view{display:none;}
.view.show{display:block;}

/* BOTTOM NAV */
#bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:none;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.nav-btn.active{color:var(--green);}

/* CARDS */
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px;}
.card-header{padding:12px 14px;font-weight:500;font-size:14px;border-bottom:1px solid var(--border);}
.section-lbl{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.5px;padding:12px 2px 4px;text-transform:uppercase;}

/* ORDER */
.item-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);}
.item-row:last-child{border-bottom:none;}
.item-name{flex:1;font-size:14px;}
.item-unit{font-size:11px;color:var(--muted);}
.qty-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-btn:active{background:var(--green-light);}
.qty-val{width:32px;text-align:center;font-size:15px;font-weight:500;color:var(--muted);}
.qty-val.has-val{color:var(--green);}
.submit-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;margin-top:12px;}
.section-banner{border-left:3px solid;border-radius:0 8px 8px 0;padding:8px 12px;margin:14px 0 6px;display:flex;align-items:center;gap:8px;}

/* CHECKLIST */
.cl-tabs{display:flex;gap:6px;margin-bottom:10px;}
.cl-tab{flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;text-align:center;}
.cl-tab.active{background:var(--green);border-color:var(--green);color:#fff;}
.cl-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.cl-item:last-child{border-bottom:none;}
.cl-item:active{background:var(--green-light);}
.check-box{width:22px;height:22px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.check-box.done{background:var(--green);border-color:var(--green);}
.cl-text{font-size:14px;line-height:1.4;padding-top:1px;}
.cl-text.done{color:var(--muted);text-decoration:line-through;}
.progress-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:10px;}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s;}
.progress-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;}

/* PACK */
.pack-tabs{display:flex;gap:8px;margin-bottom:14px;}
.pack-tab{flex:1;padding:12px 8px;border:2px solid var(--border);border-radius:10px;background:var(--card);font-size:13px;font-weight:400;cursor:pointer;text-align:center;color:#1a1a18;}
.pack-table{width:100%;border-collapse:collapse;font-size:12px;}
.pack-table th{padding:6px;text-align:center;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);}
.pack-table th:first-child{text-align:left;}
.pack-table td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:center;}
.pack-table td:first-child{text-align:left;font-size:13px;}

/* HOME */
.home-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:10px;cursor:pointer;}
.home-card:active{background:var(--green-light);}
.hc-icon{width:28px;height:28px;border-radius:8px;background:var(--green-light);display:flex;align-items:center;justify-content:center;}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.metric-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px 14px;}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;}
.badge-ok{background:#EAF3DE;color:#3B6D11;}
.badge-warn{background:#FCEBEB;color:#A32D2D;}
.badge-info{background:#E0F2FE;color:#0369A1;}
.badge-pend{background:#FAEEDA;color:#854F0B;}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:10px 20px;border-radius:30px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* ORG VIEW */
.org-btn{width:100%;padding:16px;border:2px solid var(--border);border-radius:12px;background:var(--card);font-size:15px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.org-btn:active{opacity:0.85;}
.org-btn-icon{font-size:24px;}
.org-btn-text{display:flex;flex-direction:column;gap:2px;}
.org-btn-title{font-weight:500;font-size:15px;}
.org-btn-sub{font-size:12px;color:var(--muted);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">KARMA FOOD</div>
  <div class="login-sub">Internes Bestellsystem</div>
  <div class="login-card" id="store-picker">
    <div style="font-size:13px;color:#666;margin-bottom:4px;">Filiale wählen:</div>

    <div style="font-size:14px;font-weight:500;" id="pin-store-name"></div>

      <button class="size-btn" onclick="toggleSizeMenu()" title="Textgröße" style="font-weight:700;">Aa</button>

      <div class="tb-avatar" id="tb-avatar" style="display:none;"></div>
      <button onclick="doLogout()" title="Filiale wechseln / Abmelden" style="width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">

  </div>
</div>

          d.scrollIntoView({behavior:'smooth', block:'center'});

function editGuideEntry(id, kat, storeId, titel, inhalt){
  showGuideForm(id, kat, storeId, titel, inhalt);
  document.getElementById('guide-form')?.scrollIntoView({behavior:'smooth'});
}

async function saveGuideEntry(id){
  const kat=document.getElementById('gf-kat')?.value;
  const storeId=document.getElementById('gf-store')?.value||null;
  const titel=document.getElementById('gf-titel')?.value?.trim();
  const inhalt=document.getElementById('gf-inhalt')?.value?.trim();
  if(!titel){showToast('Bitte Titel eingeben');return;}
  const payload={kategorie:kat,store_id:storeId||null,titel,inhalt:inhalt||null};
  try{
    if(id) await api(`guide_eintraege?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(payload)});
    else await api('guide_eintraege',{method:'POST',body:JSON.stringify([payload])});
    showToast('✔ Gespeichert');
    renderGuide();
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}

async function deleteGuideEntry(id){
  if(!confirm('Diesen Eintrag löschen?')) return;
  try{
    await api(`guide_eintraege?id=eq.${id}`,{method:'DELETE'});
    showToast('Gelöscht');
    renderGuide();
  }catch(e){console.error(e);showToast('Fehler');}
}

async function tx(text) {
  if (lang === 'de' || !text || text.length < 2) return text;
  const key = lang+'::'+text;
  if (tCache[key]) return tCache[key];
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`);
    const d = await r.json();
    tCache[key] = d[0].map(x=>x[0]).join('');
    return tCache[key];
  } catch { return text; }
}
async function translateEl(el) {
  if (lang === 'de' || !el) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n;
  while(n = walker.nextNode()) {
    // Skip text inside elements marked no-translate (e.g. store names)
    if (n.parentElement && n.parentElement.closest('[data-no-translate]')) continue;
    const t = n.textContent.trim();
    if (t.length > 1 && !/^[\d·✓×+\-\/\.]+$/.test(t)) nodes.push({node:n, orig:t});
  }
  for (const {node, orig} of nodes) {
    node.textContent = node.textContent.replace(orig, await tx(orig));
  }
  for (const inp of el.querySelectorAll('textarea,input[placeholder]')) {
    if (inp.placeholder) inp.placeholder = await tx(inp.placeholder);
  }
}
async function setLang(l) {
  lang = l;
  localStorage.setItem('kf_lang', l);
  document.getElementById('lang-menu').style.display = 'none';
  const v = document.querySelector('.view.show');
  if (v) translateEl(v);
}

// ---- API ----
async function api(path, opts={}) {
  const res = await fetchWithTimeout(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},
    mode:'cors', ...opts
  }, 10000); // 10s Timeout — verhindert unendliches Hängenbleiben bei Netzwerkproblemen/Stoßzeit
  if (!res.ok) throw new Error(await res.text());
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

async function initLogin() {
  try {
    const stores = (await api('stores?select=id,name,image_url&order=id')).filter(s=>s.id!=='1070');
    // Feste Reihenfolge am Login-Screen (nicht alphabetisch nach ID): Börse, Laurenzerberg,
    // Ausstellungsstraße, Stadtplatz, Kitchen, Organisation.
    const LOGIN_ORDER=['boerse','lb','1020','3400','kitchen','zentrale'];
    stores.sort((a,b)=>{
      const ia=LOGIN_ORDER.indexOf(a.id), ib=LOGIN_ORDER.indexOf(b.id);
      return (ia===-1?999:ia)-(ib===-1?999:ib);
    });
    const list = document.getElementById('store-list');
    if (!stores?.length) { list.innerHTML='<p style="color:red;font-size:12px;">Verbindungsfehler</p>'; return; }
    list.innerHTML = stores.map(s => {
      const loginCol = STORE_LOGIN_COLORS[s.id];
      if(loginCol){
        return `<button class="store-btn-color" onclick="pickStore('${s.id}','${s.name.replace(/'/g,"\\'")}')" data-no-translate style="background:${loginCol};">
          <span class="store-btn-color-label">${s.name}</span>
        </button>`;
      }
      const col = STORE_COLORS[s.id]||'#888';
      return `<button class="store-btn" onclick="pickStore('${s.id}','${s.name.replace(/'/g,"\\'")}')" data-no-translate>
        <span class="store-dot" style="background:${col};"></span>${s.name}
      </button>`;
    }).join('');
    const saved = localStorage.getItem('kf_store');
    if (saved) {
      const parsed=JSON.parse(saved);
      if(parsed.id==='1070'){ localStorage.removeItem('kf_store'); }
      else { loginAs(parsed); }
    }
  } catch(e) {
    document.getElementById('store-list').innerHTML=`<p style="color:red;font-size:12px;">Fehler: ${e.message}</p>`;
  }
}

const MENU_WOCHE_START = new Date(2026, 5, 29); // Monat 0-indiziert: 5 = Juni
function getCurrentMenuWoche(){
  const start = new Date(MENU_WOCHE_START); start.setHours(0,0,0,0);
  const now = new Date(); now.setHours(0,0,0,0);
  const diffDays = Math.round((now - start) / 86400000);
  if(diffDays < 0) return 1; // vor Start: zeige Woche 1
  return (Math.floor(diffDays / 7) % 4) + 1;
}

const GEMUESE_KEYWORDS = ['ZWIEBEL','TOMATEN','TOMATENPASSATA','PAPRIKA','ZUCCHINI','KAROTTEN','KAROTTE','BROKKOLI','SPINAT','MELANZANI','ERDÄPFEL','KARTOFFELN','KÜRBIS','FENCHEL','SELLERIE','LAUCH','KNOBLAUCH','MAIS','ERBSEN','BOHNEN','KOHL','WEISSKRAUT','ROTKRAUT','KICHERERBSEN','SÜSSKARTOFFELN','SÜSSKARTOFFEL','WEISSER RETTICH','KIDNEYBOHNEN','CHAMPIGNONS','PILZE','AUBERGINE','KOHLRABI','MANGOLD','CHINAKOHL','PORREE','BRECHBOHNEN','OKRA','CURRY BLÄTTER'];

function splitZutaten(text){
  if(!text) return {gemuese:[], rest:[]};
  const items = text.split(',').map(s=>s.trim()).filter(Boolean);
  const gemuese=[], rest=[];
  items.forEach(item=>{
    const up=item.toUpperCase();
    if(GEMUESE_KEYWORDS.some(kw=>up.includes(kw))) gemuese.push(item);
    else rest.push(item);
  });
  return {gemuese, rest};
}

function isVegan(allergenMain){
  // Vegan = no Milch (G) and no Eier (C) and no Fisch (D) and no Krebstiere (B)
  if(!allergenMain||!allergenMain.length) return true;
  return !allergenMain.some(c=>['G','C','D','B','R'].includes(c.toUpperCase()));
}

function isGlutenfrei(allergenMain){
  if(!allergenMain||!allergenMain.length) return true;
  return !allergenMain.some(c=>c.toUpperCase()==='A');
}

async function saveGemuese(dishName, newGemuese){
  try{
    const existing=(await api(`allergene_rezepturen?gericht=eq.${encodeURIComponent(dishName)}&select=*`).catch(()=>[]))[0];
    const currentZutaten=existing?.zutaten||'';
    const {rest}=splitZutaten(currentZutaten);
    const merged=[...newGemuese.split(',').map(s=>s.trim()).filter(Boolean),...rest].join(', ');
    if(existing){
      await api(`allergene_rezepturen?gericht=eq.${encodeURIComponent(dishName)}`,{method:'PATCH',body:JSON.stringify({zutaten:merged})});
    } else {
      await api('allergene_rezepturen',{method:'POST',body:JSON.stringify([{gericht:dishName,zutaten:merged,allergene_codes:[]}])});
    }
    showToast(`✔ Gemüse für ${dishName} gespeichert`);
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}

function getDishEmoji(name){
  if(!name) return '🍽️';
  const n=name.toUpperCase();
  if(/LASAGNE/.test(n)) return '🫕';
  if(/BIRYANI/.test(n)) return '🍚';
  if(/\bDAL\b|LINSEN/.test(n)) return '🫘';
  if(/CURRY/.test(n)) return '🍛';
  if(/\bBOWL\b/.test(n)) return '🥙';
  if(/SALAT|SALAD/.test(n)) return '🥗';
  if(/GULASCH/.test(n)) return '🥘';
  if(/TOFU/.test(n)) return '🟩';
  if(/MEATBALL/.test(n)) return '🥩';
  if(/CHILI/.test(n)) return '🌶️';
  if(/TIKKA|MASALA/.test(n)) return '🍛';

}

async function computeAndSaveScore(storeId){
  const today=new Date().toISOString().split('T')[0];
  try{
    const [wek,rein,kuehl,disposal,forecast] = await Promise.all([
      api(`wareneingang?store_id=eq.${storeId}&datum=eq.${today}&select=id`).catch(()=>[]),
      api(`reinigungsprotokoll?store_id=eq.${storeId}&datum=eq.${today}&select=reinigung_erledigt,desinfektion_erledigt`).catch(()=>[]),
      api(`kuehleinrichtungen?store_id=eq.${storeId}&datum=eq.${today}&select=id`).catch(()=>[]),
      api(`disposal?store_id=eq.${storeId}&disposal_date=eq.${today}&select=leftover_qty`).catch(()=>[]),
      api(`forecast_qty?store_id=eq.${storeId}&forecast_date=eq.${today}&select=qty,dish_name`).catch(()=>[])
    ]);
    const haccp_done=(wek||[]).length>0 && (rein||[])[0]?.reinigung_erledigt && (rein||[])[0]?.desinfektion_erledigt && (kuehl||[]).length>0;
    const waste_total=(disposal||[]).reduce((s,d)=>s+(d.leftover_qty||0),0);

    // Streak: Vortag prüfen
    const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
    const yd=yesterday.toISOString().split('T')[0];
    const prevScore=(await api(`store_scores?store_id=eq.${storeId}&datum=eq.${yd}&select=streak_haccp`).catch(()=>[]))[0];
    const prevStreak=prevScore?.streak_haccp||0;
    const streak_haccp=haccp_done?(prevStreak+1):0;

    await api(`store_scores?store_id=eq.${storeId}&datum=eq.${today}`,{method:'DELETE'});
    await api('store_scores',{method:'POST',body:JSON.stringify([{store_id:storeId,datum:today,streak_haccp,waste_total,schrittende_done:false}])});
  }catch(e){console.error('score error',e);}
}

async function loadGamificationWidget(storeId){
  const today=new Date().toISOString().split('T')[0];
  const monday=new Date(); monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
  const mondayStr=monday.toISOString().split('T')[0];
  try{
    const [myScores, allStores, allScoresWeek] = await Promise.all([
      api(`store_scores?store_id=eq.${storeId}&datum=gte.${mondayStr}&order=datum.desc&select=*`).catch(()=>[]),
      api('stores?select=id,name&order=id').catch(()=>[]),
      api(`store_scores?datum=gte.${mondayStr}&select=store_id,waste_total,streak_haccp`).catch(()=>[])
    ]);
    const todayScore=(myScores||[]).find(s=>s.datum===today);
    const streak=todayScore?.streak_haccp||0;
    const storeList=(allStores||[]).filter(s=>s.id!=='zentrale'&&s.id!=='1070'&&s.id!=='kitchen');

    // Waste-Rangliste diese Woche
    const wasteByStore={};
    (allScoresWeek||[]).forEach(s=>{
      if(!wasteByStore[s.store_id]) wasteByStore[s.store_id]=0;
      wasteByStore[s.store_id]+=(s.waste_total||0);
    });
    const wasteSorted=storeList.map(s=>({...s,waste:wasteByStore[s.id]||0})).sort((a,b)=>a.waste-b.waste);
    const myRank=wasteSorted.findIndex(s=>s.id===storeId)+1;

    let html=`<div style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px;margin-top:10px;">`;
    html+=`<div style="font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px;">🏆 Diese Woche</div>`;
    html+=`<div style="display:flex;gap:8px;margin-bottom:10px;">`;
    // Streak
    const streakColor=streak>=5?'#0F6E56':streak>=3?'#BA7517':'var(--color-text-secondary)';
    html+=`<div style="flex:1;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:10px;text-align:center;">
      <div style="font-size:22px;font-weight:500;color:${streakColor};">${streak>0?'🔥':''} ${streak}</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px;">Check-up Streak</div>
    </div>`;
    // Waste Rang
    const rankEmoji=myRank===1?'🥇':myRank===2?'🥈':myRank===3?'🥉':'';
    html+=`<div style="flex:1;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:10px;text-align:center;">
      <div style="font-size:22px;font-weight:500;color:var(--color-text-primary);">${rankEmoji} ${myRank || '–'}</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px;">Waste-Rang</div>
    </div>`;
    html+=`</div>`;

    // Mini-Rangliste
    html+=`<div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:6px;">♻️ Wenigste Reste (Woche)</div>`;
    wasteSorted.slice(0,4).forEach((s,i)=>{
      const isMe=s.id===storeId;
      const col=STORE_COLORS[s.id]||'#888';
      html+=`<div style="display:flex;align-items:center;gap:6px;padding:4px 0;${i<wasteSorted.length-1?'border-bottom:0.5px solid var(--color-border-tertiary);':''}">
        <span style="font-size:12px;font-weight:500;color:var(--color-text-secondary);min-width:16px;">${i+1}</span>
        <span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;"></span>
        <span style="font-size:12px;flex:1;font-weight:${isMe?'500':'400'};color:${isMe?'var(--color-text-primary)':'var(--color-text-secondary)'};" data-no-translate>${s.name.split(' ')[0]}</span>
        <span style="font-size:12px;color:var(--color-text-secondary);">${s.waste.toFixed(1)}</span>
      </div>`;
    });
    html+=`</div>`;
    return html;
  }catch(e){console.error(e);return '';}
}

function verfuegbarLabel(a){
  const parts=[];
  if(a.verfuegbar_bis) parts.push('bis '+new Date(a.verfuegbar_bis+'T00:00:00').toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'}));
  if(a.verfuegbar_hinweis) parts.push(a.verfuegbar_hinweis);
  return parts.length?parts.join(' — '):'aktuell nicht verfügbar';
}

async function saveVerfModal(id){
  const mode=document.querySelector('input[name="verf-mode"]:checked')?.value||'unbestimmt';

  if(mode==='datum' && !dateVal){ showToast('Bitte ein Datum wählen'); return; }
  const note=document.getElementById('verf-note-input')?.value?.trim()||'';
  try{
    await api(`articles?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({verfuegbar:false, verfuegbar_hinweis:note||null, verfuegbar_bis:dateVal})});

// Artikel automatisch wieder auf "lieferbar" setzen, wenn das gewählte Bis-Datum verstrichen ist.
async function autoReactivateExpiredArticles(){
  const today=new Date().toISOString().split('T')[0];
  const expired=articles.filter(a=>a.verfuegbar===false && a.verfuegbar_bis && a.verfuegbar_bis<today);
  if(!expired.length) return;
  try{
    for(const a of expired){
      await api(`articles?id=eq.${a.id}`,{method:'PATCH',body:JSON.stringify({verfuegbar:true, verfuegbar_hinweis:null, verfuegbar_bis:null})});

}

// Rendert eine Sorten-Gruppe (Pona, Barebells) als 1 Button/Card mit Dropdown + Menge je gewählter Sorte,
// plus "+ weitere Sorte hinzufügen". Der Bestell-Datensatz bleibt unverändert (weiterhin 1 Zeile pro
// tatsächlicher Sorte in orderQtys/orders) — es ändert sich nur die Eingabe-Darstellung für die Filiale.
function renderVariantGroupRow(groupKey, groupItems){
  const g=VARIANT_GROUPS[groupKey];
  if(!variantRows[groupKey]){
    const preset=groupItems.filter(a=>(orderQtys[a.id]||0)>0);
    variantRows[groupKey]=preset.length?preset.map(a=>({articleId:a.id})):[{articleId:null}];
  }
  const rows=variantRows[groupKey];
  const chosenIds=new Set(rows.map(r=>r.articleId).filter(Boolean));
  const allUnavailable=groupItems.every(a=>a.verfuegbar===false);
  const rowsHtml=rows.map((r,i)=>{
    const opts=groupItems.map(a=>{
      const flavor=a.name.replace(g.prefix,'').trim()||a.name;
      const verf=a.verfuegbar!==false;
      const disabled=(chosenIds.has(a.id)&&a.id!==r.articleId)||!verf;
      return `<option value="${a.id}" ${a.id===r.articleId?'selected':''} ${disabled?'disabled':''}>${flavor}${!verf?' (nicht lieferbar)':''}</option>`;
    }).join('');
    const v=r.articleId?(orderQtys[r.articleId]||0):0;
    const selArt=r.articleId?groupItems.find(x=>x.id===r.articleId):null;
    const selVerf=selArt?selArt.verfuegbar!==false:true;
    return `<div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
      <select onchange="variantSelect('${groupKey}',${i},this.value)" style="flex:1;padding:7px 8px;border-radius:8px;border:1px solid var(--border);font-size:13px;background:var(--card);color:inherit;min-width:0;">
        <option value="">Sorte wählen…</option>
        ${opts}
      </select>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;${(!r.articleId||!selVerf)?'opacity:0.3;pointer-events:none;':''}">
        <button class="qty-btn" onclick="variantAdj('${groupKey}',${i},-1)">−</button>
        <span class="qty-val${v>0?' has-val':''}" id="vq-${groupKey}-${i}">${v}</span>
        <button class="qty-btn" onclick="variantAdj('${groupKey}',${i},1)">+</button>
      </div>
      ${rows.length>1?`<button onclick="variantRemove('${groupKey}',${i})" style="background:none;border:none;color:#DC2626;font-size:16px;cursor:pointer;padding:0 2px;flex-shrink:0;">✕</button>`:`<span style="width:18px;flex-shrink:0;"></span>`}
    </div>`;
  }).join('');
  const canAddMore=rows.length<groupItems.length;
  return `<div class="item-row" style="flex-direction:column;align-items:stretch;gap:0;${allUnavailable?'opacity:0.35;pointer-events:none;':''}">
    <div style="display:flex;align-items:center;gap:10px;">
      ${groupItems[0].image_url?`<img src="${groupItems[0].image_url}" alt="" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;">`:''}
      <div class="item-name">${g.label}</div>
    </div>
    ${rowsHtml}
    ${canAddMore?`<button onclick="variantAddRow('${groupKey}')" style="margin-top:8px;align-self:flex-start;background:none;border:1px dashed var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);cursor:pointer;">+ weitere Sorte hinzufügen</button>`:''}
  </div>`;
}

function variantSelect(groupKey,i,val){
  const newId=val?parseInt(val):null;
  const row=variantRows[groupKey][i];
  const oldId=row.articleId;
  if(oldId!==newId){
    const oldQty=oldId?(orderQtys[oldId]||0):0;
    if(oldId) orderQtys[oldId]=0;
    if(newId) orderQtys[newId]=oldQty;
    row.articleId=newId;
  }
  renderOrder();
}
window.variantSelect=variantSelect;

function variantAdj(groupKey,i,d){
  const row=variantRows[groupKey] && variantRows[groupKey][i];
  if(!row || !row.articleId) return;
  orderQtys[row.articleId]=Math.max(0,(orderQtys[row.articleId]||0)+d);
  const el=document.getElementById('vq-'+groupKey+'-'+i);
  if(el){el.textContent=orderQtys[row.articleId];el.className='qty-val'+(orderQtys[row.articleId]>0?' has-val':'');}
}
window.variantAdj=variantAdj;

function variantAddRow(groupKey){
  variantRows[groupKey].push({articleId:null});
  renderOrder();
}
window.variantAddRow=variantAddRow;

function variantRemove(groupKey,i){
  const row=variantRows[groupKey][i];
  if(row && row.articleId) orderQtys[row.articleId]=0;
  variantRows[groupKey].splice(i,1);
  if(!variantRows[groupKey].length) variantRows[groupKey]=[{articleId:null}];
  renderOrder();
}
window.variantRemove=variantRemove;

// ---- KÜCHE (Bowl Sauce, Limetten, Dressing, Petersilie, Salat, Raita) ----
// Wandelt Dezimalzahlen in lesbare Bruch-Darstellung für Küche-Mengen um (1.5 -> 1½, 0.333 -> ⅓, 0.75 -> ¾)
// Verhindert kaputtes HTML/JS, wenn Gerichtnamen Sonderzeichen wie " enthalten (z.B. Parmesan-Basilikum-"Meatballs")
function escAttr(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escForInlineHandler(s){
  // Sicher als String-Literal INNERHALB eines onclick="...('...')" — erst JS-Escaping, dann HTML-Escaping der Anführungszeichen
  return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,'\\n');
}
function formatQty(n){
  if(n===null||n===undefined||n==='') return '';
  const num=parseFloat(n);
  if(isNaN(num)) return n;
  const whole=Math.floor(num);
  const frac=Math.round((num-whole)*1000)/1000;
  const fracMap={0:'',0.25:'¼',0.333:'⅓',0.5:'½',0.667:'⅔',0.75:'¾'};
  if(fracMap.hasOwnProperty(frac)){
    const f=fracMap[frac];
    if(whole===0) return f||'0';
    return f ? `${whole}${f}` : `${whole}`;
  }
  // kein bekannter Bruch -> normale Zahl, Punkt durch Komma falls Nachkommastellen
  return num % 1 === 0 ? `${num}` : num.toString().replace('.',',');
}
function getWeekdayDates(weekOffsetParam=0){
  // Liefert {1:'YYYY-MM-DD', ..., 5:'YYYY-MM-DD'} für Mo-Fr — Standard ist die aktuelle Kalenderwoche,
  // weekOffsetParam verschiebt in Wochenschritten (z.B. +1 = nächste Woche, -1 = letzte Woche).
  const now=new Date();
  const dow=now.getDay(); // 0=So..6=Sa
  const diffToMonday=dow===0?-6:1-dow;
  const monday=new Date(now);
  monday.setDate(now.getDate()+diffToMonday+weekOffsetParam*7);
  const dates={};
  for(let i=0;i<5;i++){
    const d=new Date(monday);
    d.setDate(monday.getDate()+i);
    dates[i+1]=d.toISOString().split('T')[0];
  }
  return dates;
}
// ISO-Kalenderwochennummer für eine gegebene Woche (fuer die Anzeige "KW 28")
function getIsoWeekNumber(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const week1=new Date(d.getFullYear(),0,4);
  return 1+Math.round(((d-week1)/86400000-3+((week1.getDay()+6)%7))/7);
}

async function updateKuecheQty(input){
  const dateStr=input.dataset.date;
  const articleName=input.dataset.article;
  const baseQty=parseFloat(input.dataset.base);
  const newQty=parseFloat(input.value);
  if(isNaN(newQty)){return;}
  const isAdjusted = newQty !== baseQty;
  try{
    await api(`kitchen_supply_today?store_id=eq.${currentStore.id}&supply_date=eq.${dateStr}&article_name=eq.${encodeURIComponent(articleName)}`,{method:'DELETE'});
    await api('kitchen_supply_today',{method:'POST',body:JSON.stringify([{
      store_id:currentStore.id, supply_date:dateStr, article_name:articleName, qty:newQty,
      is_adjusted:isAdjusted, changed_by:currentStore.name, changed_at:isAdjusted?new Date().toISOString():null,
      kitchen_notified:false
    }])});
    showToast(isAdjusted?'✓ Angepasst — Küche wird informiert':'✓ Gespeichert (Grundmenge)');
    renderOrder();
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}

const STORE_COORDS = {
  lb:      {lat:48.2108, lon:16.3796},
  boerse:  {lat:48.2165, lon:16.3699},
  '1020':  {lat:48.2132, lon:16.4058},
  '3400':  {lat:48.3079, lon:16.3272},
};

let _weatherCache = {}; // storeId -> {dateStr -> {tempMax, precipProb}}

// Bricht Anfragen (Supabase & externe wie Wetter) nach einer festen Zeit ab, statt die Seite bei einer
// langsamen/gestörten Verbindung (Mittagsstoßzeit, schlechtes WLAN) unbegrenzt hängen zu lassen.
// WICHTIG: options (headers, method, body...) werden durchgereicht — sonst gehen z.B. Auth-Header verloren.
function fetchWithTimeout(url, options={}, ms=8000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  return fetch(url, {...options, signal: controller.signal}).finally(()=>clearTimeout(timer));
}
// Liest/schreibt sessionStorage defensiv — falls nicht verfügbar (Privatmodus o.ä.), einfach ignorieren statt crashen
function cacheGet(key){ try{ const v=sessionStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function cacheSet(key, val){ try{ sessionStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* z.B. Speicher voll — kein Problem, nur kein Caching */ } }

async function fetchWeatherForStore(storeId, fromDate, toDate){
  const cacheKey = `wx_${storeId}_${fromDate}_${toDate}`;
  if(_weatherCache[cacheKey]) return _weatherCache[cacheKey];
  const stored=cacheGet(cacheKey);
  if(stored){ _weatherCache[cacheKey]=stored; return stored; }
  const coords = STORE_COORDS[storeId];
  if(!coords) return {};
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=temperature_2m_max,precipitation_probability_max&timezone=Europe%2FVienna&start_date=${fromDate}&end_date=${toDate}`;
    const res = await fetchWithTimeout(url, {}, 5000);
    const data = await res.json();
    const map = {};
    (data?.daily?.time||[]).forEach((d,i)=>{
      map[d] = {
        tempMax: data.daily.temperature_2m_max?.[i],
        precipProb: data.daily.precipitation_probability_max?.[i]
      };
    });
    _weatherCache[cacheKey] = map;
    cacheSet(cacheKey, map);
    return map;
  }catch(e){ console.error('Wetter-Abruf fehlgeschlagen', e); return {}; }
}

// Berechnet alle gesetzlichen österreichischen Feiertage für ein Jahr per Formel (Gauss-Osterformel) —
// so müssen Feiertage nie wieder händisch per SQL nachgetragen werden (Ferien bleiben manuell, da nicht berechenbar).
function getAustrianHolidays(year){
  // Oster-Sonntag nach Gauss'scher Osterformel
  const a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4;
  const f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  const easter=new Date(year, month-1, day);
  const plusDays=n=>{ const d2=new Date(easter); d2.setDate(d2.getDate()+n); return d2; };
  const iso=d2=>d2.toISOString().split('T')[0];
  return [
    {event_date:`${year}-01-01`, label:'Neujahr'},
    {event_date:`${year}-01-06`, label:'Heilige Drei Könige'},
    {event_date:iso(plusDays(1)), label:'Ostermontag'},
    {event_date:`${year}-05-01`, label:'Staatsfeiertag'},
    {event_date:iso(plusDays(39)), label:'Christi Himmelfahrt'},
    {event_date:iso(plusDays(50)), label:'Pfingstmontag'},
    {event_date:iso(plusDays(60)), label:'Fronleichnam'},
    {event_date:`${year}-08-15`, label:'Maria Himmelfahrt'},
    {event_date:`${year}-10-26`, label:'Nationalfeiertag'},
    {event_date:`${year}-11-01`, label:'Allerheiligen'},
    {event_date:`${year}-12-08`, label:'Maria Empfängnis'},
    {event_date:`${year}-12-25`, label:'Christtag'},
    {event_date:`${year}-12-26`, label:'Stefanitag'},
  ].map(h=>({...h, event_type:'feiertag', end_date:null, store_id:null}));
}

async function getCalendarEvents(){
  if(_calendarEventsCache) return _calendarEventsCache;
  const stored=cacheGet('cal_events');
  if(stored){ _calendarEventsCache=stored; return stored; }
  const events = await api('calendar_events?select=event_date,end_date,event_type,label,store_id').catch(()=>[]);
  const thisYear=new Date().getFullYear();
  // Feiertage für letztes/aktuelles/nächste 2 Jahre berechnen — deckt Rückblick & Vorschau ab, ohne DB-Pflege
  const computedHolidays=[thisYear-1, thisYear, thisYear+1, thisYear+2].flatMap(getAustrianHolidays);
  _calendarEventsCache = [...(events||[]), ...computedHolidays];
  cacheSet('cal_events', _calendarEventsCache);
  return _calendarEventsCache;
}

async function getForecastSettings(storeId){
  if(_forecastSettingsCache[storeId]) return _forecastSettingsCache[storeId];
  const cacheKey=`fc_settings_${storeId}`;
  const stored=cacheGet(cacheKey);
  if(stored){ _forecastSettingsCache[storeId]=stored; return stored; }
  const rows = await api(`forecast_settings?store_id=eq.${storeId}&select=*`).catch(()=>[]);
  const defaults = {weather_sunny_pct:10, weather_rain_pct:-8, feiertag_pct:-25, ferien_pct:-10};
  const settings = rows?.[0] ? {...defaults, ...rows[0]} : defaults;
  _forecastSettingsCache[storeId] = settings;
  cacheSet(cacheKey, settings);
  return settings;
}

// Holt die GESAMTE Verkaufshistorie einer Filiale in EINER Anfrage (statt einer eigenen Anfrage pro
// Gericht/Tag) — wichtig für Stabilität bei vielen gleichzeitigen Zugriffen / schlechter Verbindung.
async function getSalesHistoryForStore(storeId){
  if(_salesHistoryCache[storeId]) return _salesHistoryCache[storeId];
  const cacheKey=`sales_hist_${storeId}`;
  const stored=cacheGet(cacheKey);
  if(stored){ _salesHistoryCache[storeId]=stored; return stored; }
  const rows = await api(`sales_history?store_id=eq.${storeId}&order=sale_date.desc&limit=3000&select=sale_date,dish_category,qty`).catch(()=>[]);
  const byCategory={};
  (rows||[]).forEach(r=>{
    if(!byCategory[r.dish_category]) byCategory[r.dish_category]=[];
    byCategory[r.dish_category].push(r);
  });
  _salesHistoryCache[storeId]=byCategory;
  cacheSet(cacheKey, byCategory);
  return byCategory;
}

// Ermittelt Wetter- und Kalender-Zuschläge/Abschläge für einen Tag, inkl. lesbarer Begründung
function getDayModifiers(dateStr, storeId, weatherMap, calendarEvents, settings){
  let pct = 0;
  const reasons = [];

  const w = weatherMap[dateStr];
  if(w && w.tempMax!=null){
    if(w.tempMax>=22 && (w.precipProb??0)<=30){
      pct += settings.weather_sunny_pct;
      reasons.push(`☀️ ${Math.round(w.tempMax)}°C`);
    } else if((w.precipProb??0)>=60){
      pct += settings.weather_rain_pct;
      reasons.push(`🌧️ ${Math.round(w.precipProb)}% Regen`);
    } else {
      reasons.push(`⛅ ${Math.round(w.tempMax)}°C`);
    }
  }

  const feiertag = calendarEvents.find(e=>e.event_type==='feiertag' && e.event_date===dateStr && (!e.store_id||e.store_id===storeId));
  if(feiertag){
    pct += settings.feiertag_pct;
    reasons.push(`🎉 ${feiertag.label}`);
  }

  const ferien = calendarEvents.find(e=>e.event_type==='ferien' && dateStr>=e.event_date && dateStr<=(e.end_date||e.event_date) && (!e.store_id||e.store_id===storeId));
  if(ferien && !feiertag){
    pct += settings.ferien_pct;
    reasons.push(`🏖️ ${ferien.label}`);
  }

  const sondertag = calendarEvents.find(e=>e.event_type==='sondertag' && dateStr>=e.event_date && dateStr<=(e.end_date||e.event_date) && (!e.store_id||e.store_id===storeId));
  if(sondertag){
    reasons.push(`📌 ${sondertag.label}`);
  }

  return {pct, reason: reasons.join(' · ')};
}

// Ordnet einen (ggf. beschreibenden) Gerichtnamen der generischen Verkaufs-Kategorie zu,
// mit der auch sales_history befüllt ist (aus dem Odoo-Export abgeleitet).
function mapDishNameToCategory(dishName){
  const n=(dishName||'').toLowerCase();
  if(n==='reis') return 'Reis';
  if(n.includes('curry')) return 'Curry';
  if(n.includes('dal')) return 'Dal';
  if(n.includes('biryani')) return 'Biryani';
  if(n.includes('lasagne')) return 'Lasagne';
  if(n.includes('salat')) return 'Salat';
  return 'Special'; // rotierendes Sondergericht (Meatballs, Aloo Gobi, Gulasch etc.)
}

function computeAutoSuggestion(storeId, dishName, weekdayStr, dateStr, weatherMap, calendarEvents, settings, salesHistoryByCategory, lastWeekDisposalByDate){
  // Basis ist jetzt die VORWOCHE (letztes tatsächliches Vorkommen), NICHT ein Mehrwochen-Schnitt.
  // Bei volatilem Sommerwetter reagiert ein langer Durchschnitt zu träge — die letzte Woche ist
  // der ehrlichste Anhaltspunkt, kombiniert mit Wetter/Feiertag der kommenden Woche.
  const category=mapDishNameToCategory(dishName);
  const history=salesHistoryByCategory?.[category]||[];
  const weekdayMatches=history.filter(h=>WEEKDAY_STR[new Date(h.sale_date+'T00:00:00').getDay()]===weekdayStr);
  if(!weekdayMatches.length) return null;
  const lastWeek=weekdayMatches[0]; // bereits nach Datum absteigend sortiert -> [0] = letztes Vorkommen
  const baseQtyPortionen=lastWeek.qty;
  // sales_history ist in VERKAUFTEN PORTIONEN, die Forecast-Anzeige ist aber in BEHÄLTERN
  // (gleiche Umrechnung wie im Entsorgung-Modul: 1 Behälter = 20 Portionen).
  const baseQty=baseQtyPortionen/20;

  if(!dateStr || !weatherMap || !calendarEvents || !settings){
    return Math.round(baseQty*4)/4; // Fallback: alte Signatur ohne Wetter/Kalender
  }
  const {pct:weatherPct, reason:weatherReason}=getDayModifiers(dateStr, storeId, weatherMap, calendarEvents, settings);

  // Korrektur anhand der Entsorgung derselben Kategorie genau eine Woche zuvor: viel übrig -> zusätzlich
  // reduzieren, früh ausverkauft -> zusätzlich erhöhen. Das ist die ehrliche Rückmeldung "hat die letzte
  // Zahl gestimmt?", statt sich nur auf Wetterdaten zu verlassen.
  let dispPct=0, dispReason='';
  const targetDate=new Date(dateStr+'T00:00:00');
  const lastWeekDateStr=new Date(targetDate.getTime()-7*86400000).toISOString().split('T')[0];
  const dispRec=lastWeekDisposalByDate?.[lastWeekDateStr]?.[category];
  if(dispRec){
    if(dispRec.soldOutEarly){ dispPct+=10; dispReason='🔥 Vorwoche ausverkauft'; }
    else if(dispRec.leftoverPortionen>5){ dispPct-=10; dispReason='🍽️ Vorwoche viel übrig'; }
  }

  const totalPct=weatherPct+dispPct;
  const adjustedQty=Math.round((baseQty*(1+totalPct/100))*4)/4;
  const baseLabel=`Basis: Vorwoche ${Math.round(baseQty*4)/4} Behälter (${weekdayStr})`;
  const reasonParts=[weatherReason, dispReason].filter(Boolean).join(' · ');
  return {qty: adjustedQty, reason: reasonParts ? `${baseLabel} · ${reasonParts}` : baseLabel};
}
function isLasagneLocked(dateStr){
  const cutoff=new Date(dateStr+'T12:00:00');
  cutoff.setDate(cutoff.getDate()-1); // Vortag, 12:00 Uhr
  return new Date()>cutoff;
}
// Liest die tatsächlichen Hauptgerichte (ohne Salat) für einen Wochentag aus dem rotierenden Menü,
// statt aus der statischen weekly_menu-Tabelle — sonst sind Forecast-Spalten (z.B. "Lasagne") veraltet/falsch.
function getMenuDishNamesForDay(wdStr){
  const entries = (typeof MENU_DATA!=='undefined' && MENU_DATA[`w${CURRENT_MENU_WOCHE}_${wdStr}`]) || [];
  return [...new Set(entries.filter(e=>e.slot!=='salat').map(e=>e.name).filter(Boolean))];
}

async function fetchHistoricalWeather(storeId, fromDate, toDate){
  const cacheKey = `hist_${storeId}_${fromDate}_${toDate}`;
  if(_weatherCache[cacheKey]) return _weatherCache[cacheKey];
  const stored=cacheGet(cacheKey);
  if(stored){ _weatherCache[cacheKey]=stored; return stored; }
  const coords = STORE_COORDS[storeId];
  if(!coords) return {};
  try{
    const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${coords.lat}&longitude=${coords.lon}&daily=temperature_2m_max,precipitation_sum&timezone=Europe%2FVienna&start_date=${fromDate}&end_date=${toDate}`;
    const res = await fetchWithTimeout(url, {}, 8000);
    const data = await res.json();
    const map = {};
    (data?.daily?.time||[]).forEach((d,i)=>{
      map[d] = { tempMax: data.daily.temperature_2m_max?.[i], precipSum: data.daily.precipitation_sum?.[i] };
    });
    _weatherCache[cacheKey] = map;
    cacheSet(cacheKey, map);
    return map;
  }catch(e){ console.error('Historisches Wetter fehlgeschlagen', e); return {}; }
}

async function runForecastReview(){
  const storeId = document.getElementById('fr-store').value;
  const fromDate = document.getElementById('fr-from').value;
  const toDate = document.getElementById('fr-to').value;
  const resultsEl = document.getElementById('fr-results');
  resultsEl.innerHTML = `<div style="text-align:center;color:var(--muted);padding:1rem;">Analysiere…</div>`;

  const stores = await api('stores?select=id,name&order=id').catch(()=>[]);
  const storeList = (stores||[]).filter(s=>s.id!=='zentrale'&&s.id!=='kitchen'&&s.id!=='kloster2'&&s.id!=='1070');
  const targetStores = storeId ? storeList.filter(s=>s.id===storeId) : storeList;

  const calendarEvents = await getCalendarEvents();
  let allRows = [];

  for(const store of targetStores){
    const sales = await api(`sales_history?store_id=eq.${store.id}&sale_date=gte.${fromDate}&sale_date=lte.${toDate}&select=sale_date,dish_category,qty,revenue`).catch(()=>[]);
    if(!sales?.length) continue;
    const weatherMap = await fetchHistoricalWeather(store.id, fromDate, toDate);

    // Baseline pro (Kategorie, Wochentag) über den ganzen Zeitraum — Vergleichsbasis für die Abweichung
    const baselineSum={}, baselineCount={};
    sales.forEach(s=>{
      const wd=new Date(s.sale_date+'T00:00:00').getDay();
      const key=`${s.dish_category}_${wd}`;
      baselineSum[key]=(baselineSum[key]||0)+s.qty;
      baselineCount[key]=(baselineCount[key]||0)+1;
    });

    sales.forEach(s=>{
      const wd=new Date(s.sale_date+'T00:00:00').getDay();
      const key=`${s.dish_category}_${wd}`;
      const baseline=baselineSum[key]/baselineCount[key];
      if(!baseline) return;
      const w = weatherMap[s.sale_date] || {};
      const feiertag = calendarEvents.find(e=>e.event_type==='feiertag' && e.event_date===s.sale_date && (!e.store_id||e.store_id===store.id));
      const ferien = calendarEvents.find(e=>e.event_type==='ferien' && s.sale_date>=e.event_date && s.sale_date<=(e.end_date||e.event_date) && (!e.store_id||e.store_id===store.id));
      let cat='normal';
      if(feiertag) cat='feiertag';
      else if(ferien) cat='ferien';
      else if(w.tempMax>=22 && (w.precipSum??0)<1) cat='sonnig';
      else if((w.precipSum??0)>=5) cat='regen';
      allRows.push({store:store.id, date:s.sale_date, category:s.dish_category, qty:s.qty, revenue:s.revenue, baseline, deviationPct:((s.qty-baseline)/baseline)*100, weatherCal:cat});
    });
  }

  if(!allRows.length){
    resultsEl.innerHTML = `<div style="text-align:center;padding:2rem;color:var(--muted);">Keine Verkaufsdaten im gewählten Zeitraum gefunden. (Prüfe, ob die sales_history-Tabelle importiert wurde.)</div>`;
    return;
  }

  const cats=['feiertag','ferien','regen','sonnig','normal'];
  const catLabels={feiertag:'🎉 Feiertage',ferien:'🏖️ Ferien',regen:'🌧️ Regentage',sonnig:'☀️ Sonnige/warme Tage',normal:'⛅ Normale Tage'};

  let html=`<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">${allRows.length} Verkaufs-Einträge aus ${new Set(allRows.map(r=>r.date)).size} Tagen analysiert (${fromDate} bis ${toDate}) — Basis: echte verkaufte Mengen aus Odoo</div>`;

  cats.forEach(cat=>{
    const rows=allRows.filter(r=>r.weatherCal===cat);
    if(!rows.length) return;
    const avgDeviation=rows.reduce((s,r)=>s+r.deviationPct,0)/rows.length;
    const totalRevenue=rows.reduce((s,r)=>s+r.revenue,0);
    const dayCount=new Set(rows.map(r=>r.date)).size;
    const devColor = avgDeviation>3?'#15803D':(avgDeviation<-3?'#DC2626':'var(--sub)');
    html+=`<div class="card" style="padding:12px 14px;margin-bottom:8px;">
      <div style="font-weight:600;margin-bottom:4px;">${catLabels[cat]}</div>
      <div style="font-size:12px;color:var(--sub);">${dayCount} Tage · ${rows.length} Gericht-Einträge</div>
      <div style="display:flex;gap:16px;margin-top:8px;align-items:baseline;">
        <div><div style="font-size:20px;font-weight:700;color:${devColor};">${avgDeviation>0?'+':''}${avgDeviation.toFixed(0)}%</div><div style="font-size:10px;color:var(--muted);">Ø Abweichung vs. normaler Wochentag</div></div>
        <div><div style="font-size:16px;font-weight:700;color:var(--green);">${totalRevenue.toFixed(0)} €</div><div style="font-size:10px;color:var(--muted);">Umsatz gesamt</div></div>
      </div>
    </div>`;
  });

  html+=`<div style="font-size:11px;color:var(--muted);padding:8px 4px;">📐 "Abweichung vs. normaler Wochentag" vergleicht z.B. einen Feiertags-Montag mit dem Ø aller anderen Montage im Zeitraum — nicht mit dem Wochendurchschnitt insgesamt. Passe die Prozentwerte in forecast_settings an diese echten Werte an, statt die Start-Schätzung zu behalten.</div>`;

  resultsEl.innerHTML=html;
}
window.runForecastReview=runForecastReview;

      <div style="font-size:10.5px;color:var(--muted);">${kwLabel}${isHistoric?' · Historie':''}</div>
    </div>
    <button onclick="changeForecastWeek(1)" style="padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;">Nächste →</button>
  </div>`;

  if(isHistoric){
    html+=`<div style="background:#F3F4F6;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11.5px;color:var(--muted);">📖 Historie — diese Woche liegt in der Vergangenheit, nur zur Nachverfolgung, nicht mehr veränderbar.</div>`;
  }

  const fromDate=weekDates[1], toDate=weekDates[5];
  const weekForecasts=await api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=gte.${fromDate}&forecast_date=lte.${toDate}&select=forecast_date,dish_name,qty,source,groesse`).catch(()=>[]);
  // fRecordsMap: mehrere Datensätze pro Tag/Gericht möglich (z.B. Lasagne 2x Groß + 1x Klein).
  // fMap bleibt zur Kompatibilität der erste Datensatz je Zelle (für alle Nicht-Lasagne-Gerichte reicht das).
  const fRecordsMap={};
  (weekForecasts||[]).forEach(f=>{
    if(!fRecordsMap[f.forecast_date])fRecordsMap[f.forecast_date]={};
    if(!fRecordsMap[f.forecast_date][f.dish_name])fRecordsMap[f.forecast_date][f.dish_name]=[];
    fRecordsMap[f.forecast_date][f.dish_name].push(f);
  });
  const fMap={};
  Object.keys(fRecordsMap).forEach(d=>{ fMap[d]={}; Object.keys(fRecordsMap[d]).forEach(dish=>{ fMap[d][dish]=fRecordsMap[d][dish][0]; }); });

  // Wetter, Feiertage/Ferien, Filial-Einstellungen & GESAMTE Verkaufshistorie einmal laden
  // (statt pro Zelle einzeln nachzufragen — wichtig bei vielen Zellen/schlechter Verbindung)
  const lastWeekFrom=new Date(new Date(fromDate+'T00:00:00').getTime()-7*86400000).toISOString().split('T')[0];
  const lastWeekTo=new Date(new Date(toDate+'T00:00:00').getTime()-7*86400000).toISOString().split('T')[0];
  const [weatherMap, calendarEvents, fcSettings, salesHistory, lastWeekDisposalRaw] = await Promise.all([
    fetchWeatherForStore(currentStore.id, fromDate, toDate),
    getCalendarEvents(),
    getForecastSettings(currentStore.id),
    getSalesHistoryForStore(currentStore.id),
    api(`disposal?store_id=eq.${currentStore.id}&disposal_date=gte.${lastWeekFrom}&disposal_date=lte.${lastWeekTo}&select=disposal_date,dish_name,leftover_qty,sold_out_time`).catch(()=>[])
  ]);
  // Entsorgung der Vorwoche nach Datum & Kategorie gruppieren — Grundlage für die Korrektur
  // "hat die letzte Zahl gestimmt?" statt sich nur auf Wetterdaten zu verlassen.
  const lastWeekDisposalByDate={};
  (lastWeekDisposalRaw||[]).forEach(d=>{
    const cat=mapDishNameToCategory(d.dish_name);
    if(!lastWeekDisposalByDate[d.disposal_date]) lastWeekDisposalByDate[d.disposal_date]={};
    const ex=lastWeekDisposalByDate[d.disposal_date][cat]||{leftoverPortionen:0, soldOutEarly:false};
    ex.leftoverPortionen+=(d.leftover_qty||0);
    ex.soldOutEarly=ex.soldOutEarly||!!d.sold_out_time;
    lastWeekDisposalByDate[d.disposal_date][cat]=ex;
  });
  const dayReasonMap={}; // dateStr -> "☀️ 26°C · kein Feiertag" (rein informativ, pro Tag einmal)
  for(let wd=1; wd<=5; wd++){
    const dateStr=weekDates[wd];
    const {reason}=getDayModifiers(dateStr, currentStore.id, weatherMap, calendarEvents, fcSettings);
    dayReasonMap[dateStr]=reason;
  }

  // Auto-Vorschläge für alle leeren Zellen berechnen — rein synchron/lokal (keine Netzwerk-Anfrage mehr pro Zelle)
  const suggestionJobs=[]; // {wd, dish}
  for(let wd=1; wd<=5; wd++){
    const wdStr=WEEKDAY_STR[wd];
    const dishNames=getMenuDishNamesForDay(wdStr);
    const allDishes=['Salat', ...dishNames, REIS_DISH_NAME].filter(Boolean);
    const dateStr=weekDates[wd];
    allDishes.forEach(dish=>{
      if(!(fMap[dateStr]||{})[dish]) suggestionJobs.push({dateStr, dish, wdStr});
    });
  }
  const suggestionMap={}; // suggestionMap[dateStr][dish] = {qty, reason} or null
  suggestionJobs.forEach(j=>{
    const result=computeAutoSuggestion(currentStore.id, j.dish, j.wdStr, j.dateStr, weatherMap, calendarEvents, fcSettings, salesHistory, lastWeekDisposalByDate);
    if(!suggestionMap[j.dateStr])suggestionMap[j.dateStr]={};
    suggestionMap[j.dateStr][j.dish]=result;
  });

  // Kompaktes Eingabefeld für eine Zelle (Tag × Gericht)
  const LASAGNE_SIZES=[{k:'gross',l:'Groß·18'},{k:'mittel',l:'Mit.·12'},{k:'klein',l:'Kl.·8'}];
  function cellInput(dateStr, dish, lockedNote){
    const rec=(fMap[dateStr]||{})[dish];
    const manual=rec?.source==='manual';
    const autoSuggestion=(suggestionMap[dateStr]||{})[dish];
    const autoVal=autoSuggestion?.qty ?? autoSuggestion; // Kompatibilität falls einfacher Zahlenwert
    const val=rec ? rec.qty : autoVal;
    const isSuggestion=!rec && autoVal!=null;
    const isLasagne=dish.includes('Lasagne');
    if(isLasagne) return lasagneCellInput(dateStr, dish, lockedNote, autoVal);
    if(isHistoric){
      // Historie: nur Anzeige, nicht mehr veraenderbar
      return `<div style="width:48px;margin:0 auto;text-align:center;font-size:13px;font-weight:600;color:${manual?'#F97316':'#1a1a18'};">${val!=null?formatQty(val):'–'}</div>`;
    }
    if(lockedNote){
      return `<div title="${lockedNote}" style="width:48px;margin:0 auto;text-align:center;border:1.5px solid var(--border);border-radius:6px;font-size:11px;padding:4px 1px;background:#F3F4F6;color:var(--muted);">🔒 ${val!=null?formatQty(val):'–'}</div>`;
    }
    const numberInput=`<input type="number" step="0.25" value="${val??''}" placeholder="–" data-dish="${escAttr(dish)}" data-date="${dateStr}" data-original="${val??''}"
      oninput="markForecastDirty(this)"
      style="width:48px;text-align:center;border:1.5px solid ${manual?'#F97316':(isSuggestion?'#0EA5E9':'var(--border)')};border-radius:6px;font-size:12px;padding:4px 1px;background:${manual?'#FFF7ED':(isSuggestion?'#F0F9FF':'#fff')};">`;
    return numberInput;
  }

  // Lasagne kann in mehreren Behälter-Größen gleichzeitig gebraucht werden (z.B. 2x Groß + 1x Klein) —
  // eigene Darstellung mit einer Zeile pro verwendeter Größe + "+ Größe"-Button für weitere.
  function lasagneCellInput(dateStr, dish, lockedNote, autoVal){
    const records=(fRecordsMap[dateStr]||{})[dish]||[];
    if(isHistoric){
      if(!records.length) return `<div style="width:56px;margin:0 auto;text-align:center;font-size:13px;color:var(--border);">–</div>`;
      return `<div style="font-size:10px;text-align:center;line-height:1.5;">${records.map(r=>`${formatQty(r.qty)}× ${(LASAGNE_SIZES.find(s=>s.k===r.groesse)||LASAGNE_SIZES[0]).l.split('·')[0]}`).join('<br>')}</div>`;
    }
    if(lockedNote){
      if(!records.length) return `<div title="${lockedNote}" style="width:56px;margin:0 auto;text-align:center;border:1.5px solid var(--border);border-radius:6px;font-size:10px;padding:4px 1px;background:#F3F4F6;color:var(--muted);">🔒 –</div>`;
      return `<div title="${lockedNote}" style="font-size:9.5px;text-align:center;background:#F3F4F6;border-radius:6px;padding:3px 2px;line-height:1.5;">🔒 ${records.map(r=>`${formatQty(r.qty)}×${(LASAGNE_SIZES.find(s=>s.k===r.groesse)||LASAGNE_SIZES[0]).l.split('·')[0]}`).join(', ')}</div>`;
    }
    const cellKey=dateStr+'|'+dish;
    if(!lasagneExtraSizes[cellKey]) lasagneExtraSizes[cellKey]=new Set();
    const shownSizes=records.length?records.map(r=>r.groesse):['gross'];
    const revealedOrder=LASAGNE_SIZES.map(s=>s.k).filter(k=>shownSizes.includes(k)||lasagneExtraSizes[cellKey].has(k));
    let h='<div style="display:flex;flex-direction:column;gap:3px;align-items:center;">';
    revealedOrder.forEach(sizeKey=>{
      const rec=records.find(r=>r.groesse===sizeKey);
      const isDefaultEmptyRow=sizeKey==='gross' && !rec && revealedOrder.length===1;
      const val=rec ? rec.qty : (isDefaultEmptyRow ? autoVal : null);
      const isSuggestion=isDefaultEmptyRow && autoVal!=null;
      const manual=rec?.source==='manual';
      const sizeLabel=(LASAGNE_SIZES.find(s=>s.k===sizeKey)||LASAGNE_SIZES[0]).l;
      h+=`<div style="display:flex;align-items:center;gap:3px;">
        <input type="number" step="0.25" value="${val??''}" placeholder="–" data-dish="${escAttr(dish)}" data-date="${dateStr}" data-groesse="${sizeKey}" data-original="${val??''}"
          oninput="markForecastDirty(this)"
          style="width:38px;text-align:center;border:1.5px solid ${manual?'#F97316':(isSuggestion?'#0EA5E9':'var(--border)')};border-radius:6px;font-size:11px;padding:3px 1px;background:${manual?'#FFF7ED':(isSuggestion?'#F0F9FF':'#fff')};">
        <span style="font-size:7.5px;color:var(--sub);white-space:nowrap;">${sizeLabel}</span>
      </div>`;
    });
    const remaining=LASAGNE_SIZES.filter(s=>!revealedOrder.includes(s.k));
    if(remaining.length){
      h+=`<button onclick="addLasagneSize('${escAttr(cellKey)}','${remaining[0].k}')" style="font-size:8px;color:var(--muted);background:none;border:1px dashed var(--border);border-radius:5px;padding:1px 4px;cursor:pointer;">+ Größe</button>`;
    }
    h+='</div>';
    return h;
  }

  let anyLasagne=false;
  html+=`<div class="card" id="forecast-table-wrap"><div style="overflow-x:auto;"><table class="pack-table" style="width:100%;">
    <thead><tr>
      <th style="text-align:left;">Tag</th>
      <th style="color:#A21CAF;">Salat</th>
      <th data-no-translate>Gericht 2</th>
      <th data-no-translate>Gericht 3</th>
      <th>Reis</th>
    </tr></thead><tbody>`;

  for(let wd=1; wd<=5; wd++){
    const wdStr=WEEKDAY_STR[wd];
    const dishNames=getMenuDishNamesForDay(wdStr); // [Gericht2-Name, Gericht3-Name] aus dem aktuell laufenden Menü

// Zeigt eine Zelle als "geändert, noch nicht gespeichert" (orange) und aktiviert den Speichern-Button —
// speichert aber noch NICHT selbst, damit man erst alle Felder in Ruhe ausfüllen kann, ohne dass
// zwischendurch ein Re-Render laufende Eingaben in anderen Zellen überschreibt.
function markForecastDirty(input){
  const dirty=input.value!==input.dataset.original;
  input.style.borderColor=dirty?'#F97316':'var(--border)';
  input.style.background=dirty?'#FFF7ED':'#fff';
  const btn=document.getElementById('forecast-save-btn');
  if(btn){
    const anyDirty=[...document.querySelectorAll('#forecast-table-wrap input[data-dish]')].some(i=>i.value!==i.dataset.original);
    btn.disabled=!anyDirty;
    btn.style.opacity=anyDirty?'1':'0.4';
  }
}
window.markForecastDirty=markForecastDirty;

// Sammelt alle geänderten Zellen (auch mehrere Lasagne-Größen gleichzeitig) und speichert sie in
// einem Rutsch — erst danach EIN Re-Render, damit keine parallel eingegebenen Werte verloren gehen.
async function saveForecastChanges(){
  const inputs=[...document.querySelectorAll('#forecast-table-wrap input[data-dish]')].filter(i=>i.value!==i.dataset.original);
  if(!inputs.length){ showToast('Keine Änderungen'); return; }
  const btn=document.getElementById('forecast-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Speichert …'; }
  try{
    for(const input of inputs){
      const dateStr=input.dataset.date;
      const dishName=input.dataset.dish;
      const groesse=input.dataset.groesse;
      const newQty=parseFloat(input.value);
      if(groesse){
        await api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=eq.${dateStr}&dish_name=eq.${encodeURIComponent(dishName)}&groesse=eq.${groesse}`,{method:'DELETE'});
        if(!isNaN(newQty) && newQty>0){
          await api('forecast_qty',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,forecast_date:dateStr,dish_name:dishName,qty:newQty,groesse,source:'manual',changed_by:currentStore.name,changed_at:new Date().toISOString()}])});
        }
      }else{
        if(isNaN(newQty)) continue;
        const existing=await api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=eq.${dateStr}&dish_name=eq.${encodeURIComponent(dishName)}&select=groesse`).catch(()=>[]);
        const existingGroesse=existing?.[0]?.groesse||'gross';
        await api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=eq.${dateStr}&dish_name=eq.${encodeURIComponent(dishName)}`,{method:'DELETE'});
        await api('forecast_qty',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,forecast_date:dateStr,dish_name:dishName,qty:newQty,groesse:existingGroesse,source:'manual',changed_by:currentStore.name,changed_at:new Date().toISOString()}])});
      }
    }
    showToast('✓ Änderungen gespeichert — Küche wird informiert');
    renderOrder();
  }catch(e){
    console.error(e);
    showToast('Fehler beim Speichern');
    if(btn){ btn.disabled=false; btn.textContent='💾 Änderungen speichern'; }
  }
}
window.saveForecastChanges=saveForecastChanges;

async function submitOrder(){
  const today=new Date().toISOString().split('T')[0];
  const tab=ORDER_TABS[activeOrderTab];
  const tabArticleIds=new Set(articles.filter(a=>tab.cats.includes(a.category)).map(a=>a.id));
  const rows=Object.entries(orderQtys)
    .filter(([id,v])=>v>0 && tabArticleIds.has(parseInt(id)))
    .map(([id,qty])=>({store_id:currentStore.id,article_id:parseInt(id),quantity:qty,order_date:today}));
  const note=document.getElementById('special-note-'+activeOrderTab)?.value?.trim()||'';
  if(!rows.length&&!note){showToast('Nichts eingetragen');return;}
  const btn=document.getElementById('order-submit-btn');
  const originalLabel=btn?.textContent;
  if(btn){ btn.disabled=true; btn.textContent='Wird gespeichert…'; btn.style.opacity='0.7'; }
  try{
    for(const aid of tabArticleIds){
      await api(`orders?store_id=eq.${currentStore.id}&article_id=eq.${aid}&order_date=eq.${today}`,{method:'DELETE'});
    }
    if(rows.length) await api('orders',{method:'POST',body:JSON.stringify(rows)});
    if(note){
      await api(`special_orders?store_id=eq.${currentStore.id}&order_date=eq.${today}`,{method:'DELETE'});
      await api('special_orders',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,note,order_date:today}])});
    }
    if(btn){ btn.textContent='✓ Gespeichert!'; btn.style.background='#15803D'; btn.style.opacity='1'; }
    showToast('✓ '+tab.title+' erfolgreich abgeschickt!');
    const goBackToSchichtende=schichtendeReturnFlag;
    schichtendeReturnFlag=false;
    setTimeout(()=>goTo(goBackToSchichtende?'schichtende':'home'), 700); // kurze Verzögerung, damit die Bestätigung wirklich gesehen wird
  }catch(e){
    console.error(e);
    showToast('❌ Fehler beim Speichern — bitte nochmal versuchen');
    if(btn){ btn.disabled=false; btn.textContent=originalLabel; btn.style.opacity='1'; }
  }
}

function clItemEmoji(text){
  const t=(text||'').toLowerCase();
  if(t.includes('aufsperr')||t.includes('einstempeln')) return '🔑';
  if(t.includes('absperr')||t.includes('abschließen')) return '🔒';
  if(t.includes('warmhalte')) return '🔥';
  if(t.includes('kaffee')) return '☕';
  if(t.includes('alles sauber')||t.includes('sauber?')) return '🧼';
  if(t.includes('reinig')||t.includes('putzen')||t.includes('wischen')) return '🧹';
  if(t.includes('desinfiz')) return '🧴';
  if(t.includes('verpackung')) return '📦';
  if(t.includes('limetten')||t.includes('schneiden')||t.includes('einräumen')) return '🥗';
  if(t.includes('tafel')||t.includes('beschriften')) return '✏️';
  if(t.includes('musik')) return '🎵';
  if(t.includes('geschirrspüler')) return '🍽️';
  if(t.includes('einsortieren')) return '📥';
  if(t.includes('bestellt')) return '✅';
  if(t.includes('whatsapp')) return '💬';
  if(t.includes('kassa')||t.includes('kasse')) return '💶';
  if(t.includes('müll')||t.includes('mistkübel')||t.includes('mist')) return '🗑️';
  if(t.includes('licht')) return '💡';
  if(t.includes('kühl')) return '❄️';
  if(t.includes('boden')) return '🧺';
  return '📝';
}
const CL_SECTION_EMOJI={oeffnung:'🔑',reinigung:'🧹',abschluss:'🌙'};
function renderClBody(){
  const items=templates[activeCl]||[];
  const done=items.filter(x=>clDone[x.id]).length;
  const secs=[...new Set(items.map(x=>x.section))];
  const el=document.getElementById('cl-body');
  let html=`<div class="progress-row"><span>Fortschritt</span><span>${done} / ${items.length}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${items.length?Math.round(done/items.length*100):0}%"></div></div>`;
  if(activeCl==='abschluss'){
    html+=`<div onclick="goToGuideEntry('Kassaabschluss')" style="display:flex;align-items:center;gap:6px;background:#F0F9FF;border:0.5px solid #BAE6FD;border-radius:8px;padding:8px 12px;margin-bottom:8px;cursor:pointer;font-size:11.5px;color:#0369A1;">
      <span>❓</span><span>Brauchst du Hilfe? Z.B. beim Kassaabschluss → Guide öffnen</span>
    </div>`;
  }
  html+=`<div class="card">`;
  secs.forEach(sec=>{
    html+=`<div class="section-lbl" style="padding:8px 14px 4px;">${CL_SECTION_EMOJI[activeCl]||'📋'} ${sec}</div>`;
    items.filter(x=>x.section===sec).forEach(item=>{
      const d=!!clDone[item.id];
      html+=`<div class="cl-item" onclick="toggleCl(${item.id})">
        <div class="check-box${d?' done':''}">
          ${d?`<svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>`:''}
        </div>
        <span class="cl-text${d?' done':''}">${clItemEmoji(item.item_text)} ${item.item_text}</span>
      </div>`;
    });
  });
  html+='</div>';
  el.innerHTML=html;
  translateEl(el);
}
async function toggleCl(templateId){
  const today=new Date().toISOString().split('T')[0];
  if(clDone[templateId]){
    await api(`checklist_done?store_id=eq.${currentStore.id}&template_id=eq.${templateId}&done_date=eq.${today}`,{method:'DELETE'});
    delete clDone[templateId];
  }else{
    await api('checklist_done',{method:'POST',body:JSON.stringify({store_id:currentStore.id,template_id:templateId,done_date:today})});
    clDone[templateId]=true;
  }
  renderClBody();
  const items=templates[activeCl]||[];
  if(items.length&&items.filter(x=>clDone[x.id]).length===items.length) showToast('✓ '+CL_LABELS[activeCl]+' erledigt!');
}

  el.innerHTML=backToHomeHtml()+pageHeaderHtml('🧭','Operations — Mengen anpassen','Für alle Filialen direkt überschreiben.','#2B3A67')+`<div id="orgfc-content"><div style="text-align:center;color:var(--muted);padding:1rem;">Wird geladen…</div></div>`;
  translateEl(el);

  const stores=await api('stores?select=id,name&order=id').catch(()=>[]);
  const storeList=(stores||[]).filter(s=>s.id!=='zentrale'&&s.id!=='kitchen'&&s.id!=='kloster2'&&s.id!=='1070');
  const weekDates=getWeekdayDates();
  const fromDate=weekDates[1], toDate=weekDates[5];

  const [allForecasts, calendarEvents, refWeather]=await Promise.all([
    api(`forecast_qty?forecast_date=gte.${fromDate}&forecast_date=lte.${toDate}&select=store_id,forecast_date,dish_name,qty,source`).catch(()=>[]),
    getCalendarEvents(),
    fetchWeatherForStore('lb', fromDate, toDate)
  ]);
  const fMap={};
  (allForecasts||[]).forEach(f=>{
    if(!fMap[f.forecast_date])fMap[f.forecast_date]={};
    if(!fMap[f.forecast_date][f.store_id])fMap[f.forecast_date][f.store_id]={};
    fMap[f.forecast_date][f.store_id][f.dish_name]=f;
  });
  const zeroSettings={weather_sunny_pct:0,weather_rain_pct:0,feiertag_pct:0,ferien_pct:0};

  let html='';

  for(let wd=1; wd<=5; wd++){
    const wdStr=WEEKDAY_STR[wd];
    const dateStr=weekDates[wd];
    const dateLabel=new Date(dateStr+'T00:00:00').toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'2-digit'});
    const dishNames=getMenuDishNamesForDay(wdStr);
    const allDishes=['Salat', ...dishNames, REIS_DISH_NAME].filter(Boolean);
    const {reason}=getDayModifiers(dateStr, 'lb', refWeather, calendarEvents, zeroSettings);
    const isToday=new Date().toISOString().split('T')[0]===dateStr;

    html+=`<div class="section-lbl" style="${isToday?'color:#2B3A67;font-weight:700;':''}">${dateLabel}${isToday?' — heute':''}</div>`;
    if(reason) html+=`<div style="font-size:10.5px;color:var(--muted);margin:-2px 0 4px 2px;">${reason}</div>`;
    html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table" style="width:100%;"><thead><tr>
      <th style="text-align:left;">Filiale</th>
      ${allDishes.map(d=>`<th data-no-translate style="font-size:10.5px;">${d}</th>`).join('')}
    </tr></thead><tbody>`;
    storeList.forEach(s=>{
      html+=`<tr><td style="text-align:left;font-size:11.5px;" data-no-translate>${s.name.split(' ')[0]}</td>`;
      allDishes.forEach(dish=>{
        const rec=((fMap[dateStr]||{})[s.id]||{})[dish];
        const manual=rec?.source==='manual';
        html+=`<td><input type="number" step="0.25" value="${rec?.qty??''}" placeholder="–" data-store="${s.id}" data-dish="${escAttr(dish)}" data-date="${dateStr}"
          onchange="updateForecastQtyOrg(this)"
          style="width:44px;text-align:center;border:1.5px solid ${manual?'#F97316':'var(--border)'};border-radius:6px;font-size:12px;padding:4px 1px;background:${manual?'#FFF7ED':'#fff'};"></td>`;
      });
      html+='</tr>';
    });
    html+='</tbody></table></div></div>';
  }

  html+=`<div style="font-size:10.5px;color:var(--muted);padding:8px 2px;">Orange = manuell angepasst (von einem Store oder von dir hier). Änderungen wirken sich sofort auf Store- und Küchen-Ansicht aus.</div>`;

  document.getElementById('orgfc-content').innerHTML=html;
  translateEl(el);
}

async function updateForecastQtyOrg(inputEl){
  const storeId=inputEl.dataset.store;
  const dish=inputEl.dataset.dish;
  const dateStr=inputEl.dataset.date;
  const qty=inputEl.value===''?null:parseFloat(inputEl.value);
  try{
    await api(`forecast_qty?store_id=eq.${storeId}&dish_name=eq.${encodeURIComponent(dish)}&forecast_date=eq.${dateStr}`,{method:'DELETE'});
    if(qty!=null){
      await api('forecast_qty',{method:'POST',body:JSON.stringify([{store_id:storeId,dish_name:dish,forecast_date:dateStr,qty,source:'manual'}])});
    }
    inputEl.style.borderColor='#F97316';
    inputEl.style.background='#FFF7ED';
    showToast('✔ Gespeichert');
  }catch(e){console.error(e);showToast('Fehler beim Speichern');}
}
window.updateForecastQtyOrg=updateForecastQtyOrg;

async function sendBroadcast(){
  const target=document.getElementById('bc-target').value||null;
  const message=document.getElementById('bc-message').value.trim();
  if(!message){ showToast('Bitte Nachricht eingeben'); return; }
  try{
    await api('org_broadcasts',{method:'POST',body:JSON.stringify([{message, target_store_id:target, created_by:currentStore?.name||'Organisation'}])});
    showToast('✔ Nachricht gesendet');
    renderBroadcast();
  }catch(e){console.error(e);showToast('Fehler beim Senden');}
}
window.sendBroadcast=sendBroadcast;

async function loadBroadcastHistory(storeList){
  const wrap=document.getElementById('bc-history');
  if(!wrap) return;
  const storeMap=Object.fromEntries((storeList||[]).map(s=>[s.id,s.name]));
  const broadcasts=await api('org_broadcasts?select=*&order=created_at.desc&limit=30').catch(()=>[]);
  const reads=await api('org_broadcast_reads?select=broadcast_id,store_id').catch(()=>[]);
  const replies=await api('org_broadcast_replies?select=*&order=created_at.asc').catch(()=>[]);
  if(!broadcasts?.length){ wrap.innerHTML='<div class="card" style="padding:14px;text-align:center;color:var(--muted);font-size:13px;">Noch keine Nachrichten gesendet.</div>'; return; }

  wrap.innerHTML=broadcasts.map(b=>{
    const targetLabel=b.target_store_id?storeMap[b.target_store_id]||b.target_store_id:'📢 Alle Filialen';
    const targetStores=b.target_store_id?[b.target_store_id]:storeList.map(s=>s.id);
    const readSet=new Set(reads.filter(r=>r.broadcast_id===b.id).map(r=>r.store_id));
    const readCount=targetStores.filter(id=>readSet.has(id)).length;
    const myReplies=replies.filter(r=>r.broadcast_id===b.id);
    return `<div class="card" style="padding:12px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span data-no-translate style="font-size:12px;font-weight:600;color:#0EA5E9;">${targetLabel}</span>
        <span style="font-size:10.5px;color:var(--muted);">${new Date(b.created_at).toLocaleString('de-AT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
      </div>
      <div style="font-size:13px;color:#1a1a18;margin-top:4px;">${b.message}</div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:6px;">👁️ Gelesen: ${readCount}/${targetStores.length}</div>
      ${myReplies.length?`<div style="margin-top:8px;border-top:0.5px solid var(--border);padding-top:6px;">
        ${myReplies.map(r=>`<div style="font-size:12px;color:var(--sub);margin-top:4px;"><strong data-no-translate>${storeMap[r.store_id]||r.store_id}:</strong> ${r.reply}</div>`).join('')}
      </div>`:''}
    </div>`;
  }).join('');
}
let broadcastQueue=[];
async function checkForBroadcasts(){
  if(!currentStore || currentStore.id==='zentrale') return;
  try{
    const all=await api(`org_broadcasts?or=(target_store_id.is.null,target_store_id.eq.${currentStore.id})&order=created_at.asc&select=id,message,created_at`).catch(()=>[]);
    const reads=await api(`org_broadcast_reads?store_id=eq.${currentStore.id}&select=broadcast_id`).catch(()=>[]);
    const readIds=new Set((reads||[]).map(r=>r.broadcast_id));
    broadcastQueue=(all||[]).filter(b=>!readIds.has(b.id));
    showNextBroadcast();
  }catch(e){console.error(e);}
}
function showNextBroadcast(){
  const overlay=document.getElementById('bc-modal-overlay');
  if(!broadcastQueue.length){ overlay.style.display='none'; return; }
  const b=broadcastQueue[0];
  document.getElementById('bc-modal-message').textContent=b.message;
  document.getElementById('bc-modal-reply').value='';
  overlay.style.display='flex';
}
async function markCurrentBroadcastRead(){
  const b=broadcastQueue[0];
  if(!b) return;
  try{ await api('org_broadcast_reads',{method:'POST',body:JSON.stringify([{broadcast_id:b.id, store_id:currentStore.id}])}); }catch(e){console.error(e);}
  broadcastQueue.shift();
}
async function replyToBroadcast(){
  const b=broadcastQueue[0];
  if(!b) return;
  const reply=document.getElementById('bc-modal-reply').value.trim();
  if(reply){
    try{ await api('org_broadcast_replies',{method:'POST',body:JSON.stringify([{broadcast_id:b.id, store_id:currentStore.id, reply}])}); }catch(e){console.error(e);}
  }
  await markCurrentBroadcastRead();
  showToast(reply?'✔ Antwort gesendet':'✔ Geschlossen');
  showNextBroadcast();
}
window.replyToBroadcast=replyToBroadcast;
async function dismissBroadcast(){
  await markCurrentBroadcastRead();
  showNextBroadcast();
}
window.dismissBroadcast=dismissBroadcast;
