      <div style="font-size:10.5px;color:var(--muted);">${kwLabel}${isHistoric?' · Historie':''}</div>
    </div>
    <button onclick="changeForecastWeek(1)" style="padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;">Nächste →</button>
  </div>`;

  if(isHistoric){
    html+=`<div style="background:#F3F4F6;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11.5px;color:var(--muted);">📖 Historie — diese Woche liegt in der Vergangenheit, nur zur Nachverfolgung, nicht mehr veränderbar.</div>`;
  }

  const fromDate=weekDates[1], toDate=weekDates[5];
  const weekForecasts=await api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=gte.${fromDate}&forecast_date=lte.${toDate}&select=forecast_date,dish_name,qty,source,groesse`).catch(()=>[]);
  // fRecordsMap: mehrere Datensätze pro Tag/Gericht möglich (z.B. Lasagne 2x Groß + 1x Klein).
  // fMap bleibt zur Kompatibilität der erste Datensatz je Zelle (für alle Nicht-Lasagne-Gerichte reicht das).
  const fRecordsMap={};
  (weekForecasts||[]).forEach(f=>{
    if(!fRecordsMap[f.forecast_date])fRecordsMap[f.forecast_date]={};
    if(!fRecordsMap[f.forecast_date][f.dish_name])fRecordsMap[f.forecast_date][f.dish_name]=[];
    fRecordsMap[f.forecast_date][f.dish_name].push(f);
  });
  const fMap={};
  Object.keys(fRecordsMap).forEach(d=>{ fMap[d]={}; Object.keys(fRecordsMap[d]).forEach(dish=>{ fMap[d][dish]=fRecordsMap[d][dish][0]; }); });

  // Vorwoche forecast_qty + Entsorgung + Wetter — kein Sales History mehr
  const lastWeekFrom=new Date(new Date(fromDate+'T00:00:00').getTime()-7*86400000).toISOString().split('T')[0];
  const lastWeekTo=new Date(new Date(toDate+'T00:00:00').getTime()-7*86400000).toISOString().split('T')[0];
  const [weatherMap, calendarEvents, fcSettings, lastWeekFcRaw, lastWeekDisposalRaw] = await Promise.all([
    fetchWeatherForStore(currentStore.id, fromDate, toDate),
    getCalendarEvents(),
    getForecastSettings(currentStore.id),
    api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=gte.${lastWeekFrom}&forecast_date=lte.${lastWeekTo}&select=forecast_date,dish_name,qty,groesse`).catch(()=>[]),
    api(`disposal?store_id=eq.${currentStore.id}&disposal_date=gte.${lastWeekFrom}&disposal_date=lte.${lastWeekTo}&select=disposal_date,dish_name,leftover_qty,sold_out_time`).catch(()=>[])
  ]);
  // Vorwoche Forecast nach Datum & Kategorie — Basis für Vorschlag
  const lastWeekFcByDate={};
  (lastWeekFcRaw||[]).forEach(f=>{
    const cat=mapDishNameToCategory(f.dish_name);
    if(!lastWeekFcByDate[f.forecast_date])lastWeekFcByDate[f.forecast_date]={};
    if(!lastWeekFcByDate[f.forecast_date][cat])lastWeekFcByDate[f.forecast_date][cat]={};
    lastWeekFcByDate[f.forecast_date][cat][f.groesse||'gross']=f.qty;
  });
  // Entsorgung der Vorwoche nach Datum & Kategorie
  const lastWeekDisposalByDate={};
  (lastWeekDisposalRaw||[]).forEach(d=>{
    const cat=mapDishNameToCategory(d.dish_name);
    if(!lastWeekDisposalByDate[d.disposal_date])lastWeekDisposalByDate[d.disposal_date]={};
    const ex=lastWeekDisposalByDate[d.disposal_date][cat]||{leftoverPortionen:0,soldOutEarly:false};
    ex.leftoverPortionen+=(d.leftover_qty||0);
    ex.soldOutEarly=ex.soldOutEarly||!!d.sold_out_time;
    lastWeekDisposalByDate[d.disposal_date][cat]=ex;
  });
  const dayReasonMap={}; // dateStr -> "☀️ 26°C · kein Feiertag" (rein informativ, pro Tag einmal)
  for(let wd=1; wd<=5; wd++){
    const dateStr=weekDates[wd];
    const {reason}=getDayModifiers(dateStr, currentStore.id, weatherMap, calendarEvents, fcSettings);
    dayReasonMap[dateStr]=reason;
  }

  // Auto-Vorschläge für alle leeren Zellen berechnen — rein synchron/lokal (keine Netzwerk-Anfrage mehr pro Zelle)
  const suggestionJobs=[]; // {wd, dish}
  for(let wd=1; wd<=5; wd++){
    const wdStr=WEEKDAY_STR[wd];
    const dateStr=weekDates[wd];
    const dishNames=getMenuDishNamesForDay(wdStr, dateStr);
    const salatName=getSalatNameForDate(dateStr);
    const allDishes=[salatName, ...dishNames, REIS_DISH_NAME].filter(Boolean);
    allDishes.forEach(dish=>{
      if(!(fMap[dateStr]||{})[dish]) suggestionJobs.push({dateStr, dish, wdStr});
    });
  }
  const suggestionMap={}; // suggestionMap[dateStr][dish] = {qty, reason} or null
  // Vorwoche-Referenz für ALLE Zellen (nicht nur leere) berechnen — wird unter jeder Zelle angezeigt
  const lastWeekQtyMap={}; // lastWeekQtyMap[dateStr][dish] = {qty, disposal}
  for(let wd=1; wd<=5; wd++){
    const wdStr=WEEKDAY_STR[wd];
    const dateStr=weekDates[wd];
    const dishNames=getMenuDishNamesForDay(wdStr, dateStr);
    const salatName=getSalatNameForDate(dateStr);
    const allDishes=[salatName, ...dishNames, REIS_DISH_NAME].filter(Boolean);
    const lastWeekDateStr=new Date(new Date(dateStr+'T00:00:00').getTime()-7*86400000).toISOString().split('T')[0];
    allDishes.forEach(dish=>{
      const category=mapDishNameToCategory(dish);
      const prevQty=(lastWeekFcByDate[lastWeekDateStr]?.[category]?.['gross'])||null;
      const dispRec=(lastWeekDisposalByDate[lastWeekDateStr]||{})[category];
      if(!lastWeekQtyMap[dateStr]) lastWeekQtyMap[dateStr]={};
      lastWeekQtyMap[dateStr][dish]={
        qty: prevQty,
        soldOutEarly: dispRec?.soldOutEarly||false,
        leftover: dispRec?.leftoverPortionen||0
      };
    });
  }
  suggestionJobs.forEach(j=>{
    const cat=mapDishNameToCategory(j.dish);
    const prevDateStr=new Date(new Date(j.dateStr+'T00:00:00').getTime()-7*86400000).toISOString().split('T')[0];
    const prevQty=(lastWeekFcByDate[prevDateStr]?.[cat]?.['gross'])||null;
    if(prevQty==null){ if(!suggestionMap[j.dateStr])suggestionMap[j.dateStr]={}; suggestionMap[j.dateStr][j.dish]=null; return; }
    let qty=prevQty;
    const reasons=[`Vorwoche: ${formatQty(prevQty)} Bhlt`];
    const disp=(lastWeekDisposalByDate[prevDateStr]||{})[cat];
    if(disp){
      if(disp.soldOutEarly){ qty=Math.round((qty+0.25)*4)/4; reasons.push('🔥 +0.25 ausverkauft'); }
      else if(disp.leftoverPortionen>10){ qty=Math.max(0.25,Math.round((qty-0.5)*4)/4); reasons.push('📦 −0.5 viel übrig'); }
      else if(disp.leftoverPortionen>4){ qty=Math.max(0.25,Math.round((qty-0.25)*4)/4); reasons.push('📦 −0.25 etwas übrig'); }
    }
    const {pct:wPct,reason:wReason}=getDayModifiers(j.dateStr, currentStore.id, weatherMap, calendarEvents, fcSettings);
    if(wPct!==0){ qty=Math.max(0.25,Math.round((qty*(1+wPct/100))*4)/4); if(wReason)reasons.push(wReason); }
    if(!suggestionMap[j.dateStr])suggestionMap[j.dateStr]={};
    suggestionMap[j.dateStr][j.dish]={qty,reason:reasons.join(' · ')};
  });

  // Kompaktes Eingabefeld für eine Zelle (Tag × Gericht)
  function cellInput(dateStr, dish, lockedNote){
    const rec=(fMap[dateStr]||{})[dish];
    const manual=rec?.source==='manual'||rec?.source==='store'||rec?.source==='org';
    const isOrgSet=rec?.source==='org';
    const manualColor=isOrgSet?'#2B3A67':'#F97316';
    const manualBg=isOrgSet?'#EEF1F8':'#FFF7ED';
    const autoSuggestion=FORECAST_SUGGESTIONS_ENABLED?(suggestionMap[dateStr]||{})[dish]:null;
    const autoVal=autoSuggestion?.qty ?? autoSuggestion; // Kompatibilität falls einfacher Zahlenwert
    const val=rec ? rec.qty : autoVal;
    const isSuggestion=!rec && autoVal!=null;
    const isLasagne=dish.includes('Lasagne');
    if(isLasagne) return lasagneCellInput(dateStr, dish, lockedNote, autoVal);
    if(isHistoric){
      // Historie: nur Anzeige, nicht mehr veraenderbar
      return `<div style="width:48px;margin:0 auto;text-align:center;font-size:13px;font-weight:600;color:${manual?manualColor:'#1a1a18'};">${val!=null?formatQty(val):'–'}</div>`;
    }
    if(lockedNote){
      return `<div title="${lockedNote}" style="width:48px;margin:0 auto;text-align:center;border:1.5px solid var(--border);border-radius:6px;font-size:11px;padding:4px 1px;background:#F3F4F6;color:var(--muted);">🔒 ${val!=null?formatQty(val):'–'}</div>`;
    }
    const lwData=(lastWeekQtyMap[dateStr]||{})[dish];
    const lwQty=lwData?.qty;
    const lwIcon=lwData?.soldOutEarly?'🔥':(lwData?.leftover>5?'📦':'•');
    const suggReason=autoSuggestion?.reason||'';
    // Vorwoche-Info nur als Tooltip (title) — kein div darunter damit Layout sauber bleibt
    const lwTitle=lwQty!=null?` Vorwoche: ${lwIcon} ${formatQty(lwQty)} Bhlt`:'';
    const orgTitle=isOrgSet?' · von Operations gesetzt':'';
    const fullTitle=escAttr((suggReason+lwTitle+orgTitle).trim());
    return `<input type="number" step="0.25" value="${val??''}" placeholder="–" data-dish="${escAttr(dish)}" data-date="${dateStr}" data-original="${val??''}"
      oninput="markForecastDirty(this)" onchange="autoSaveForecastCell(this)"
      title="${fullTitle}"
      style="width:48px;text-align:center;border:1.5px solid ${manual?manualColor:(isSuggestion?'#0EA5E9':'var(--border)')};border-radius:6px;font-size:12px;padding:4px 1px;background:${manual?manualBg:(isSuggestion?'#F0F9FF':'#fff')};">`;
  }

  // Lasagne kann in mehreren Behälter-Größen gleichzeitig gebraucht werden (z.B. 2x Groß + 1x Klein) —
  // eigene Darstellung mit einer Zeile pro verwendeter Größe + "+ Größe"-Button für weitere.
  function lasagneCellInput(dateStr, dish, lockedNote, autoVal){
    const records=(fRecordsMap[dateStr]||{})[dish]||[];
    // Labels fix: Groß·18, Mit.·12, Kl.·8
    const LABELS={gross:'Groß (18)',mittel:'Mit. (12)',klein:'Kl. (8)'};
    if(isHistoric){
      return `<div style="display:grid;grid-template-columns:52px 32px;gap:3px 4px;font-size:10px;text-align:left;">${LASAGNE_SIZES.map(s=>{
        const r=records.find(x=>x.groesse===s.k);
        return `<span style="font-size:8px;color:var(--muted);">${LABELS[s.k]}</span><span>${r?formatQty(r.qty):'–'}</span>`;
      }).join('')}</div>`;
    }
    if(lockedNote){
      return `<div title="${lockedNote}" style="display:grid;grid-template-columns:52px 32px;gap:3px 4px;font-size:10px;text-align:left;background:#F3F4F6;border-radius:6px;padding:4px 6px;">${LASAGNE_SIZES.map(s=>{
        const r=records.find(x=>x.groesse===s.k);
        return `<span style="font-size:8px;color:var(--muted);">${LABELS[s.k]}</span><span>🔒 ${r?formatQty(r.qty):'–'}</span>`;
      }).join('')}</div>`;
    }
    // Immer alle 3 Größen fix anzeigen — Grid statt Flex, damit Label-Spalte und Eingabefeld-Spalte
    // exakt untereinander ausgerichtet sind, unabhängig von der Textlänge des Labels.
    let h='<div style="display:grid;grid-template-columns:52px 40px;gap:4px 4px;align-items:center;">';
    LASAGNE_SIZES.forEach(sz=>{
      const rec=records.find(r=>r.groesse===sz.k);
      const val=rec ? rec.qty : (sz.k==='gross' && autoVal!=null ? autoVal : '');
      const isSugg=sz.k==='gross' && !rec && autoVal!=null;
      const manual=rec?.source==='manual'||rec?.source==='store'||rec?.source==='org';
      const isOrgSet=rec?.source==='org';
      const manualColor=isOrgSet?'#2B3A67':'#F97316';
      const manualBg=isOrgSet?'#EEF1F8':'#FFF7ED';
      h+=`<span style="font-size:8px;color:var(--muted);white-space:nowrap;">${LABELS[sz.k]}</span>
        <input type="number" step="0.25" value="${val}" placeholder="–"
          data-dish="${escAttr(dish)}" data-date="${dateStr}" data-groesse="${sz.k}" data-original="${val}"
          oninput="markForecastDirty(this)" onchange="autoSaveForecastCell(this)"
          style="width:40px;text-align:center;border:1.5px solid ${manual?manualColor:(isSugg?'#0EA5E9':'var(--border)')};border-radius:6px;font-size:11px;padding:3px 1px;background:${manual?manualBg:(isSugg?'#F0F9FF':'#fff')};">`;
    });
    h+='</div>';
    return h;
  }

  let anyLasagne=false;
  html+=`<div class="card" id="forecast-table-wrap"><div style="overflow-x:auto;"><table class="pack-table" style="width:100%;border-collapse:collapse;">
    <thead>
      <tr>
        <th style="text-align:left;border-bottom:1.5px solid var(--border);border-right:1px solid var(--border);">Tag</th>
        <th style="color:#A21CAF;font-size:10px;border-bottom:1.5px solid var(--border);border-right:1px solid var(--border);">Salat</th>
        <th style="font-size:10px;border-bottom:1.5px solid var(--border);border-right:1px solid var(--border);">Gericht 1</th>
        <th style="font-size:10px;border-bottom:1.5px solid var(--border);border-right:1px solid var(--border);">Gericht 2</th>
        <th style="font-size:10px;border-bottom:1.5px solid var(--border);">Reis</th>
      </tr>
      <tr style="background:var(--surface-1);">
        <td style="font-size:9px;color:var(--muted);padding:2px 6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);">Behälter</td>
        <td style="font-size:9px;color:var(--muted);padding:2px 3px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);">↑ Vorw.</td>
        <td style="font-size:9px;color:var(--muted);padding:2px 3px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);">↑ Vorw.</td>
        <td style="font-size:9px;color:var(--muted);padding:2px 3px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);">↑ Vorw.</td>
        <td style="font-size:9px;color:var(--muted);padding:2px 3px;text-align:center;border-bottom:1px solid var(--border);">↑ Vorw.</td>
      </tr>
    </thead><tbody>`;

  for(let wd=1; wd<=5; wd++){
    const wdStr=WEEKDAY_STR[wd];
    const dateStr=weekDates[wd];
    const dishNames=getMenuDishNamesForDay(wdStr, dateStr);
    const salatName=getSalatNameForDate(dateStr);
    const isToday=wd===todayWeekday && forecastWeekOffset===0; // nur markieren wenn aktuelle Woche
    const dateLabel=new Date(dateStr+'T00:00:00').toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});
    const g2=dishNames[0]||null, g3=dishNames[1]||null;
    const reisName=REIS_DISH_NAME;
    const rowLasagne=[g2,g3].some(n=>n && n.includes('Lasagne'));
    if(rowLasagne) anyLasagne=true;
    const isLastRow=wd===5;
    const rowBorder=isLastRow?'':'border-bottom:1px solid var(--border);';
    // Echter Gerichtname direkt bei der jeweiligen Zelle — ändert sich täglich, deshalb nicht mehr
    // im (fixen) Spaltenkopf, sondern hier pro Tag/Zelle. Fixe Höhe + sauberes Abschneiden mit "…"
    // bei zu langen Namen (line-clamp), damit garantiert nie in die nächste Zeile überläuft.
    const cellWrap=(labelHtml, inputHtml)=>`<div style="display:grid;grid-template-rows:34px auto;row-gap:4px;justify-items:center;align-items:end;overflow:hidden;">
        <div style="display:flex;align-items:flex-end;justify-content:center;overflow:hidden;width:100%;">${labelHtml}</div>
        <div>${inputHtml}</div>
      </div>`;
    const dishLabel=(name)=>name?`<div data-no-translate title="${escAttr(name)}" style="font-size:8px;color:var(--muted);line-height:1.15;max-width:66px;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${name}</div>`:'';

    html+=`<tr style="${isToday?`background:${tab.color}0d;`:''}">
      <td style="padding:6px 6px;vertical-align:top;${rowBorder}border-right:1px solid var(--border);">
        <div style="font-size:11.5px;font-weight:${isToday?'700':'600'};color:${isToday?tab.color:'inherit'};white-space:nowrap;">${WEEKDAY_NAMES[wd].slice(0,2)} ${dateLabel}${isToday?' 📍':''}</div>
        ${dayReasonMap[dateStr]?`<div style="font-size:9.5px;color:var(--muted);line-height:1.3;">${dayReasonMap[dateStr]}</div>`:''}
      </td>
      <td style="padding:4px 3px;text-align:center;vertical-align:top;${rowBorder}border-right:1px solid var(--border);">${cellWrap(dishLabel(salatName), cellInput(dateStr, salatName))}</td>
      <td style="padding:4px 3px;text-align:center;vertical-align:top;${rowBorder}border-right:1px solid var(--border);">
        ${g2?cellWrap(dishLabel(g2), cellInput(dateStr, g2, (g2.includes('Lasagne')&&isLasagneLocked(dateStr))?'Lasagne wird bereits produziert':null)):cellWrap('','<span style="color:var(--border);">·</span>')}
      </td>
      <td style="padding:4px 3px;text-align:center;vertical-align:top;${rowBorder}border-right:1px solid var(--border);">
        ${g3?cellWrap(dishLabel(g3), cellInput(dateStr, g3, (g3.includes('Lasagne')&&isLasagneLocked(dateStr))?'Lasagne wird bereits produziert':null)):cellWrap('','<span style="color:var(--border);">·</span>')}
      </td>
      <td style="padding:4px 3px;text-align:center;vertical-align:top;${rowBorder}">${cellWrap('', reisName?cellInput(dateStr, reisName):'<span style="color:var(--border);">·</span>')}</td>
    </tr>`;
  }
  html+='</tbody></table></div></div>';

  if(anyLasagne){
    html+=`<div style="font-size:10.5px;color:#15803D;padding:6px 2px 2px;">🥗 An Lasagne-Tagen wird grüner Salat + Dressing automatisch mitproduziert · 🔒 Lasagne-Menge ist am Vortag ab 12:00 Uhr fixiert</div>`;
  }
  html+=`<div style="font-size:11px;color:var(--muted);padding:8px 2px 4px;">
    🔵 Blau = KI-Vorschlag (Vorwoche + Wetter + Ferien) — antippen für Begründung &nbsp;·&nbsp; 🟠 Orange = von dir angepasst &nbsp;·&nbsp; 🟣 Navy = von Operations gesetzt<br>
    Kleine Zahl darunter = tatsächliche Menge Vorwoche &nbsp;·&nbsp; 🔥 = Vorwoche ausverkauft &nbsp;·&nbsp; 📦 = Vorwoche viel übrig
  </div>`;

  if(!isHistoric){
    html+=`<button id="forecast-save-btn" class="submit-btn" disabled onclick="saveForecastChanges()" style="background:${tab.color};opacity:0.4;margin-top:4px;">💾 Änderungen speichern</button>`;
  }

  el.innerHTML=html;
  translateEl(el);
}

// Zeigt eine Zelle als "geändert, noch nicht gespeichert" (orange) und aktiviert den Speichern-Button —
// speichert aber noch NICHT selbst, damit man erst alle Felder in Ruhe ausfüllen kann, ohne dass
// zwischendurch ein Re-Render laufende Eingaben in anderen Zellen überschreibt.
function markForecastDirty(input){
  const dirty=input.value!==input.dataset.original;
  input.style.borderColor=dirty?'#F97316':'var(--border)';
  input.style.background=dirty?'#FFF7ED':'#fff';
  const btn=document.getElementById('forecast-save-btn');
  if(btn){
    const anyDirty=[...document.querySelectorAll('#forecast-table-wrap input[data-dish]')].some(i=>i.value!==i.dataset.original);
    btn.disabled=!anyDirty;
    btn.style.opacity=anyDirty?'1':'0.4';
  }
}
window.markForecastDirty=markForecastDirty;

// Sammelt alle geänderten Zellen (auch mehrere Lasagne-Größen gleichzeitig) und speichert sie in
// einem Rutsch — erst danach EIN Re-Render, damit keine parallel eingegebenen Werte verloren gehen.
// Bei Lasagne: pro Tag/Gericht ALLE 3 Größen zusammen lesen, EINMAL löschen, EINMAL neu schreiben —
// verhindert, dass beim sequenziellen Einzel-Speichern eine bereits gespeicherte Größe verloren geht.
// Speichert eine einzelne Zelle sofort bei Verlassen des Feldes (onchange) — kein separater
// "Speichern"-Klick mehr nötig. Grund: mehrfach gemeldet, dass eine bewusst eingetragene 0 beim
// nächsten Öffnen wieder wie der alte Wert/Vorschlag aussah — Ursache war, dass der Store das Feld
// verlassen hat, ohne den separaten Sammel-Button zu drücken (anders als überall sonst in der App,
// wo Zahlenfelder sofort speichern). Der Sammel-Button bleibt zusätzlich bestehen für Batch-Eingabe.
async function autoSaveForecastCell(inputEl){
  const dateStr=inputEl.dataset.date;
  const dishName=inputEl.dataset.dish;
  if(!dateStr||!dishName) return;
  const isLasagneDish=dishName.includes('Lasagne');
  const rowsToInsert=[];
  try{
    if(isLasagneDish){
      const allSizeInputs=[...document.querySelectorAll(`#forecast-table-wrap input[data-dish="${escAttr(dishName)}"][data-date="${dateStr}"]`)];
      allSizeInputs.forEach(inp=>{
        const qty=parseFloat(inp.value);
        if(!isNaN(qty) && qty>=0){
          rowsToInsert.push({store_id:currentStore.id,forecast_date:dateStr,dish_name:dishName,qty,groesse:inp.dataset.groesse||'gross',source:'store',changed_by:currentStore.name,changed_at:new Date().toISOString()});
        }
      });
    } else {
      const qty=parseFloat(inputEl.value);
      if(!isNaN(qty) && qty>=0){
        rowsToInsert.push({store_id:currentStore.id,forecast_date:dateStr,dish_name:dishName,qty,groesse:'gross',source:'store',changed_by:currentStore.name,changed_at:new Date().toISOString()});
      }
    }
    await api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=eq.${dateStr}&dish_name=eq.${encodeURIComponent(dishName)}`,{method:'DELETE'}).catch(()=>{});
    if(rowsToInsert.length){
      await api('forecast_qty?on_conflict=store_id,forecast_date,dish_name,groesse',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(rowsToInsert)});
    }
    // Alle Inputs dieser Zelle als "gespeichert" (data-original nachziehen) markieren, Rand grün kurz aufblitzen
    const cellInputs=isLasagneDish
      ? [...document.querySelectorAll(`#forecast-table-wrap input[data-dish="${escAttr(dishName)}"][data-date="${dateStr}"]`)]
      : [inputEl];
    cellInputs.forEach(inp=>{
      inp.dataset.original=inp.value;
      const prevBorder=inp.style.borderColor;
      inp.style.borderColor='#22C55E';
      setTimeout(()=>{ markForecastDirty(inp); }, 600);
    });
    showToast('✓ Gespeichert');
  }catch(e){
    console.error(e);
    showToast('❌ Fehler beim Speichern — bitte nochmal versuchen');
  }
}
window.autoSaveForecastCell=autoSaveForecastCell;

async function saveForecastChanges(){
  const inputs=[...document.querySelectorAll('#forecast-table-wrap input[data-dish]')].filter(i=>i.value!==i.dataset.original);
  if(!inputs.length){ showToast('Keine Änderungen'); return; }
  const btn=document.getElementById('forecast-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Speichert …'; }
  try{
    // Nach Tag+Gericht gruppieren
    const groupKeys=new Set(inputs.map(i=>i.dataset.date+'|||'+i.dataset.dish));
    for(const key of groupKeys){
      const [dateStr, dishName]=key.split('|||');
      const isLasagneDish=dishName.includes('Lasagne');
      const rowsToInsert=[];
      if(isLasagneDish){
        // Alle 3 Größen-Inputs dieser Zelle einsammeln (nicht nur die geänderte), sonst geht beim
        // Speichern eine bereits eingetragene Größe verloren.
        const allSizeInputs=[...document.querySelectorAll(`#forecast-table-wrap input[data-dish="${escAttr(dishName)}"][data-date="${dateStr}"]`)];
        allSizeInputs.forEach(inp=>{
          const qty=parseFloat(inp.value);
          // qty>=0 statt qty>0: eine bewusst eingetragene 0 ("brauche ich heute keinen") muss
          // gespeichert werden, sonst erscheint beim nächsten Öffnen wieder der KI-Vorschlag und
          // wirkt so, als würde sich der Wert von selbst "zurückkorrigieren".
          if(!isNaN(qty) && qty>=0){
            rowsToInsert.push({store_id:currentStore.id,forecast_date:dateStr,dish_name:dishName,qty,groesse:inp.dataset.groesse||'gross',source:'store',changed_by:currentStore.name,changed_at:new Date().toISOString()});
          }
        });
      } else {
        const inp=[...document.querySelectorAll(`#forecast-table-wrap input[data-dish="${escAttr(dishName)}"][data-date="${dateStr}"]`)][0];
        const qty=inp?parseFloat(inp.value):NaN;
        if(!isNaN(qty) && qty>=0){
          rowsToInsert.push({store_id:currentStore.id,forecast_date:dateStr,dish_name:dishName,qty,groesse:'gross',source:'store',changed_by:currentStore.name,changed_at:new Date().toISOString()});
        }
      }
      // Erst ALLE bestehenden Datensätze für diesen Tag+Gericht löschen (alle Größen inkl. NULL) ...
      await api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=eq.${dateStr}&dish_name=eq.${encodeURIComponent(dishName)}`,{method:'DELETE'}).catch(()=>{});
      // ... dann alle aktuellen Werte (alle Größen) in EINEM Rutsch neu schreiben — atomar statt sequenziell
      if(rowsToInsert.length){
        await api('forecast_qty?on_conflict=store_id,forecast_date,dish_name,groesse',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(rowsToInsert)});
      }
    }
    showToast('✓ Änderungen gespeichert — Küche wird informiert');
    renderOrder();
  }catch(e){
    console.error(e);
    showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);
    if(btn){ btn.disabled=false; btn.textContent='💾 Änderungen speichern'; }
  }
}
window.saveForecastChanges=saveForecastChanges;

function addLasagneSize(cellKey, sizeKey){
  if(!lasagneExtraSizes[cellKey]) lasagneExtraSizes[cellKey]=new Set();
  lasagneExtraSizes[cellKey].add(sizeKey);
  // Nur den + Button durch ein neues Input ersetzen — KEIN renderOrder() damit
  // die restlichen ungespeicherten Werte im Forecast erhalten bleiben
  const btn=document.querySelector('[data-add-size="'+cellKey+'|'+sizeKey+'"]');
  if(!btn){ renderOrder(); return; }
  const [dateStr,...dishParts]=cellKey.split('|');
  const dishName=dishParts.join('|');
  const sLabel=sizeKey==='mittel'?'M':'K';
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;align-items:center;gap:3px;margin-top:3px;';
  const safeDish=dishName.replace(/"/g,'&quot;');
  wrap.innerHTML=`<span style="font-size:9px;color:var(--muted);min-width:18px;">${sLabel}</span><input type="number" step="0.25" placeholder="–" data-dish="${safeDish}" data-date="${dateStr}" data-groesse="${sizeKey}" data-original="" style="width:52px;padding:5px 3px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;text-align:center;" oninput="markForecastDirty(this)">`;
  btn.replaceWith(wrap);
  wrap.querySelector('input')?.focus();
}
window.addLasagneSize=addLasagneSize;

  renderOrder();

function adj(id,d){
  orderQtys[id]=Math.max(0,(orderQtys[id]||0)+d);
  const el=document.getElementById('q'+id);
  if(el){el.value=orderQtys[id];el.className='qty-val'+(orderQtys[id]>0?' has-val':'');}
}
function setQty(id,val){
  const n=Math.max(0, parseInt(val)||0);
  orderQtys[id]=n;
  const el=document.getElementById('q'+id);
  if(el){el.value=n;el.className='qty-val'+(n>0?' has-val':'');}
}
window.setQty=setQty;
async function submitOrder(){
  const today=new Date().toISOString().split('T')[0];
  const tab=ORDER_TABS[activeOrderTab];
  const tabArticleIds=new Set(articles.filter(a=>tab.cats.includes(a.category)).map(a=>a.id));
  const rows=Object.entries(orderQtys)
    .filter(([id,v])=>v>0 && tabArticleIds.has(parseInt(id)))
    .map(([id,qty])=>({store_id:currentStore.id,article_id:parseInt(id),quantity:qty,order_date:today}));
  const note=document.getElementById('special-note-'+activeOrderTab)?.value?.trim()||'';
  // WICHTIG: kein Early-Return mehr wenn rows leer ist! Alles-auf-0-Setzen muss die vorherige
  // Bestellung trotzdem löschen (sonst bleibt z.B. "3 Desserts" von heute Vormittag stehen, obwohl
  // die Filiale um 12 Uhr auf 0 aktualisiert hat — genau der Bug, den Dayan gemeldet hat).
  const btn=document.getElementById('order-submit-btn');
  const originalLabel=btn?.textContent;
  if(btn){ btn.disabled=true; btn.textContent='Wird gespeichert…'; btn.style.opacity='0.7'; }
  try{
    for(const aid of tabArticleIds){
      // WICHTIG: .catch() hier ist entscheidend — schlägt eine einzelne Löschung fehl (Netzwerk-
      // Hänger etc.), darf das nicht die ganze Schleife abbrechen. Sonst behalten Artikel weiter
      // hinten in der Liste ihre alte Zeile, die dann beim Einfügen mit der neuen kollidiert
      // ("duplicate key value violates unique constraint orders_store_id_article_id_order_date") —
      // genau der Fehler, den Börse gemeldet hat.
      await api(`orders?store_id=eq.${currentStore.id}&article_id=eq.${aid}&order_date=eq.${today}`,{method:'DELETE'}).catch(e=>console.error('orders delete failed for article',aid,e));
    }
    // Zusätzlich als Upsert (nicht reines Insert): falls trotz obigem Löschen doch noch eine alte
    // Zeile übrig sein sollte, wird sie aktualisiert statt einen Konflikt zu werfen.
    if(rows.length) await api('orders?on_conflict=store_id,article_id,order_date',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(rows)});
    // Abschick-Marker — unabhängig davon ob irgendeine Menge >0 war. Sonst zählt "bewusst überall 0
    // gewählt, weil von gestern noch alles da ist" nie als "erledigt" (genau der Bug, den ein Store
    // gemeldet hat: 0 bei Sweets gewählt, "Let's wrap up the shift" zeigte trotzdem "nicht erledigt").
    await api(`order_submissions?store_id=eq.${currentStore.id}&order_date=eq.${today}&tab=eq.${activeOrderTab}`,{method:'DELETE'}).catch(e=>console.error('order_submissions delete failed:',e));
    let submissionMarkerFailed=false;
    let submissionErrorDetail='';
    try{
      await api('order_submissions',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,order_date:today,tab:activeOrderTab}])});
    }catch(e){
      console.error('order_submissions insert failed:',e);
      submissionMarkerFailed=true;
      submissionErrorDetail=(e?.message||String(e)).slice(0,140);
    }
    if(note){
      await api(`special_orders?store_id=eq.${currentStore.id}&order_date=eq.${today}`,{method:'DELETE'});
      await api('special_orders',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,note,order_date:today}])});
    }
    if(btn){ btn.textContent='✓ Gespeichert!'; btn.style.background='#15803D'; btn.style.opacity='1'; }
    showToast(submissionMarkerFailed?`⚠️ Markierung fehlgeschlagen: ${submissionErrorDetail}`:'✓ '+tab.title+' erfolgreich abgeschickt!', submissionMarkerFailed);
    const goBackToSchichtende=schichtendeReturnFlag;
    schichtendeReturnFlag=false;
    setTimeout(()=>goTo(goBackToSchichtende?'schichtende':'home'), 700); // kurze Verzögerung, damit die Bestätigung wirklich gesehen wird
  }catch(e){
    console.error(e);
    const detail=(e?.message||String(e)).slice(0,140);
    showToast(`❌ Fehler beim Speichern: ${detail}`, true);
    if(btn){ btn.disabled=false; btn.textContent=originalLabel; btn.style.opacity='1'; }
  }
}

function switchCl(t){activeCl=t;document.querySelectorAll('.cl-tab').forEach((b,i)=>b.classList.toggle('active',CL_TYPES[i]===t));renderClBody();}
function clItemEmoji(text){
  const t=(text||'').toLowerCase();
  if(t.includes('aufsperr')||t.includes('einstempeln')) return '🔑';
  if(t.includes('absperr')||t.includes('abschließen')) return '🔒';
  if(t.includes('warmhalte')) return '🔥';
  if(t.includes('kaffee')) return '☕';
  if(t.includes('alles sauber')||t.includes('sauber?')) return '🧼';
  if(t.includes('reinig')||t.includes('putzen')||t.includes('wischen')) return '🧹';
  if(t.includes('desinfiz')) return '🧴';
  if(t.includes('verpackung')) return '📦';
  if(t.includes('limetten')||t.includes('schneiden')||t.includes('einräumen')) return '🥗';
  if(t.includes('tafel')||t.includes('beschriften')) return '✏️';
  if(t.includes('musik')) return '🎵';
  if(t.includes('geschirrspüler')) return '🍽️';
  if(t.includes('einsortieren')) return '📥';
  if(t.includes('bestellt')) return '✅';
  if(t.includes('whatsapp')) return '💬';
  if(t.includes('kassa')||t.includes('kasse')) return '💶';
  if(t.includes('müll')||t.includes('mistkübel')||t.includes('mist')) return '🗑️';
  if(t.includes('licht')) return '💡';
  if(t.includes('kühl')) return '❄️';
  if(t.includes('boden')) return '🧺';
  return '📝';
}
const CL_SECTION_EMOJI={oeffnung:'🔑',reinigung:'🧹',abschluss:'🌙'};
function renderClBody(){
  const items=templates[activeCl]||[];
  const done=items.filter(x=>clDone[x.id]).length;
  const secs=[...new Set(items.map(x=>x.section))];
  const el=document.getElementById('cl-body');
  let html=`<div class="progress-row"><span>Fortschritt</span><span>${done} / ${items.length}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${items.length?Math.round(done/items.length*100):0}%"></div></div>`;
  if(activeCl==='abschluss'){
    html+=`<div onclick="goToGuideEntry('Kassaabschluss')" style="display:flex;align-items:center;gap:6px;background:#F0F9FF;border:0.5px solid #BAE6FD;border-radius:8px;padding:8px 12px;margin-bottom:8px;cursor:pointer;font-size:11.5px;color:#0369A1;">
      <span>❓</span><span>Brauchst du Hilfe? Z.B. beim Kassaabschluss → Guide öffnen</span>
    </div>`;
  }
  html+=`<div class="card">`;
  secs.forEach(sec=>{
    html+=`<div class="section-lbl" style="padding:8px 14px 4px;">${CL_SECTION_EMOJI[activeCl]||'📋'} ${sec}</div>`;
    items.filter(x=>x.section===sec).forEach(item=>{
      const d=!!clDone[item.id];
      html+=`<div class="cl-item" onclick="toggleCl(${item.id})">
        <div class="check-box${d?' done':''}">
          ${d?`<svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>`:''}
        </div>
        <span class="cl-text${d?' done':''}">${clItemEmoji(item.item_text)} ${item.item_text}</span>
      </div>`;
    });
  });
  html+='</div>';
  el.innerHTML=html;
  translateEl(el);
}
async function toggleCl(templateId){
  const today=new Date().toISOString().split('T')[0];
  if(clDone[templateId]){
    await api(`checklist_done?store_id=eq.${currentStore.id}&template_id=eq.${templateId}&done_date=eq.${today}`,{method:'DELETE'});
    delete clDone[templateId];
  }else{
    await api('checklist_done',{method:'POST',body:JSON.stringify({store_id:currentStore.id,template_id:templateId,done_date:today})});
    clDone[templateId]=true;
  }
  renderClBody();
  const items=templates[activeCl]||[];
  if(items.length&&items.filter(x=>clDone[x.id]).length===items.length) showToast('✓ '+CL_LABELS[activeCl]+' erledigt!');
}

async function runHealthCheckRead(){
  const wrap=document.getElementById('hc-read-results');
  wrap.innerHTML='<div style="text-align:center;color:var(--muted);padding:8px;">Prüfe…</div>';

async function runHealthCheckWrite(){
  const wrap=document.getElementById('hc-write-results');
  wrap.innerHTML='<div style="text-align:center;color:var(--muted);padding:8px;">Prüfe…</div>';
  let html=''; let okCount=0;
  for(const {table,payload} of HEALTHCHECK_WRITE_TABLES){
    try{
      const inserted=await api(table,{method:'POST',body:JSON.stringify([payload])});
      const newId=inserted?.[0]?.id;
      // Sofort wieder aufräumen — Test-Zeile darf nirgends stehen bleiben
      if(newId) await api(`${table}?id=eq.${newId}`,{method:'DELETE'}).catch(()=>{});
      html+=hcResultRow(table,true,'schreiben & löschen erfolgreich');

    }catch(e){
      html+=hcResultRow(table,false,(e?.message||String(e)).slice(0,150));

  }
  wrap.innerHTML=`<div style="font-size:12px;font-weight:600;margin-bottom:6px;color:${okCount===HEALTHCHECK_WRITE_TABLES.length?'#15803D':'#DC2626'};">${okCount} von ${HEALTHCHECK_WRITE_TABLES.length} beschreibbar</div>${html}`;

async function runHealthCheckConcurrency(){
  const wrap=document.getElementById('hc-concurrency-results');
  wrap.innerHTML='<div style="text-align:center;color:var(--muted);padding:8px;">Simuliere 5 parallele Speicherungen…</div>';
  const testKey={store_id:'ZZ_HEALTHCHECK', order_date:'2000-01-01', tab:'concurrency_test'};
  // Sauber starten
  await api(`order_submissions?store_id=eq.ZZ_HEALTHCHECK&order_date=eq.2000-01-01&tab=eq.concurrency_test`,{method:'DELETE'}).catch(()=>{});
  const attempts=Array.from({length:5}, (_,i)=>
    api('order_submissions',{method:'POST',body:JSON.stringify([testKey])})
      .then(()=>({ok:true,i}))
      .catch(e=>({ok:false,i,error:(e?.message||String(e)).slice(0,150)}))
  );
  const results=await Promise.all(attempts);
  const succeeded=results.filter(r=>r.ok).length;
  const failed=results.filter(r=>!r.ok);
  // Aufräumen
  await api(`order_submissions?store_id=eq.ZZ_HEALTHCHECK&order_date=eq.2000-01-01&tab=eq.concurrency_test`,{method:'DELETE'}).catch(()=>{});
  let html=`<div style="font-size:12px;font-weight:600;margin-bottom:6px;">${succeeded} von 5 gleichzeitigen Versuchen erfolgreich</div>`;
  html+=`<div style="font-size:11.5px;color:var(--muted);margin-bottom:6px;">Das ist erwartbar und in Ordnung — wichtig ist nur, dass keiner davon die Datenbank in einen kaputten Zustand bringt (z.B. doppelte Zeilen).</div>`;
  failed.forEach(f=>{ html+=hcResultRow(`Versuch ${f.i+1}`,false,f.error); });
  wrap.innerHTML=html;
}
window.runHealthCheckConcurrency=runHealthCheckConcurrency;

  const tomorrowStr=tomorrow.toISOString().split('T')[0];
  try{
    const [stores, ordersToday, kcToday, forecastTomorrow, disposalToday, submissionsAllToday] = await Promise.all([
      api('stores?select=id,name&order=id').catch(()=>[]),
      api(`orders?order_date=eq.${today}&select=store_id,article_id,quantity`).catch(()=>[]),
      api(`kc_submissions?order_date=eq.${today}&select=store_id`).catch(()=>[]),
      api(`forecast_qty?forecast_date=eq.${tomorrowStr}&source=eq.manual&select=store_id`).catch(()=>[]),
      api(`disposal?disposal_date=eq.${today}&select=store_id,leftover_qty`).catch(()=>[]),
      api(`order_submissions?order_date=eq.${today}&select=store_id,tab`).catch(()=>[])
    ]);
    const storeList=(stores||[]).filter(s=>s.id!=='zentrale' && s.id!=='1070' && s.id!=='kitchen');
    const kcSet=new Set((kcToday||[]).map(k=>k.store_id));
    const forecastSet=new Set((forecastTomorrow||[]).map(f=>f.store_id));
    const disposalSet=new Set((disposalToday||[]).filter(d=>d.leftover_qty!=null).map(d=>d.store_id));

    // Reminder: Wochen-Forecast für die KOMMENDE Woche muss spätestens Freitag stehen — Dringlichkeit
    // steigt Richtung Freitag. Erkennung: gibt's überhaupt schon Einträge für nächste Woche (Mo–Fr)?
    let reminderHtml='';
    const nextWeek=getWeekdayDates(1);
    const nwFrom=nextWeek[1], nwTo=nextWeek[5];
    const nextWeekForecast=await api(`forecast_qty?forecast_date=gte.${nwFrom}&forecast_date=lte.${nwTo}&select=store_id&limit=1`).catch(()=>[]);
    const todayWd=(new Date().getDay()+6)%7; // Mo=0...So=6
    const isFriday=todayWd===4;
    const currentHour=new Date().getHours();
    const isFridayPastDeadline=isFriday && currentHour>=10;
    const forecastExists=(nextWeekForecast||[]).length>0;

    if(!forecastExists){
      // Kein Forecast angelegt — immer anzeigen, freitags rot + dringend
      const urgent=todayWd>=3;
      reminderHtml=`<div onclick="goTo('orgForecast')" style="display:flex;align-items:center;gap:10px;background:${isFridayPastDeadline?'#FEF2F2':urgent?'#FFFBEB':'#F0F9FF'};border:2px solid ${isFridayPastDeadline?'#EF4444':urgent?'#F59E0B':'#0EA5E9'};border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer;">
        <span style="font-size:22px;">${isFridayPastDeadline?'🚨':'📅'}</span>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;color:${isFridayPastDeadline?'#991B1B':urgent?'#78350F':'#0C4A6E'};">${isFridayPastDeadline?'⚠️ JETZT ERLEDIGEN — Forecast überfällig!':urgent?'Heute fällig: Forecast nächste Woche anlegen':'Forecast für nächste Woche noch offen'}</div>
          <div style="font-size:11px;color:${isFridayPastDeadline?'#B91C1C':urgent?'#92660A':'#0369A1'};margin-top:2px;">${isFridayPastDeadline?'Küche wartet — KI-Vorschläge prüfen & speichern':urgent?'Bis Freitag 10:00 Uhr — KI-Vorschläge sind bereits bereit':'Freitag bis 10:00 Uhr einplanen'}</div>
        </div>
        <span style="font-size:16px;color:${isFridayPastDeadline?'#991B1B':urgent?'#B45309':'#0369A1'};">→</span>
      </div>`;
    } else if(isFriday && currentHour<10){
      // Forecast existiert aber es ist noch freitags vor 10 — Bestätigungs-Reminder
      reminderHtml=`<div onclick="goTo('orgForecast')" style="display:flex;align-items:center;gap:10px;background:#F0FDF4;border:1.5px solid #22C55E;border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer;">
        <span style="font-size:22px;">✅</span>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;color:#166534;">Forecast nächste Woche angelegt</div>
          <div style="font-size:11px;color:#15803D;margin-top:2px;">Bitte noch einmal prüfen & bestätigen — bis 10:00 Uhr</div>
        </div>
        <span style="font-size:16px;color:#166534;">→</span>
      </div>`;
    }

    // Transporter/Sweets: Abschick-Marker (nicht "mind. 1 Artikel mit Menge>0") — sonst zählt
    // "bewusst überall 0 gewählt" nie als erledigt.
    const dot=ok=>`<span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${ok?'#22C55E':'#EF4444'};"></span>`;
    const dotNeutral=`<span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:#D9D9D6;" title="Heute nicht gefordert (nur Di & Do)"></span>`;
    const realWeekdayDash=new Date().getDay(); // 0=So,1=Mo,2=Di,3=Mi,4=Do,5=Fr,6=Sa
    const isKCDayDash=realWeekdayDash===2||realWeekdayDash===4; // Shop-Produkte nur Dienstag & Donnerstag
    let html=reminderHtml;
    html+=`<div class="section-lbl">📦 Bestellstatus heute</div><div class="card" style="overflow-x:auto;"><table class="pack-table" style="width:100%;"><thead><tr>
      <th style="text-align:left;">Filiale</th><th>Shop${isKCDayDash?'':'<br><span style="font-size:8px;font-weight:400;">(heute nicht nötig)</span>'}</th><th>Forecast<br>morgen</th><th>Transporter</th><th>Sweets</th><th>Entsorgung</th>
    </tr></thead><tbody>`;
    storeList.forEach(s=>{
      const storeSubmittedTabs=new Set((submissionsAllToday||[]).filter(sub=>sub.store_id===s.id).map(sub=>sub.tab));
      const transporterOk=storeSubmittedTabs.has('transporter');
      const sweetsOk=storeSubmittedTabs.has('sweets');
      const col=STORE_COLORS[s.id]||'#888';
      html+=`<tr>
        <td style="text-align:left;"><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:50%;background:${col};flex-shrink:0;"></span><span data-no-translate style="font-size:12.5px;font-weight:500;">${s.name.split(' ')[0]}</span></span></td>
        <td>${isKCDayDash?dot(kcSet.has(s.id)):dotNeutral}</td>
        <td>${dot(forecastSet.has(s.id))}</td>
        <td>${dot(transporterOk)}</td>
        <td>${dot(sweetsOk)}</td>
        <td>${dot(disposalSet.has(s.id))}</td>
      </tr>`;
    });
    html+='</tbody></table></div>';
    wrap.innerHTML=html;
    translateEl(wrap);
  }catch(e){console.error(e);}
}

async function loadOrgRolesRow(){
  const roles=await api('org_roles?select=*').catch(()=>[]);
  const byKey=Object.fromEntries((roles||[]).map(r=>[r.role_key,r]));

  // Bottom-Nav-Labels mit den aktuellen Namen befüllen (bleibt automatisch aktuell bei Namensänderung)
  // Nav labels: Küche stays "Küche" (not person name), others use person name
  const navLabelMap={transporter:'transporter', kc:'kc', sweets:'sweets', operations:'management'};
  Object.entries(navLabelMap).forEach(([roleKey,navKey])=>{
    const span=document.getElementById('navlabel-'+navKey);
    if(span && byKey[roleKey]) span.textContent=byKey[roleKey].person_name;
  });
  // Küche tab always shows "Küche" as label
  const kueEl=document.getElementById('navlabel-kueche');
  if(kueEl) kueEl.textContent='Küche';

  const wrap=document.getElementById('org-roles-row');
  if(!wrap) return;
  const order=(currentStore?.id==='kitchen'?['kueche','kc','transporter','sweets']:['kueche','operations','kc','transporter','sweets']);
  wrap.innerHTML=order.filter(k=>byKey[k]).map(k=>{
    const r=byKey[k];
    return `<div style="position:relative;">
      <button class="role-btn-color" onclick="orgRoleNav('${k}')" data-no-translate style="background:${r.color};">
        <span class="role-btn-role">${r.label}</span>
        <span class="role-btn-name">${r.person_name}</span>
      </button>
      <button onclick="editOrgRoleName(event,'${k}','${r.person_name.replace(/'/g,"\\'")}')" title="Namen ändern" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.25);border:none;border-radius:50%;width:26px;height:26px;color:#fff;cursor:pointer;font-size:12px;">✏️</button>
    </div>`;
  }).join('');
}

function orgRoleNav(key){
  const targets={kueche:()=>goTo('kitchen'), operations:()=>goTo('orgForecast'), kc:()=>goToPackTab('kc'), transporter:()=>goToPackTab('transporter'), sweets:()=>goTo('sweets')};

async function editOrgRoleName(ev, key, currentName){
  ev.stopPropagation();
  const name=prompt('Neuer Name für diesen Bereich:', currentName);
  if(!name || !name.trim() || name.trim()===currentName) return;
  try{
    await api(`org_roles?role_key=eq.${key}`,{method:'PATCH',body:JSON.stringify({person_name:name.trim()})});
    loadOrgRolesRow();
  }catch(e){console.error(e);showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);}
}
window.editOrgRoleName=editOrgRoleName;

let orgForecastWeekOffset = 0; // 0 = diese Woche, 1 = nächste Woche

async function renderOrgForecast(){
  const el=document.getElementById('v-orgForecast');
  el.innerHTML=backToHomeHtml()+pageHeaderHtml('🧭','Operations — Mengen anpassen','Für alle Filialen direkt überschreiben.','#2B3A67')+`<div id="orgfc-content"><div style="text-align:center;color:var(--muted);padding:1rem;">Wird geladen…</div></div>`;
  translateEl(el);

  const stores=await api('stores?select=id,name&order=id').catch(()=>[]);
  const storeList=(stores||[]).filter(s=>s.id!=='zentrale'&&s.id!=='kitchen'&&s.id!=='kloster2'&&s.id!=='1070');

  // Wochenauswahl — diese oder nächste Woche
  const weekDates=getWeekdayDates(orgForecastWeekOffset);
  const fromDate=weekDates[1], toDate=weekDates[5];
  const weekLabel=new Date(fromDate+'T00:00:00').toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'})
    +' – '+new Date(toDate+'T00:00:00').toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});

  // Woche-Switcher oben
  const weekSwitcher=`<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
    <button onclick="orgForecastWeekOffset=0;renderOrgForecast()" style="flex:1;padding:9px 4px;border-radius:10px;border:${orgForecastWeekOffset===0?'2px solid #2B3A67':'1.5px solid var(--border)'};background:${orgForecastWeekOffset===0?'#2B3A67':'var(--card)'};color:${orgForecastWeekOffset===0?'#fff':'var(--sub)'};font-family:'Boldonse',sans-serif;font-size:12px;line-height:1.3;cursor:pointer;">📅 Diese Woche<br><span style="font-size:10px;opacity:0.8;">${getWeekdayDates(0)[1].slice(5,10)}.–${getWeekdayDates(0)[5].slice(5,10)}.</span></button>
    <button onclick="orgForecastWeekOffset=1;renderOrgForecast()" style="flex:1;padding:9px 4px;border-radius:10px;border:${orgForecastWeekOffset===1?'2px solid #2B3A67':'1.5px solid var(--border)'};background:${orgForecastWeekOffset===1?'#2B3A67':'var(--card)'};color:${orgForecastWeekOffset===1?'#fff':'var(--sub)'};font-family:'Boldonse',sans-serif;font-size:12px;line-height:1.3;cursor:pointer;">📅 Nächste Woche<br><span style="font-size:10px;opacity:0.8;">${getWeekdayDates(1)[1].slice(5,10)}.–${getWeekdayDates(1)[5].slice(5,10)}.</span></button>
  </div>
  <div style="font-size:11px;color:var(--muted);margin:0 0 12px;text-align:center;">${weekLabel}</div>`;

  // Vorwoche-Daten für lernfähigen Forecast
  const prevFromDate=getWeekdayDates(orgForecastWeekOffset-1)[1];
  const prevToDate=getWeekdayDates(orgForecastWeekOffset-1)[5];

  // Lade alles parallel: aktueller Forecast, Vorwoche Forecast, Entsorgung Vorwoche,
  // Wetter Vorwoche (für Vergleich), Sales History für alle Stores
  const [allForecasts, calendarEvents, refWeather, prevForecasts, prevDisposals, fcSettings]=await Promise.all([
    api(`forecast_qty?forecast_date=gte.${fromDate}&forecast_date=lte.${toDate}&select=store_id,forecast_date,dish_name,qty,groesse,source`).catch(()=>[]),
    getCalendarEvents().catch(()=>[]),
    fetchWeatherForStore('lb', fromDate, toDate).catch(()=>({})),
    api(`forecast_qty?forecast_date=gte.${prevFromDate}&forecast_date=lte.${prevToDate}&select=store_id,forecast_date,dish_name,qty,groesse,source`).catch(()=>[]),
    api(`disposal?disposal_date=gte.${prevFromDate}&disposal_date=lte.${prevToDate}&select=store_id,disposal_date,dish_name,leftover_qty,sold_out_time,slot`).catch(()=>[]),
    api('forecast_settings?select=*').catch(()=>[])
  ]);

  // Settings für Wetter/Ferien-Zuschläge
  const settingsRec=(fcSettings||[])[0]||{weather_sunny_pct:-10,weather_rain_pct:10,feiertag_pct:-20,ferien_pct:-5};

  // fMap[date][store][dish][groesse] = rec
  const fMap={};
  (allForecasts||[]).forEach(f=>{
    if(!fMap[f.forecast_date])fMap[f.forecast_date]={};
    if(!fMap[f.forecast_date][f.store_id])fMap[f.forecast_date][f.store_id]={};
    if(!fMap[f.forecast_date][f.store_id][f.dish_name])fMap[f.forecast_date][f.store_id][f.dish_name]={};
    fMap[f.forecast_date][f.store_id][f.dish_name][f.groesse||'gross']=f;
  });

  // prevFcMap[date][store][CATEGORY][groesse] = qty
  // Kategorie statt Gerichtsname — damit auch bei wechselndem Menü die Vorwoche gefunden wird
  const prevFcMap={};
  (prevForecasts||[]).forEach(f=>{
    const cat=mapDishNameToCategory(f.dish_name);
    if(!prevFcMap[f.forecast_date])prevFcMap[f.forecast_date]={};
    if(!prevFcMap[f.forecast_date][f.store_id])prevFcMap[f.forecast_date][f.store_id]={};
    if(!prevFcMap[f.forecast_date][f.store_id][cat])prevFcMap[f.forecast_date][f.store_id][cat]={};
    prevFcMap[f.forecast_date][f.store_id][cat][f.groesse||'gross']=f.qty;
  });

  // prevDispMap[store][category] = {leftover, soldOutEarly}
  const prevDispMap={};
  (prevDisposals||[]).forEach(d=>{
    if(!prevDispMap[d.store_id])prevDispMap[d.store_id]={};
    const cat=mapDishNameToCategory(d.dish_name, d.slot);
    const prev=prevDispMap[d.store_id][cat]||{leftover:0,soldOutEarly:false};
    prev.leftover+=(d.leftover_qty||0);
    if(d.sold_out_time) prev.soldOutEarly=true;
    prevDispMap[d.store_id][cat]=prev;
  });

  // prevDisposalByDate[date][category] = {leftoverPortionen, soldOutEarly}
  const prevDisposalByDate={};
  (prevDisposals||[]).forEach(d=>{
    if(!prevDisposalByDate[d.disposal_date])prevDisposalByDate[d.disposal_date]={};
    const cat=mapDishNameToCategory(d.dish_name, d.slot);
    const ex=prevDisposalByDate[d.disposal_date][cat]||{leftoverPortionen:0,soldOutEarly:false};
    ex.leftoverPortionen+=(d.leftover_qty||0);
    if(d.sold_out_time) ex.soldOutEarly=true;
    prevDisposalByDate[d.disposal_date][cat]=ex;
  });

  function computeOrgSuggestion(storeId, dish, dateStr, groesse){
    // Einfache, nachvollziehbare Logik — baut ab dieser Woche eigene Historie auf:
    // 1. Vorwoche bestätigte Menge als Basis (1:1 übernehmen)
    // 2. Falls Entsorgung eingetragen → anpassen
    // 3. Optional: Wetter
    // Falls keine Vorwoche-Daten → kein Vorschlag (noch keine History)

    const cat=mapDishNameToCategory(dish);
    const prevDateStr=new Date(new Date(dateStr+'T00:00:00').getTime()-7*86400000).toISOString().split('T')[0];

    // Vorwoche Forecast — lookup via Kategorie (nicht dish_name, da Gerichte wöchentlich wechseln)
    const prevQty=(prevFcMap[prevDateStr]?.[storeId]?.[cat]?.[groesse||'gross'])||null;
    if(prevQty==null) return null; // Noch keine History → kein Vorschlag, leer lassen

    let qty=prevQty;
    const reasons=[`Vorwoche: ${formatQty(prevQty)} Bhlt`];

    // Entsorgung Vorwoche
    const disp=prevDispMap[storeId]?.[cat];
    if(disp && (disp.soldOutEarly || disp.leftover>0)){
      if(disp.soldOutEarly){
        qty=Math.round((qty+0.25)*4)/4;
        reasons.push('🔥 +0.25 ausverkauft');
      } else if(disp.leftover>10){
        qty=Math.max(0.25,Math.round((qty-0.5)*4)/4);
        reasons.push(`📦 −0.5 (${disp.leftover} Port. übrig)`);
      } else if(disp.leftover>4){
        qty=Math.max(0.25,Math.round((qty-0.25)*4)/4);
        reasons.push(`📦 −0.25 (${disp.leftover} Port. übrig)`);
      } else {
        reasons.push(`✓ wenig übrig (${disp.leftover} Port.) → 1:1`);
      }
    } else {
      reasons.push('⚪ keine Entsorgung → 1:1');
    }

    // Wetter (optional, nur kleine Anpassung)
    const {pct:wPct, reason:wReason}=getDayModifiers(dateStr, storeId, refWeather, calendarEvents, settingsRec);
    if(wPct!==0 && qty>0){
      const wAdj=Math.round(qty*(wPct/100)*4)/4;
      qty=Math.max(0.25,Math.round((qty+wAdj)*4)/4);
      if(wReason) reasons.push(wReason);
    }

    return {qty, reason:reasons.join(' · ')};
  }
  const zeroSettings={weather_sunny_pct:0,weather_rain_pct:0,feiertag_pct:0,ferien_pct:0};

  // Überträgt Mengen aus der vorherigen (aktuell laufenden) Woche in die angezeigte nächste Woche —
  // nutzt dieselbe Zuordnung wie die blauen Vorschläge (computeOrgSuggestion, über Kategorie statt
  // Gerichtsname, da sich Gerichte wöchentlich ändern). Füllt nur leere Felder, überschreibt nichts.
  async function orgFcCopyFromCurrentWeek(){
    if(orgForecastWeekOffset!==1){ showToast('Nur bei "Nächste Woche" verfügbar'); return; }
    const inputs=document.querySelectorAll('#orgfc-content input[type=number]');
    let filled=0;
    inputs.forEach(inp=>{
      if(inp.value!=='') return; // nicht überschreiben
      const store=inp.dataset.store, dish=inp.dataset.dish, dateStr=inp.dataset.date, groesse=inp.dataset.groesse||'gross';
      if(!store||!dish||!dateStr) return;
      const sugg=computeOrgSuggestion(store, dish, dateStr, groesse);
      if(!sugg || sugg.qty==null) return;
      inp.value=sugg.qty;
      inp.dataset.copied='1';
      inp.style.borderColor='#0D9488';
      inp.style.background='#F0FDFA';
      const lbl=inp.nextElementSibling;
      if(lbl && lbl.textContent && lbl.textContent.includes('Vorschlag')) lbl.remove();
      filled++;
    });
    if(filled>0){
      showToast(`✓ ${filled} Felder von letzter Woche übertragen — bitte prüfen und speichern`);
    } else {
      showToast('Keine passenden Mengen aus letzter Woche gefunden.');
    }
  }
  window.orgFcCopyFromCurrentWeek=orgFcCopyFromCurrentWeek;

  let html=weekSwitcher;

  try {
  for(let wd=1; wd<=5; wd++){
    const wdStr=WEEKDAY_STR[wd];
    const dateStr=weekDates[wd];
    const dateLabel=new Date(dateStr+'T00:00:00').toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'2-digit'});
    const dishNames=getMenuDishNamesForDay(wdStr, dateStr);
    const salatName=getSalatNameForDate(dateStr);
    const allDishes=[salatName, ...dishNames, REIS_DISH_NAME].filter(Boolean);
    const {reason}=getDayModifiers(dateStr, 'lb', refWeather, calendarEvents, zeroSettings);
    const isToday=new Date().toISOString().split('T')[0]===dateStr;

    html+=`<div class="section-lbl" style="${isToday?'color:#2B3A67;font-weight:700;':''}">${dateLabel}${isToday?' — heute':''}</div>`;
    if(reason) html+=`<div style="font-size:10.5px;color:var(--muted);margin:-2px 0 4px 2px;">${reason}</div>`;
    html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table" style="width:100%;"><thead><tr>
      <th style="text-align:left;">Filiale</th>
      ${allDishes.map(d=>`<th data-no-translate style="font-size:10.5px;">${d}</th>`).join('')}
    </tr></thead><tbody>`;
    storeList.forEach(s=>{
      html+=`<tr><td style="text-align:left;font-size:11.5px;" data-no-translate>${s.name.split(' ')[0]}</td>`;
      allDishes.forEach(dish=>{
        const isLasagne=dish.toUpperCase().includes('LASAGNE');
        if(isLasagne){
          // Lasagne: Größen wie bei Store-Ansicht
          const sizes=LASAGNE_SIZES; // [{k:'gross',l:'G·18'},{k:'mittel',l:'M·12'},{k:'klein',l:'K·8'}]
          const cellKey=`${dateStr}|${dish}|${s.id}`;
          // Welche Größen haben bereits Werte?
          const dateRecs=Object.values(((fMap[dateStr]||{})[s.id]||{})[dish]||{});
          const LBLS_ORG={gross:'Groß (18)',mittel:'Mit. (12)',klein:'Kl. (8)'};
          const storeLocked=isLasagneLocked(dateStr);
          let lasHtml='<td style="min-width:110px;padding:4px 3px;">';
          lasHtml+='<div style="display:grid;grid-template-columns:52px 40px;gap:3px 4px;align-items:center;">';
          sizes.forEach(sz=>{
            const rec=dateRecs.find(f=>(f.groesse||'gross')===sz.k);
            // Immer alle 3 Größen anzeigen
              const manual=rec?.source==='manual'||rec?.source==='store'||rec?.source==='org'||rec?.source==='copied';
              const isOrgSet=rec?.source==='org';
              const isCopiedSet=rec?.source==='copied';
              const manualColorLas=isOrgSet?'#2B3A67':(isCopiedSet?'#0D9488':'#F97316');
              const manualBgLas=isOrgSet?'#EEF1F8':(isCopiedSet?'#F0FDFA':'#FFF7ED');
              const lasSugg=!rec ? computeOrgSuggestion(s.id, dish, dateStr, sz.k) : null;
              const lasVal=rec?.qty??lasSugg?.qty??'';
              const lasIsSugg=!rec && lasSugg!=null;
              const LBLS={gross:'Groß (18)',mittel:'Mit. (12)',klein:'Kl. (8)'};
              lasHtml+=`<span style="font-size:8px;color:var(--muted);white-space:nowrap;">${LBLS[sz.k]||sz.l}</span>
                <input type="number" step="0.25" value="${lasVal}" placeholder="–"
                  data-store="${s.id}" data-dish="${escAttr(dish)}" data-date="${dateStr}" data-groesse="${sz.k}"
                  onchange="updateForecastQtyOrgGroesse(this)"

// Auto-Fill: holt die zuletzt bekannten Mengen aus forecast_qty und befüllt alle leeren Inputs
async function orgFcAutoFill(){
  // Lade die letzten 4 Wochen Forecast-Daten für alle Stores
  const today=new Date();
  const pastDate=new Date(today.getTime()-28*86400000).toISOString().split('T')[0];
  const todayStr=today.toISOString().split('T')[0];
  const rows=await api(`forecast_qty?forecast_date=gte.${pastDate}&forecast_date=lte.${todayStr}&select=store_id,forecast_date,dish_name,qty,groesse&order=forecast_date.desc`).catch(()=>[]);

  if(!rows||!rows.length){
    showToast('Noch keine historischen Mengen vorhanden — bitte manuell eintragen.');
    return;
  }

  // Für jeden Input: finde die letzte bekannte Menge für Store+Gericht+Größe+Wochentag
  const inputs=document.querySelectorAll('#orgfc-content input[type=number]');
  let filled=0;
  inputs.forEach(inp=>{
    if(inp.value) return; // bereits ausgefüllt
    const store=inp.dataset.store;
    const dish=inp.dataset.dish;
    const groesse=inp.dataset.groesse||'gross';
    const dateStr=inp.dataset.date;
    if(!store||!dish||!dateStr) return;

    const targetWd=new Date(dateStr+'T00:00:00').getDay();
    // Suche letzten Eintrag für denselben Store + Gericht + Größe + Wochentag
    const match=rows.find(r=>{
      if(r.store_id!==store) return false;
      if(r.dish_name!==dish) return false;
      if((r.groesse||'gross')!==groesse) return false;
      const rWd=new Date(r.forecast_date+'T00:00:00').getDay();
      return rWd===targetWd;
    });

    if(match){
      inp.value=match.qty;
      inp.style.borderColor='#0EA5E9';
      inp.style.background='#F0F9FF';
      // Label "Vorschlag" darunter
      const lbl=inp.nextElementSibling;
      if(!lbl||!lbl.textContent.includes('Vorschlag')){
        const d=document.createElement('div');
        d.style.cssText='font-size:7.5px;color:#0EA5E9;text-align:center;margin-top:1px;';
        d.textContent='Vorschlag';
        inp.parentNode.insertBefore(d, inp.nextSibling);
      }
      filled++;
    }
  });

  if(filled>0){
    showToast(`✓ ${filled} Felder befüllt — bitte prüfen und speichern`);
  } else {
    showToast('Keine passenden historischen Mengen gefunden für die leeren Felder.');
  }
}
window.orgFcAutoFill=orgFcAutoFill;

// Alle sichtbaren Org-Forecast Inputs auf einmal speichern
async function orgFcSaveAll(){
  const inputs=document.querySelectorAll('#orgfc-content input[type=number]');
  let saved=0; let errors=0;
  const btn=document.getElementById('orgfc-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Speichert…'; }

  for(const inp of inputs){
    const store=inp.dataset.store;
    const dish=inp.dataset.dish;
    const dateStr=inp.dataset.date;
    const groesse=inp.dataset.groesse||'gross';
    const qty=inp.value===''?null:parseFloat(inp.value);
    if(!store||!dish||!dateStr||qty==null) continue;
    const src=inp.dataset.copied==='1'?'copied':'org';
    try{
      // Delete both with and without groesse to handle legacy NULL records
      await api(`forecast_qty?store_id=eq.${store}&dish_name=eq.${encodeURIComponent(dish)}&forecast_date=eq.${dateStr}&groesse=eq.${groesse}`,{method:'DELETE'}).catch(()=>{});
      await api(`forecast_qty?store_id=eq.${store}&dish_name=eq.${encodeURIComponent(dish)}&forecast_date=eq.${dateStr}&groesse=is.null`,{method:'DELETE'}).catch(()=>{});
      await api('forecast_qty?on_conflict=store_id,forecast_date,dish_name,groesse',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify([{store_id:store,dish_name:dish,forecast_date:dateStr,qty,groesse,source:src}])});
      inp.style.borderColor='#22C55E';
      inp.style.background='#F0FDF4';
      saved++;
    }catch(e){ errors++; }
  }

  if(btn){ btn.disabled=false; btn.textContent='💾 Alle speichern'; }
  if(errors){
    showToast(`${saved} gespeichert, ${errors} Fehler`);
  } else {
    showToast(`✓ ${saved} Mengen gespeichert!`);
    // Automatisch auf Nächste Woche switchen damit Vorschläge sofort sichtbar sind
    setTimeout(()=>{
      orgForecastWeekOffset=1;
      renderOrgForecast();
    }, 1200);
  }
}

// Render structured zutaten with categories and allergen highlighting
function renderZutatenForGericht(zutatenText, rezeptZutatenArr){
  // If we have structured rezept_zutaten data, use that
  if(rezeptZutatenArr && rezeptZutatenArr.length){
    // Group by category
    const byKat = {};
    rezeptZutatenArr.forEach(rz=>{
      const kat = rz.kategorie || 'Sonstiges';
      if(!byKat[kat]) byKat[kat]=[];
      byKat[kat].push(rz);
    });
    const katOrder = ZUTAT_KATEGORIEN;
    const sortedKats = katOrder.filter(k=>byKat[k]).concat(Object.keys(byKat).filter(k=>!katOrder.includes(k)));
    return sortedKats.map(kat=>{
      const items = byKat[kat].sort((a,b)=>a.name.localeCompare(b.name));
      const itemsHtml = items.map(rz=>{
        const isAllergen = rz.ist_allergen || ALLERGEN_BOLD_WORDS.some(w=>rz.name.toLowerCase().includes(w));
        const nameHtml = isAllergen ? `<strong style="color:#92400E;">${rz.name}</strong>` : rz.name;
        const menge = rz.menge ? `<span style="color:var(--muted);font-size:10px;"> (${rz.menge})</span>` : '';
        return `<div style="padding:1px 0;">${nameHtml}${menge}</div>`;
      }).join('');
      return `<div style="margin-bottom:8px;"><div style="font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;">${kat}</div>${itemsHtml}</div>`;
    }).join('');
  }
  // Fallback: render from plain text, cleaned up
  if(!zutatenText) return '<span style="color:var(--muted);font-size:11px;">Keine Zutaten hinterlegt</span>';
  // Remove old section headers like "Gemüse – anpassbar...", "Gewürze", "Grundzutaten"
  const cleaned = zutatenText.replace(/[\r\n]{3,}/g, '\n\n').trim();
  // Parse items (comma or newline separated)
  const items = cleaned.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean);
  // Group by known categories
  const byKat = {};
  items.forEach(item=>{
    const kat = guessZutatKategorie(item);
    if(!byKat[kat]) byKat[kat]=[];
    byKat[kat].push(item);
  });
  const sortedKats = ZUTAT_KATEGORIEN.filter(k=>byKat[k]);
  if(sortedKats.length <= 1){
    // All in one category or too few — just show flat list
    return items.map(item=>{
      const isAllergen = ALLERGEN_BOLD_WORDS.some(w=>item.toLowerCase().includes(w));
      return `<div style="padding:1px 0;">${isAllergen?`<strong style="color:#92400E;">${item}</strong>`:item}</div>`;
    }).join('');
  }
  return sortedKats.map(kat=>{
    const katItems = byKat[kat].sort((a,b)=>a.localeCompare(b));
    const itemsHtml = katItems.map(item=>{
      const isAllergen = ALLERGEN_BOLD_WORDS.some(w=>item.toLowerCase().includes(w));
      return `<div style="padding:1px 0;">${isAllergen?`<strong style="color:#92400E;">${item}</strong>`:item}</div>`;
    }).join('');
    return `<div style="margin-bottom:8px;"><div style="font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;">${kat}</div>${itemsHtml}</div>`;
  }).join('');
}
window.renderZutatenForGericht=renderZutatenForGericht;

// Guess category of an ingredient from its name
function guessZutatKategorie(name){
  const n = name.toLowerCase();
  if(/spinat|tomate|zwiebel|knoblauch|paprika|karott|zucchini|gurk|aubergine|brokkoli|kohl|fenchel|lauch|erbsen|mais|sellerie/.test(n)) return 'Gemüse';
  if(/limett|zitronen|orange|mango|kokos|ananas|apfel/.test(n)) return 'Obst';
  if(/linsen|kichererbsen|bohnen|erbsen|tofu|tempeh/.test(n)) return 'Hülsenfrüchte';
  if(/petersilie|koriander|minze|basilikum|thymian|rosmarin|dill/.test(n)) return 'Kräuter';
  if(/reis|couscous|ebly|weizen|mehl|teig|nudel|pasta|brot|grieß/.test(n)) return 'Getreide/Reis';
  if(/joghurt|milch|butter|käse|sahne|quark|laktose|rahm/.test(n)) return 'Milchprodukte';
  if(/öl|fett|ghee|schmalz/.test(n)) return 'Öle/Fette';
  if(/cashew|nuss|mandel|sesam|sonnenblumen|kürbiskern|leinsamen|pistazie/.test(n)) return 'Nüsse/Samen';
  if(/salz|pfeffer|kurkuma|kreuzkümmel|koriander|garam|paprikapulver|chili|ingwer|kardamom|zimt|nelken|muskat|curry|masala|fenugreek/.test(n)) return 'Gewürze';
  return 'Sonstiges';
}

function renderAllergeneCheatlist(list, todayMenu=[]){
  const wrap=document.getElementById('all-cheatlist');
  if(!wrap) return;
  let html='';

  function parseZutatenSections(zutaten){
    if(!zutaten) return [];
    // Split on double newline or "ÖL" appearing after first section
    const parts = zutaten.split(/\n\s*\n|(?=ÖL\s*[,\.])/g).filter(p=>p.trim());
    if(parts.length<=1) return [{label:null, text:zutaten.replace(/\n/g,' ').trim()}];
    return parts.map((p,i)=>({
      label: i===0?null:'Dressing',
      text: p.replace(/\n/g,' ').trim()
    }));
  }

  function isZutatAllergen(item){
    const up = item.toUpperCase().trim();
    return (
      // A — Glutenhaltiges Getreide
      /\b(WEIZEN|DINKEL|ROGGEN|GERSTE|HAFER|KAMUT|TEIGBLÄTTER|TEIGBLATT|LASAGNE\s*BLÄTTER|EBLY|MEHL)\b/.test(up) ||
      // C — Eier
      /\b(EIER|EIDOTTER)\b/.test(up) || up === 'EI' ||
      // E — Erdnüsse
      /\b(ERDNUSS|ERDNÜSSE)\b/.test(up) ||
      // F — Soja (nicht Kokosmilch!)
      /\b(SOJA|TOFU|SOJAHACK|SOJAJOGHURT|SOJAFASCHIERTES|SOJAMILCH)\b/.test(up) ||
      // G — Milch: aber NICHT KOKOSMILCH
      (/\b(KÄSE|JOGHURT|BUTTER|RAHM|SAHNE|PARMESAN|MOZZARELLA|KUHMILCH|HAFERMILCH)\b/.test(up) ||
       (/MILCH/.test(up) && !/KOKOS/.test(up))) ||
      // H — Schalenfrüchte/Nüsse (nicht Kokosnuss!)
      /\b(MANDELN?|HASELNUSS|HASELNÜSSE|WALNUSS|WALNÜSSE|CASHEW|PEKANNUSS|PISTAZIE|MACADAMIA)\b/.test(up) ||
      // L — Sellerie
      /\b(SELLERIE|SELLIERE)\b/.test(up) ||
      // M — Senf
      /\b(SENF)\b/.test(up) ||
      // N — Sesam
      /\b(SESAM)\b/.test(up) ||
      // P — Lupinen
      /\b(LUPINEN?)\b/.test(up)
    );
  }

  function renderZutatItems(text){
    return text.split(/[,]+/).map(s=>s.trim()).filter(Boolean).map(item=>{
      return isZutatAllergen(item)
        ? `<strong style="color:#92400E;">${item}</strong>`
        : item;
    }).join(' · ');
  }

  function renderDishCard(name, zutaten, allergene, isToday=false){
    // allergene can be {main:[], dressing:[]} or a plain string (from Supabase)
    let mainCodes=[], dressingCodes=[];
    if(typeof allergene==='object' && allergene!==null){
      mainCodes=allergene.main||[];
      dressingCodes=allergene.dressing||[];
    } else if(typeof allergene==='string'){
      // parse string: "A,G,L,C" or from Supabase array stored as string
      mainCodes=allergene.split(/[,\s\-]+/).map(c=>c.trim().toUpperCase()).filter(c=>c&&/^[A-R]$/.test(c));
    }
    const sections = parseZutatenSections(zutaten);
    const hasAllergene = mainCodes.length>0 || dressingCodes.length>0;
    return `<div class="card" style="padding:14px;margin-bottom:10px;${isToday?'border-left:3px solid var(--green);':''}" data-gericht="${name.toLowerCase()}">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px;">${name}</div>
      <div style="margin-bottom:10px;">
        <span style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;">⚠️ ALLERGENE&nbsp;&nbsp;</span>
        ${hasAllergene
          ? `<strong style="font-size:14px;color:#92400E;letter-spacing:.06em;">${mainCodes.join(', ')}${dressingCodes.length?`<span style="font-size:11px;font-weight:400;color:#78350F;margin-left:8px;">· Dressing: <strong>${dressingCodes.join(', ')}</strong></span>`:''}
</strong>`
          : `<span style="font-size:12px;color:var(--muted);">–</span>`}
      </div>
      ${sections.length?`<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:6px;">🧂 Zutaten</div>
      ${sections.map(sec=>`
        ${sec.label?`<div style="font-size:10px;font-weight:700;color:#185FA5;letter-spacing:.05em;margin:6px 0 3px;">🥗 DRESSING</div>`:''}
        <div style="font-size:12px;color:var(--sub);line-height:1.8;">${renderZutatItems(sec.text)}</div>
      `).join('')}`:''}
    </div>`;
  }

  if(todayMenu.length){
    const validDishes = todayMenu.filter(d=>d.name&&!d.name.startsWith('ÖL')&&!d.name.startsWith('ZUTATEN'));
    if(validDishes.length){
      html+=`<div style="font-size:11px;font-weight:700;color:var(--green);letter-spacing:.05em;margin-bottom:8px;">📋 HEUTE</div>`;
      validDishes.forEach(dish=>{
        const override=(allergeneCache||[]).find(e=>e.gericht===dish.name);
        // Zutaten: Supabase override takes priority if filled
        const zutaten = (override?.zutaten?.trim()) || dish.zutaten || '';
        // Allergene: MENU_DATA is the source of truth (has main+dressing)
        // Only use Supabase codes if they're actually set AND non-empty
        let allergene = dish.allergene || {main:[],dressing:[]};
        if(override?.allergene_codes?.length){
          allergene = {
            main: override.allergene_codes,
            dressing: dish.allergene?.dressing || []
          };
        }
        html += renderDishCard(dish.name, zutaten, allergene, true);
      });
    }
  }

  if((list||[]).length){
    if(todayMenu.length) html+=`<div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:14px 0 8px;">📂 ALLE GERICHTE</div>`;
    list.forEach(entry=>{
      // Supabase stores codes as array, wrap in {main, dressing} structure
      const codes = entry.allergene_codes||[];
      const dressing = entry.dressing_allergene_codes||[];
      html+=renderDishCard(entry.gericht, entry.zutaten||'', {main:codes, dressing});
    });
  } else if(!todayMenu.length){
    html='<div style="font-size:13px;color:var(--muted);padding:8px 2px;">Noch keine Gerichte angelegt.</div>';
  }
  wrap.innerHTML=html;
}

function filterAllergeneCheatsheet(){
  const q=document.getElementById('all-search').value.toLowerCase();
  // Filter both today's menu and Supabase list
  const filteredMenu=getTodayMenu()?.filter(d=>d.name?.toLowerCase().includes(q))||[];
  renderAllergeneCheatlist(allergeneCache.filter(e=>e.gericht.toLowerCase().includes(q)), filteredMenu);
}

async function buildSchulungMatrixHtml(){

  if(!themen?.length || !storeList.length) return '<div style="font-size:13px;color:var(--muted);padding:8px 2px;">Noch keine Themen oder Filialen vorhanden.</div>';
  const latest={};
  (entries||[]).forEach(e=>{
    const key=e.thema_id+'|'+e.store_id;
    if(!latest[key] || new Date(e.datum)>new Date(latest[key])) latest[key]=e.datum;
  });
  let html=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr><th style="text-align:left;">Thema</th>${storeList.map(s=>`<th data-no-translate>${s.name}</th>`).join('')}</tr></thead><tbody>`;
  themen.forEach(t=>{
    html+=`<tr><td>${t.titel}</td>`;
    storeList.forEach(s=>{
      const d=latest[t.id+'|'+s.id];
      let cell;
      if(!d){
        cell='<span class="badge badge-warn">nie</span>';
      }else{
        const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-t.intervall_monate);
        const dd=new Date(d).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});
        cell=(new Date(d)>=cutoff)?`<span class="badge badge-ok">${dd}</span>`:`<span class="badge badge-warn">${dd}</span>`;
      }
      html+=`<td>${cell}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

function renderHsFilteredTable(){
  const {byName, storeMap}=hsOrgData;
  const storeFilter=document.getElementById('hs-filter-store')?.value||'';
  const personFilter=document.getElementById('hs-filter-person')?.value||'';
  const statusFilter=document.getElementById('hs-filter-status')?.value||'';
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-12); // Schulung ist genau 1 Jahr gültig

  let names=Object.keys(byName).sort();
  if(personFilter) names=names.filter(n=>n===personFilter);
  if(storeFilter) names=names.filter(n=>(byName[n].stores||'').split(',').map(x=>x.trim()).includes(storeFilter));
  if(statusFilter==='ausstaendig') names=names.filter(n=>new Date(byName[n].datum)<cutoff);

  const wrap=document.getElementById('hs-table-body');
  if(!wrap) return;
  if(!names.length){
    wrap.innerHTML=`<div class="card" style="padding:14px;text-align:center;color:var(--muted);font-size:13px;">Keine Einträge für diese Auswahl</div>`;
    return;
  }
  let html=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table" style="width:100%;">
    <thead><tr><th style="text-align:left;">Person</th><th style="text-align:left;">Filiale(n)</th><th>Zuletzt</th><th>Von</th><th>Status</th></tr></thead><tbody>`;
  names.forEach(n=>{
    const e=byName[n];
    const overdue=new Date(e.datum)<cutoff;
    const storeNames=(e.stores||'').split(',').filter(Boolean).map(id=>storeMap[id.trim()]||id.trim()).join(', ');
    html+=`<tr><td style="text-align:left;font-weight:500;font-size:12px;" data-no-translate>${n}</td><td style="text-align:left;font-size:11px;" data-no-translate>${storeNames}</td><td style="font-size:12px;">${new Date(e.datum).toLocaleDateString('de-AT')}</td><td style="font-size:11px;" data-no-translate>${e.durchgefuehrt_von}</td><td>${overdue?'<span class="badge badge-warn">ausständig</span>':'<span class="badge badge-ok">aktuell</span>'}</td></tr>`;
  });
  html+='</tbody></table></div></div>';
  wrap.innerHTML=html;
}

async function checkAndNotifyOverdueHygiene(byName){
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-12);
  const overdueNames=Object.keys(byName).filter(n=>new Date(byName[n].datum)<cutoff);
  if(!overdueNames.length) return;
  // Nicht jedes Mal beim Öffnen der Seite erneut mailen — nur wenn seit der letzten Erinnerung
  // für diese Person mind. 30 Tage vergangen sind (oder noch nie erinnert wurde).
  const notified=await api('hygiene_notifications?select=name,notified_at').catch(()=>[]);
  const notifiedMap=Object.fromEntries((notified||[]).map(x=>[x.name,x.notified_at]));
  const toNotify=overdueNames.filter(n=>{
    const last=notifiedMap[n];
    if(!last) return true;
    const daysSince=(Date.now()-new Date(last).getTime())/86400000;
    return daysSince>30;
  });
  if(!toNotify.length) return;
  try{
    await emailjs.send('service_xla195w','template_9uiq1wf',{
      name: 'Hygiene-Schulung fällig',
      time: new Date().toLocaleString('de-AT'),
      message: `Folgende Personen sind mit ihrer Hygiene-Schulung überfällig (älter als 12 Monate):\n\n${toNotify.map(n=>`- ${n} (zuletzt: ${new Date(byName[n].datum).toLocaleDateString('de-AT')})`).join('\n')}\n\nBitte neue Schulung einplanen.`,
      title: 'Hygiene-Schulung fällig',
      to_email: 'tini@karmafood.at'
    });
    const today=new Date().toISOString().split('T')[0];
    for(const n of toNotify){
      await api(`hygiene_notifications?name=eq.${encodeURIComponent(n)}`,{method:'DELETE'});
      await api('hygiene_notifications',{method:'POST',body:JSON.stringify([{name:n, notified_at:today}])});
    }
  }catch(e){console.error('Hygiene-Erinnerungs-Mail fehlgeschlagen', e);}
}

  try{
    await api('schulungen',{method:'POST',body:JSON.stringify([{thema_id:parseInt(thema_id),store_id,datum,durchgefuehrt_von,teilnehmer,unterschrieben}])});
  }catch(e){ console.error(e); alert('Fehler beim Speichern.'); return; }
  document.getElementById('sch-durchgefuehrt').value='';
  document.getElementById('sch-teilnehmer').value='';
  const box=document.getElementById('sch-unterschrieben-box');
  if(box){ box.dataset.value='0'; box.classList.remove('done'); box.innerHTML=''; }
  refreshSchulungHistorie();
}

async function refreshSchulungHistorie(){
  const [entries, themen, stores] = await Promise.all([
    api('schulungen?select=*&order=datum.desc&limit=30').catch(()=>[]),
    api('schulungsthemen?select=id,titel').catch(()=>[]),
    api('stores?select=id,name').catch(()=>[])
  ]);
  const wrap=document.getElementById('schulungHistorieAdmin');
  if(!wrap) return;
  const themaMap=Object.fromEntries((themen||[]).map(t=>[t.id,t.titel]));
  const storeMap=Object.fromEntries((stores||[]).map(s=>[s.id,s.name]));
  wrap.innerHTML=(entries||[]).map(e=>`
    <div class="card" style="padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <strong>${themaMap[e.thema_id]||'—'}</strong>

      </div>
      <div style="font-size:12px;color:var(--sub);margin-top:4px;" data-no-translate>${storeMap[e.store_id]||e.store_id}${e.durchgefuehrt_von?' · von '+e.durchgefuehrt_von:''}</div>
      ${e.teilnehmer?`<div style="font-size:12px;color:var(--muted);margin-top:2px;">Teilnehmer: ${e.teilnehmer}</div>`:''}
      <div style="margin-top:4px;">${e.unterschrieben?'<span class="badge badge-ok" style="font-size:10px;">✍️ unterschrieben</span>':'<span class="badge badge-warn" style="font-size:10px;">keine Unterschrift hinterlegt</span>'}</div>
      <div style="margin-top:8px;"><button onclick="deleteSchulungEntry(${e.id})" style="background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:#DC2626;cursor:pointer;">Löschen</button></div>
    </div>
  `).join('') || '<div style="font-size:13px;color:var(--muted);padding:8px 2px;">Noch keine Schulungen eingetragen.</div>';

async function deleteSchulungEntry(id){
  if(!confirm('Eintrag wirklich löschen?')) return;
  try{ await api(`schulungen?id=eq.${id}`,{method:'DELETE'}); }catch(e){ console.error(e); return; }
  refreshSchulungHistorie();
}

async function loadSchulungStatusStore(){
