async function saveDailyCheckAll(){
  const today=new Date().toISOString().split('T')[0];
  const tempRows=[...document.querySelectorAll('[id^="wek-temp-row-"]')].filter(r=>r.style.display!=='none');
  if(!tempRows.length){ showToast('Bitte mindestens eine angelieferte Ware auswählen'); return; }
  const temperaturen={};
  let anyInvalid=false, minTemp=null;
  tempRows.forEach(row=>{
    const input=row.querySelector('input');
    const dish=input?.dataset.dish;
    const v=parseFloat(input?.value);
    if(isNaN(v)){ anyInvalid=true; return; }
    if(dish) temperaturen[dish]=v;
    if(minTemp===null||v<minTemp) minTemp=v;
  });
  if(anyInvalid || minTemp===null){ showToast('Bitte bei jedem Gericht eine Temperatur eintragen'); return; }
  const massnahmeEl=document.getElementById('wek-massnahme');
  const massnahme=massnahmeEl?massnahmeEl.value.trim():'';
  if(minTemp<65 && !massnahme){ showToast('Bitte Maßnahme bei Temperatur unter 65° eintragen'); return; }
  const klein=parseFloat(document.getElementById('kuehl-klein')?.value);
  const gross=parseFloat(document.getElementById('kuehl-gross')?.value);
  if(isNaN(klein)||isNaN(gross)){ showToast('Bitte beide Kühltemperaturen eintragen'); return; }
  const ware=getSelectedWaren()||'';
  const wareOk=document.getElementById('wek-ware-ok-box')?.dataset.value==='1';
  try{
    await Promise.all([
      (async()=>{
        await api(`wareneingang?store_id=eq.${currentStore.id}&datum=eq.${today}`,{method:'DELETE'});
        await api('wareneingang',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,datum:today,lieferant:FIXER_LIEFERANT||null,ware:ware||null,ware_ok:wareOk,temperatur:minTemp,temperaturen,massnahme:massnahme||null,mitarbeiter:currentStore.name}])});
      })(),
      (async()=>{
        await api(`kuehleinrichtungen?store_id=eq.${currentStore.id}&datum=eq.${today}`,{method:'DELETE'});
        await api('kuehleinrichtungen',{method:'POST',body:JSON.stringify([{store_id:currentStore.id,datum:today,temp_klein:klein,temp_gross:gross,mitarbeiter:currentStore.name}])});
      })()
    ]);
    showToast('✔ Daily Check-up gespeichert!');
    goTo('waehrend');
  }catch(e){console.error(e);showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);}

// TEMPORÄRE AUSNAHME (bis Herbstmenü) — siehe Kommentar bei der Temperatur-Zeilen-Anzeige oben.
// Danach diesen Eintrag entfernen, dann gilt für alle Gerichte wieder dieselbe ≥65°C-Regel.
const DISH_TEMP_EXCEPTIONS = {
  'Wochensalat': {max:6}
};
function getDishTempException(dishName){
  const key=Object.keys(DISH_TEMP_EXCEPTIONS).find(k=>dishName.includes(k));
  return key?DISH_TEMP_EXCEPTIONS[key]:null;
}

function checkWareneingangTemp(){
  const rows=document.querySelectorAll('[id^="wek-temp-row-"]');
  let anyLow=false;
  rows.forEach(row=>{
    if(row.style.display==='none') return;
    const v=parseFloat(row.querySelector('input')?.value);
    if(isNaN(v)) return;
    const maxException=row.dataset.max;
    if(maxException){
      // Ausnahme-Gericht (z.B. Wochensalat): MAX-Regel statt MIN-Regel
      if(v>parseFloat(maxException)) anyLow=true;
    } else {
      if(v<65) anyLow=true;
    }
  });
  const wrap=document.getElementById('wek-massnahme-wrap');
  if(wrap) wrap.style.display=anyLow?'block':'none';
}

let mangelFotoBlob=null;

function previewMangelFoto(input){
  const file=input.files?.[0];

    mangelFotoBlob=blob;
    const url=URL.createObjectURL(blob);
    document.getElementById('mangel-foto-img').src=url;
    document.getElementById('mangel-foto-preview').style.display='block';
  }).catch(()=>showToast('Foto konnte nicht verarbeitet werden'));

// Bild im Browser verkleinern/komprimieren, bevor es hochgeladen wird — hält Upload schnell
// und Speicherplatz klein, egal wie groß das Original-Kamerafoto ist.
function compressImageFile(file, maxDim=1280, quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>maxDim||h>maxDim){
          if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('toBlob failed')), 'image/jpeg', quality);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// Direkter Upload in den Supabase-Storage-Bucket "mangel-fotos" (öffentlich lesbar) via REST-API,
// ohne zusätzliche Library.
async function uploadMangelFoto(blob){
  const path=`m_${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const res=await fetch(`${SUPABASE_URL}/storage/v1/object/mangel-fotos/${path}`,{
    method:'POST',
    headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'image/jpeg'},
    body:blob
  });
  if(!res.ok) throw new Error('Foto-Upload fehlgeschlagen');
  return `${SUPABASE_URL}/storage/v1/object/public/mangel-fotos/${path}`;
}

    document.getElementById('mangel-betreff').value='';
    document.getElementById('mangel-text').value='';
    if(storeSelect) storeSelect.value='';
    clearMangelFoto();
    renderMaengel();
  }catch(e){console.error(e);showToast('Fehler — bitte nochmal versuchen');}
  finally{ if(btn){ btn.disabled=false; btn.textContent='Schaden melden ✓'; } }
}

// ---- Detailansicht mit chronologischem Verlauf (Status-Änderungen + Rückmeldungen) ----
async function openMangelDetail(id){
  const rows=await api(`maengel?id=eq.${id}&select=*`).catch(()=>[]);
  const m=(rows||[])[0];
  if(!m) return;
  let storeName=currentStore?.name;
  if(currentStore?.id==='zentrale'){
    const s=await api(`stores?id=eq.${m.store_id}&select=name`).catch(()=>[]);
    storeName=(s||[])[0]?.name||m.store_id;
  }
  const statusLabel={offen:'offen',in_bearbeitung:'in Bearbeitung',behoben:'abgeschlossen'};
  const statusClass={offen:'badge-warn',in_bearbeitung:'badge-info',behoben:'badge-ok'};
  const status=m.status||'offen';
  const isOrg=currentStore?.id==='zentrale';
  const verlauf=(m.verlauf||[]).slice().sort((a,b)=>new Date(a.zeit)-new Date(b.zeit));

  const existing=document.getElementById('mangel-detail-overlay');
  if(existing) existing.remove();
  const overlay=document.createElement('div');
  overlay.id='mangel-detail-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  overlay.innerHTML=`
    <div style="background:var(--card,#fff);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;">
      <div id="mangel-view-mode">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;">
          <div style="flex:1;">
            <div style="font-size:16px;font-weight:700;">${m.betreff||'(kein Betreff)'}</div>
            <div data-no-translate style="font-size:12px;color:var(--muted);margin-top:2px;">📍 ${storeName}</div>
          </div>
          <span class="badge ${statusClass[status]||'badge-warn'}">${statusLabel[status]||status}</span>
        </div>
        <div style="font-size:13.5px;color:var(--sub);margin-top:10px;line-height:1.4;">${m.beschreibung}</div>
        ${m.foto_url?`<a href="${m.foto_url}" target="_blank" rel="noopener"><img src="${m.foto_url}" style="max-width:100%;max-height:220px;border-radius:10px;margin-top:10px;display:block;object-fit:cover;"></a>`:''}
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
          ${isOrg && status!=='behoben'?`
            ${status==='offen'?`<button onclick="setMangelStatus(${m.id},'in_bearbeitung')" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:#0369A1;cursor:pointer;">▶ In Bearbeitung</button>`:''}
            <button onclick="setMangelStatus(${m.id},'behoben')" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--green);cursor:pointer;">✓ Abschließen</button>
          `:''}
          <button onclick="toggleMangelEdit(true)" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--sub);cursor:pointer;">✏️ Bearbeiten</button>
        </div>
      </div>

      <div id="mangel-edit-mode" style="display:none;">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;">Meldung bearbeiten</div>
        <input type="text" id="mangel-edit-betreff" value="${(m.betreff||'').replace(/"/g,'&quot;')}" placeholder="Betreff" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:8px;box-sizing:border-box;">
        <textarea id="mangel-edit-text" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:14px;min-height:90px;resize:vertical;font-family:inherit;box-sizing:border-box;">${m.beschreibung||''}</textarea>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button onclick="toggleMangelEdit(false)" style="flex:1;padding:9px;border:1px solid var(--border);border-radius:10px;background:none;font-size:13px;color:var(--sub);cursor:pointer;">Abbrechen</button>
          <button onclick="saveMangelEdit(${m.id})" style="flex:1;padding:9px;border:none;border-radius:10px;background:var(--green);color:#fff;font-size:13px;font-weight:500;cursor:pointer;">Speichern</button>
        </div>
      </div>

      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:18px;margin-bottom:8px;">Verlauf</div>
      <div style="display:flex;flex-direction:column;gap:10px;max-height:220px;overflow-y:auto;padding-right:2px;">
        ${verlauf.map(v=>`<div style="border-left:2px solid ${v.t==='status'?'#0369A1':(v.t==='erstellt'?'var(--green)':'var(--border)')};padding-left:10px;">
          <div style="font-size:12.5px;">${v.text}</div>
          <div style="font-size:10.5px;color:var(--muted);margin-top:1px;">${v.autor||''} · ${new Date(v.zeit).toLocaleString('de-AT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        </div>`).join('') || '<div style="font-size:12px;color:var(--muted);">Noch kein Verlauf.</div>'}
      </div>

      <div style="margin-top:14px;display:flex;gap:8px;">
        <input type="text" id="mangel-update-text" placeholder="Rückmeldung schreiben (z.B. wie schaut's aus)…" style="flex:1;padding:9px;border:1px solid var(--border);border-radius:10px;font-size:13px;">
        <button onclick="sendMangelUpdate(${m.id})" style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;white-space:nowrap;">Senden</button>
      </div>
      <button onclick="closeMangelDetail()" style="width:100%;margin-top:14px;padding:10px;border:1px solid var(--border);border-radius:10px;background:none;font-size:13px;color:var(--sub);cursor:pointer;">Schließen</button>
    </div>`;
  document.body.appendChild(overlay);
  translateEl(overlay);
}
window.openMangelDetail=openMangelDetail;

function toggleMangelEdit(showEdit){
  const v=document.getElementById('mangel-view-mode');
  const e=document.getElementById('mangel-edit-mode');
  if(v) v.style.display=showEdit?'none':'block';
  if(e) e.style.display=showEdit?'block':'none';
}
window.toggleMangelEdit=toggleMangelEdit;

async function saveMangelEdit(id){
  const betreff=document.getElementById('mangel-edit-betreff')?.value?.trim();
  const text=document.getElementById('mangel-edit-text')?.value?.trim();
  if(!text){ showToast('Bitte Beschreibung eingeben'); return; }
  try{
    await api(`maengel?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({betreff:betreff||null,beschreibung:text})});
    await appendMangelVerlauf(id, {t:'bearbeitet', text:'Meldung bearbeitet', autor:currentStore?.name||'—', zeit:new Date().toISOString()});
    openMangelDetail(id);
    renderMaengel();
  }catch(e){console.error(e);showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);}
}
window.saveMangelEdit=saveMangelEdit;

function closeMangelDetail(){
  const el=document.getElementById('mangel-detail-overlay');
  if(el) el.remove();
}
window.closeMangelDetail=closeMangelDetail;

async function sendMangelUpdate(id){
  const input=document.getElementById('mangel-update-text');
  const text=input?.value?.trim();
  if(!text) return;
  try{
    await appendMangelVerlauf(id, {t:'kommentar', text, autor:currentStore?.name||'—', zeit:new Date().toISOString()});
    openMangelDetail(id); // Modal mit aktuellem Verlauf neu aufbauen
    renderMaengel();
  }catch(e){console.error(e);showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);}
}
window.sendMangelUpdate=sendMangelUpdate;

// Hängt einen Eintrag an den JSONB-Verlauf einer Meldung an (Status-Änderung oder Kommentar) —
// so bleibt lückenlos nachvollziehbar, wer wann was gemacht/geschrieben hat.
async function appendMangelVerlauf(id, entry){
  const rows=await api(`maengel?id=eq.${id}&select=verlauf`).catch(()=>[]);
  const current=(rows||[])[0]?.verlauf||[];
  const updated=[...current, entry];
  await api(`maengel?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({verlauf:updated})});
}

async function setMangelStatus(id, newStatus){
  const statusLabel={offen:'offen',in_bearbeitung:'in Bearbeitung',behoben:'abgeschlossen'};
  try{
    const patch={status:newStatus};
    if(newStatus==='behoben'){ patch.behoben_am=new Date().toISOString(); patch.behoben_von=currentStore?.name||'Organisation'; }
    await api(`maengel?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(patch)});
    await appendMangelVerlauf(id, {t:'status', text:`Status geändert auf „${statusLabel[newStatus]}"`, autor:currentStore?.name||'—', zeit:new Date().toISOString()});
    closeMangelDetail();
    renderMaengel();
    loadNotifBadge();
  }catch(e){console.error(e);showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);}
}
window.setMangelStatus=setMangelStatus;

// ---- SCHICHTENDE ----
async function renderSchichtende(){
  const el=document.getElementById('v-schichtende');
  const today=new Date().toISOString().split('T')[0];
  const tomorrow=new Date(Date.now()+86400000).toISOString().split('T')[0];

  // Alle Daten parallel laden
  const [clTemplates, clDoneToday, disposalToday, wochensalatToday, wekToday, reinToday, kuehlToday, uebergabeToday, submissionsToday, kcSubToday, forecastTomorrow, beilagenAdjustedTomorrow] = await Promise.all([
    api('checklist_templates?list_type=eq.abschluss&select=id').catch(()=>[]),
    api(`checklist_done?store_id=eq.${currentStore.id}&done_date=eq.${today}&select=template_id`).catch(()=>[]),
    api(`disposal?store_id=eq.${currentStore.id}&disposal_date=eq.${today}&select=id`).catch(()=>[]),
    api(`wochensalat_restbestand?store_id=eq.${currentStore.id}&report_date=eq.${today}&select=id`).catch(()=>[]),
    api(`wareneingang?store_id=eq.${currentStore.id}&datum=eq.${today}&select=id`).catch(()=>[]),
    api(`reinigungsprotokoll?store_id=eq.${currentStore.id}&datum=eq.${today}&select=reinigung_erledigt,desinfektion_erledigt`).catch(()=>[]),
    api(`kuehleinrichtungen?store_id=eq.${currentStore.id}&datum=eq.${today}&select=id`).catch(()=>[]),
    api(`schicht_uebergabe?store_id=eq.${currentStore.id}&datum=eq.${today}&select=*`).catch(()=>[]),
    api(`order_submissions?store_id=eq.${currentStore.id}&order_date=eq.${today}&select=tab`).catch(()=>[]),
    api(`kc_submissions?store_id=eq.${currentStore.id}&order_date=eq.${today}&select=id`).catch(()=>[]),
    api(`forecast_qty?store_id=eq.${currentStore.id}&forecast_date=eq.${tomorrow}&select=id`).catch(()=>[]),
    api(`kitchen_supply_today?store_id=eq.${currentStore.id}&supply_date=eq.${tomorrow}&is_adjusted=eq.true&select=id&limit=1`).catch(()=>[])
  ]);

  const clDoneIds=new Set((clDoneToday||[]).map(x=>x.template_id));
  const clTotal=(clTemplates||[]).length;
  const clDoneCount=(clTemplates||[]).filter(t=>clDoneIds.has(t.id)).length;
  const submittedTabsSchichtende=new Set((submissionsToday||[]).map(s=>s.tab));
  const sweetsDone=submittedTabsSchichtende.has('sweets');
  const transporterDone=submittedTabsSchichtende.has('transporter');
  const kcDone=(kcSubToday||[]).length>0;
  const forecastDone=(forecastTomorrow||[]).length>0;
  const realWeekdaySchichtende=new Date().getDay(); // 0=So,1=Mo,2=Di,3=Mi,4=Do,5=Fr,6=Sa
  const isKCDaySchichtende=realWeekdaySchichtende===2||realWeekdaySchichtende===4; // Shop-Produkte nur Di & Do

  const schritte=[
    {id:'dailycheck', label:'Daily Check-up vollständig', sub:'Wareneingang & Kühlung', done:(wekToday||[]).length>0 && (kuehlToday||[]).length>0, link:'dailycheck', group:'kueche'},
    {id:'entsorgung', label:'Entsorgung eingetragen', sub:'Restmengen aller Gerichte', done:(disposalToday||[]).length>0, link:'disposal', group:'kueche'},
    {id:'forecast_menge', label:'Portionsmengen für morgen', sub:'Forecast anpassen/bestätigen', done:forecastDone, link:'order', orderTab:'forecast', group:'kueche'},
    {id:'reinigung_protokoll', label:'Reinigung & Desinfektion', sub:'Endreinigung bestätigen', done:!!(reinToday||[])[0]?.reinigung_erledigt && !!(reinToday||[])[0]?.desinfektion_erledigt, link:null, group:'kueche'},
    {id:'sweets', label:'Sweets bestellt', sub:'Bestellung für morgen', done:sweetsDone, link:'order', orderTab:'sweets', group:'bestellungen'},
    {id:'transporter', label:'Transporter bestellt', sub:'Verpackungen, Reinigung, Food & Drinks', done:transporterDone, link:'order', orderTab:'transporter', group:'bestellungen'},
    ...(isKCDaySchichtende?[{id:'kc', label:'Shop Produkte ausgefüllt', sub:'IST-Bestände der Shop-Produkte', done:kcDone, link:'order', orderTab:'kc', group:'bestellungen'}]:[]),
    {id:'uebergabe', label:'Übergabe-Notiz', sub:'Hinweise für die nächste Schicht', done:(uebergabeToday||[]).length>0 && (uebergabeToday[0]?.notiz?.trim()?.length>0), link:null, group:'sonstiges', optional:true},
    {id:'abschluss', label:'Abschluss-Checkliste', sub:`${clDoneCount} von ${clTotal} Punkten — optionale Hilfe`, done:clDoneCount===clTotal && clTotal>0, link:'check', group:'sonstiges', optional:true}
  ];
  const GROUP_LABELS={kueche:'🍽️ Küche & Tagesablauf', bestellungen:'📦 Bestellungen', sonstiges:'📋 Sonstiges'};

  const SCHRITT_META={
    abschluss: {emoji:'💡', label:'Abschluss-Checkliste (optionale Hilfe)', sub:`${clDoneCount} von ${clTotal} Punkten — kein Pflichtschritt`, link:'check'},
    entsorgung: {emoji:'🗑️', label:'Entsorgung eingetragen', sub:'Restmengen aller Gerichte', link:'disposal'},
    forecast_menge: {emoji:'📅', label:'Portionsmengen für morgen', sub:'Forecast anpassen/bestätigen', link:'order', orderTab:'forecast'},
    dailycheck: {emoji:'🌡️', label:'Daily Check-up', sub:'Wareneingang · Kühlung', link:'dailycheck'},
    reinigung_protokoll: {emoji:'🧽', label:'Reinigung & Desinfektion', sub:'Endreinigung bestätigen', link:null},
    uebergabe: {emoji:'✍️', label:'Übergabe-Notiz', sub:'Optional — nur falls es was für die nächste Schicht zu wissen gibt', link:null},
    sweets:     {emoji:'🍰', label:'Sweets bestellt', sub:'Bestellung für morgen', link:'order', orderTab:'sweets'},
    transporter:{emoji:'🚚', label:'Transporter bestellt', sub:'Verpackungen & Reinigung', link:'order', orderTab:'transporter'},
    kc:         {emoji:'📦', label:'Shop Produkte ausgefüllt', sub:'IST-Bestände Shop-Produkte', link:'order', orderTab:'kc'},
    uebergabe:  {emoji:'✍️', label:'Übergabe-Notiz', sub:'Hinweis für nächste Schicht', link:null}
  };

  const requiredSteps=schritte.filter(s=>!s.optional);
  const open=schritte.filter(s=>!s.done);
  const done=schritte.filter(s=>s.done && !s.optional);
  const requiredOpen=requiredSteps.filter(s=>!s.done);
  const allDone=requiredOpen.length===0; // optionale Schritte (Abschluss-Checkliste) blockieren den Abschluss nicht
  const alreadySubmitted=(uebergabeToday||[]).length>0 && allDone;

  let html=backToHomeHtml();

  if(alreadySubmitted){
    html+=`<div style="background:var(--green-light);border:1.5px solid var(--green);border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;">
      <div style="font-size:30px;margin-bottom:8px;">🌙</div>
      <div style="font-weight:600;color:var(--green);font-size:16px;">Schicht abgeschlossen!</div>
      <div style="font-size:12px;color:var(--sub);margin-top:4px;">Zusammenfassung wurde an Tini geschickt.</div>
    </div>`;
  } else {
    // Fortschrittsanzeige + spielerische, motivierende Ansage statt nackter Liste
    const pct=requiredSteps.length?Math.round((requiredSteps.length-requiredOpen.length)/requiredSteps.length*100):100;
    const encouragement = pct===0?'Los geht\'s! 💪' : pct<50?'Weiter so! 🔥' : pct<100?'Fast geschafft! 🎉' : 'Alles bereit! ✨';
    html+=`<div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <span style="font-size:14px;font-weight:600;">${encouragement}</span>
        <span style="font-size:12px;color:var(--muted);">${requiredSteps.length-requiredOpen.length} von ${requiredSteps.length}</span>
      </div>
      <div class="progress-bar" style="margin-bottom:0;"><div class="progress-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }

  // OFFENE SCHRITTE — nach Themen gruppiert, damit es nicht wie eine riesige Liste wirkt
  if(open.length>0){
    if(requiredOpen.length>0){
      html+=`<div style="font-size:12px;font-weight:600;color:var(--sub);margin:2px 0 2px;">🔓 Das fehlt noch (${requiredOpen.length}):</div>`;
    }
    const GROUP_ORDER=['kueche','bestellungen','sonstiges'];
    GROUP_ORDER.forEach(g=>{
      const groupSteps=open.filter(s=>s.group===g && !s.optional);
      if(!groupSteps.length) return;
      html+=`<div class="section-lbl" style="margin-top:10px;">${GROUP_LABELS[g]}</div>`;
      groupSteps.forEach(s=>{
        const m=SCHRITT_META[s.id];
        const returnableTabs=['sweets','transporter','kc'];
        const setFlag=(m.orderTab && returnableTabs.includes(m.orderTab))?'schichtendeReturnFlag=true;':'';
        const linkFn=m.orderTab?`${setFlag}goToReminder('order','${m.orderTab}')`:m.link?`goTo('${m.link}')`:null;
        const isReinigung=s.id==='reinigung_protokoll';
        html+=`<div class="card" style="padding:14px;margin-bottom:8px;border:1.5px solid var(--border);${s.id==='uebergabe'?'border-color:#BA7517;':''}">
          <div style="display:flex;align-items:center;gap:12px;">
            <span style="font-size:24px;flex-shrink:0;">${m.emoji}</span>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:14px;">${m.label}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:1px;">${m.sub}</div>
            </div>
            ${linkFn?`<button onclick="${linkFn}" style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;">→</button>`:''}
          </div>
          ${s.id==='uebergabe'?`<textarea id="uebergabe-text" placeholder="Was soll die nächste Schicht wissen?" style="width:100%;margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;min-height:80px;resize:vertical;font-family:inherit;box-sizing:border-box;"></textarea><button class="submit-btn" style="margin-top:8px;" onclick="saveUebergabeNotiz()">Notiz speichern ✔</button>`:''}
          ${isReinigung?(()=>{
            const r=(reinToday||[])[0];
            return `<div style="margin-top:10px;border-top:0.5px solid var(--border);padding-top:8px;">
              <div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;">Vorreinigen → Hauptreinigen → Desinfizieren → Nachspülen → Trocknen</div>
              <div class="cl-item" onclick="toggleReinigungField('reinigung_erledigt', this)">
                <div class="check-box${r?.reinigung_erledigt?' done':''}">${r?.reinigung_erledigt?'<svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
                <span class="cl-text">Reinigung erledigt</span>
              </div>
              <div class="cl-item" onclick="toggleReinigungField('desinfektion_erledigt', this)">
                <div class="check-box${r?.desinfektion_erledigt?' done':''}">${r?.desinfektion_erledigt?'<svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
                <span class="cl-text">Desinfektion erledigt</span>
              </div>
            </div>`;
          })():''}
        </div>`;
      });
    });

    if(!alreadySubmitted && allDone){
      html+=`<button class="submit-btn" style="margin-top:8px;font-size:15px;padding:14px;" onclick="submitSchichtende()">🌙 Schicht abschließen & E-Mail senden</button>`;
    }
  } else if(!alreadySubmitted){
    html+=`<button class="submit-btn" style="font-size:15px;padding:14px;margin-bottom:16px;" onclick="submitSchichtende()">🌙 Schicht abschließen & E-Mail senden</button>`;
  }

  // ERLEDIGTE SCHRITTE
  if(done.length>0){
    html+=`<div style="display:flex;align-items:center;gap:8px;margin:${open.length?'20px':'8px'} 0 10px;">
      <div style="flex:1;height:1px;background:var(--border);"></div>
      <span style="font-size:11px;color:var(--muted);font-weight:500;">✓ erledigt (${done.length})</span>
      <div style="flex:1;height:1px;background:var(--border);"></div>
    </div>`;
    html+=`<div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    done.forEach(s=>{
      const m=SCHRITT_META[s.id];
      html+=`<div style="background:#F8FDF9;border:0.5px solid #9FE1CB;border-radius:20px;padding:5px 10px;font-size:12px;color:var(--green);display:flex;align-items:center;gap:4px;">
        <span>${m.emoji}</span>
        <span>${m.label}</span>
        <svg width="10" height="10" viewBox="0 0 24 24" stroke="var(--green)" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
      </div>`;
    });
    html+=`</div>`;

    // Übergabe-Notiz von heute anzeigen wenn erledigt
    const uebergabeDone=done.find(s=>s.id==='uebergabe');
    if(uebergabeDone && uebergabeToday[0]?.notiz){
      html+=`<div style="margin-top:10px;background:#FFF7ED;border:0.5px solid #F97316;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub);">
        <div style="font-weight:500;color:#E0521F;margin-bottom:3px;">✍️ Deine Übergabe-Notiz</div>
        ${uebergabeToday[0].notiz}
      </div>`;
    }
  }

  // OPTIONALE SCHRITTE — separat & dezent, ganz unten, blockiert nichts
  const optionalOpen=open.filter(s=>s.optional);
  if(optionalOpen.length>0){
    html+=`<div style="margin-top:20px;">`;
    optionalOpen.forEach(s=>{
      const m=SCHRITT_META[s.id];
      const linkFn=m.link?`goTo('${m.link}')`:null;
      html+=`<div onclick="${linkFn}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:0.5px dashed var(--border);border-radius:10px;cursor:pointer;opacity:0.75;">
        <span style="font-size:16px;">${m.emoji}</span>
        <div style="flex:1;">
          <div style="font-size:12.5px;font-weight:500;color:var(--sub);">${m.label}</div>
          <div style="font-size:10.5px;color:var(--muted);">${m.sub}</div>
        </div>
        <span style="color:var(--muted);">→</span>
      </div>`;
    });
    html+=`</div>`;
  }

  el.innerHTML=html;
  translateEl(el);
}

// ---- PACK ----
async function toggleOrderEingepackt(articleId, storeId, currentPacked, el, qty, orderDateStr){
  const newPacked=!currentPacked;
  // Optimistisches UI-Update — sofort sichtbar, kein Warten auf vollen Reload
  if(el){
    el.style.fontWeight=newPacked?'400':'600';
    el.style.color=newPacked?'#3B6D11':'#1a1a18';
    el.style.background=newPacked?'#EAF3DE':'transparent';
    el.style.textDecoration=newPacked?'line-through':'none';
    el.textContent=qty+(newPacked?' ✓':'');
    el.setAttribute('onclick',`toggleOrderEingepackt(${articleId},'${storeId}',${newPacked},this,${qty},'${orderDateStr}')`);
  }
  // WICHTIG: order_date ist der Eintragstag der Filiale (gestern aus Michis Sicht), nicht der
  // heutige Kalendertag — deshalb hier NICHT selbst neu berechnen, sondern den vom Aufrufer
  // übergebenen, bereits korrekten Wert verwenden.
  try{
    await api(`orders?article_id=eq.${articleId}&store_id=eq.${storeId}&order_date=eq.${orderDateStr}`,{method:'PATCH',body:JSON.stringify({eingepackt:newPacked})});
  }catch(e){
    console.error(e);
    showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);
    renderPack(); // bei Fehler echten Stand nachladen
  }
}
window.toggleOrderEingepackt=toggleOrderEingepackt;

async function renderPack(){
  const stores=await api('stores?select=id,name&order=id');
  const storeList=stores.filter(s=>s.id!=='zentrale' && s.id!=='1070');
  const el=document.getElementById('v-pack');

  // Kein Tab-Umschalter mehr nötig — Transporter und KC haben jetzt eigene Reiter unten in der Navigation
  // (Michi/Ines), daher jede Ansicht komplett isoliert, ohne Vermischung.
  if(activePackTab==='kc'){
    let html=pageHeaderHtml('📦','Shop Produkte','Bestellung je Filiale (SOLL − IST)','#A855F7');
    await renderKCOverview(el, html, storeList);
    return;
  }

  const today=new Date().toISOString().split('T')[0];
  const [openTasksRaw, transporterBcRaw]=await Promise.all([
    api(`transporter_tasks?done=eq.false&select=id`).catch(()=>[]),
    api(`org_broadcasts?target_store_id=eq.transporter&order=created_at.desc&limit=20`).catch(()=>[])
  ]);
  const _tbDismissed=JSON.parse(localStorage.getItem('kf_transporter_bc_dismissed')||'[]');
  const unreadBcCount=(transporterBcRaw||[]).filter(b=>!_tbDismissed.includes(b.id) && (!b.show_until || b.show_until>=today)).length;
  const openTasksCount=(openTasksRaw?.length||0)+unreadBcCount;
  let html=pageHeaderHtml('🚚','Transporter',`${new Date().toLocaleDateString('de-AT')}`,'#F97316');

  // Vier Tabs — Boldonse via tabBarHtml helper
  html+=tabBarHtml([
    {key:'bestellliste', label:'📦 Bestellliste'},
    {key:'endkontrolle', label:'✅ Endkontrolle'},
    {key:'samosas',      label:'🥟 Samosas'},
    {key:'beilagen',     label:'🥗 Beilagen'},
    {key:'info',         label:`📋 Info${openTasksCount?` (${openTasksCount})`:''}`}
  ], transporterSubTab, 'switchTransporterSubTab', '#F97316');

  if(transporterSubTab==='endkontrolle'){
    html+=await renderEndkontrolleHtml();
    el.innerHTML=html;
    translateEl(el);
    return;
  }

  if(transporterSubTab==='info'){
    html+=await renderTransporterInfoTabHtml();
    el.innerHTML=html;
    translateEl(el);
    return;
  }

  if(transporterSubTab==='samosas'){
    html+=await renderSamosaTableHtml();
    el.innerHTML=html;
    translateEl(el);
    return;
  }
  if(transporterSubTab==='beilagen'){
    html+=await renderTransporterBeilagenHtml();
    el.innerHTML=html;
    translateEl(el);
    return;
  }

  // --- Bestellliste (Standard-Tab) — Datum wählbar, damit vergangene Tage nicht verloren gehen ---

  // ist also der EINTRAGSTAG (z.B. Dienstag), nicht der Tag, an dem Michi tatsächlich packt/liefert
  // (Mittwoch). "Heute" für Michi bedeutet daher: er packt HEUTE, aber die Datenbank-Zeilen, die er
  // dafür braucht, stehen unter GESTERN. bestellViewDate/Label zeigen weiterhin Michis heutigen
  // Packtag; bestellDateStr (die tatsächliche DB-Abfrage) ist bewusst einen Tag früher.
  const bestellViewDate=new Date(); bestellViewDate.setDate(bestellViewDate.getDate()+transporterBestellDateOffset);
  const orderEntryDate=new Date(bestellViewDate); orderEntryDate.setDate(orderEntryDate.getDate()-1);
  const bestellDateStr=orderEntryDate.toISOString().split('T')[0];
  const isBestellToday=transporterBestellDateOffset===0;
  const bestellDateLabel=bestellViewDate.toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'2-digit'});
  html+=`<div class="card" style="padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
    <button onclick="navBestellDate(-1)" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;">← Vorheriger</button>
    <div style="text-align:center;">
      <div style="font-size:12.5px;font-weight:600;">${bestellDateLabel}${isBestellToday?' · heute':''}</div>
      <div style="font-size:10px;color:var(--muted);">Bestellungen von ${orderEntryDate.toLocaleDateString('de-AT',{weekday:'short',day:'2-digit',month:'2-digit'})}</div>
      ${!isBestellToday?`<div onclick="navBestellToday()" style="font-size:10px;color:#F97316;cursor:pointer;text-decoration:underline;">zu heute zurück</div>`:''}
    </div>
    <button onclick="navBestellDate(1)" ${isBestellToday?'disabled style="opacity:0.35;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;"':'style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;"'}>Nächster →</button>
  </div>`;
  if(!isBestellToday){
    html+=`<div style="background:#FFF7ED;border:1px solid #FDBA74;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11.5px;color:#9A3412;">📋 Ansicht eines vergangenen Tages — nur Anzeige, "eingepackt" kann hier nicht mehr geändert werden.</div>`;
  }
  const allOrdRaw=await api(`orders?order_date=eq.${bestellDateStr}&select=store_id,article_id,quantity,eingepackt`);
  const specRaw=await api(`special_orders?order_date=eq.${bestellDateStr}&select=id,store_id,note`).catch(()=>[]);
  const allOrd={};
  allOrdRaw.forEach(o=>{if(!allOrd[o.article_id])allOrd[o.article_id]={};allOrd[o.article_id][o.store_id]=o;});
  const activeColor='#F97316';

  // KC Abholbereit-Banner — nur für heute relevant
  const kcPickup=isBestellToday?await api('kc_pickup_ready?date=eq.'+today+'&select=ready_at,message').catch(()=>[]):[];
  if(kcPickup?.length){
    const readyTime=new Date(kcPickup[0].ready_at).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
    html+=`<div style="background:#F3E8FF;border:2px solid #A855F7;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;">
      <span style="font-size:28px;">📦</span>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;color:#6B21A8;font-family:'Boldonse',sans-serif;">Shop Produkte abholbereit!</div>
        <div style="font-size:11px;color:#7E22CE;margin-top:2px;">Ines hat alles eingepackt · seit ${readyTime} Uhr</div>
      </div>
      <button onclick="kcPickupDone()" style="background:#A855F7;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer;">Abgeholt ✓</button>
    </div>`;
  }

  html+=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Zahl antippen = als eingepackt markieren</div>`;

  let hasAny=false;
  TRANSPORTER_CATS.forEach(cat=>{
    const items=articles.filter(a=>a.category===cat&&storeList.some(s=>(allOrd[a.id]||{})[s.id]?.quantity>0));
    if(!items.length) return;
    hasAny=true;
    html+=`<div class="section-lbl" style="font-size:11px;color:var(--muted);font-weight:500;">${cat}</div>`;
    items.forEach(a=>{
      const relevantStores=storeList.filter(s=>((allOrd[a.id]||{})[s.id]?.quantity||0)>0);
      const total=relevantStores.reduce((acc,s)=>acc+((allOrd[a.id]||{})[s.id]?.quantity||0),0);
      const verfuegbar=a.verfuegbar!==false;

          ${a.image_url?`<img src="${a.image_url}" alt="" style="width:26px;height:26px;border-radius:6px;object-fit:cover;flex-shrink:0;">`:''}
          <span style="flex:1;font-size:13px;font-weight:600;">${a.name}</span>
          <span style="font-size:12.5px;font-weight:700;color:${activeColor};background:${activeColor}15;padding:2px 8px;border-radius:6px;">∑ ${total}</span>
        </div>`;
      relevantStores.forEach(s=>{
        const rec=(allOrd[a.id]||{})[s.id];
        const v=rec?.quantity||0;
        const packed=!!rec?.eingepackt;
        const cellStyle=`display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:7px;font-weight:${packed?'400':'600'};font-size:12.5px;color:${packed?'#3B6D11':'#1a1a18'};background:${packed?'#EAF3DE':'var(--surface-1)'};text-decoration:${packed?'line-through':'none'};`;
        html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-top:0.5px solid var(--border);">
          <span data-no-translate style="font-size:12.5px;color:${STORE_COLORS[s.id]||'#888'};font-weight:500;">${s.name.split(' ')[0]}</span>
          ${isBestellToday
            ? `<span onclick="toggleOrderEingepackt(${a.id},'${s.id}',${packed},this,${v},'${bestellDateStr}')" style="cursor:pointer;${cellStyle}">${v}${packed?' ✓':''}</span>`
            : `<span style="${cellStyle}">${v}${packed?' ✓':''}</span>`}
        </div>`;
      });
      html+='</div>';
    });
  });

  const specs=(specRaw||[]).filter(s=>s.store_id!=='zentrale' && s.store_id!=='1070');
  const geldwechselOffen=await api('geldwechsel?status=eq.offen&select=*&order=erstellt_am.asc').catch(()=>[]);

    html+=`<div class="section-lbl">💶 Geldwechsel — offen</div><div class="card">`;
    geldwechselOffen.forEach(g=>{
      const store=stores.find(x=>x.id===g.store_id);

    html+=`<div class="section-lbl">📝 Sonderbestellungen</div><div class="card">`;
    specs.forEach(s=>{const store=stores.find(x=>x.id===s.store_id);const col=STORE_COLORS[s.store_id]||'#888';html+=`<div style="padding:9px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;"><span style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0;"></span><div style="flex:1;"><div style="font-size:12px;font-weight:500;" data-no-translate>${store?.name||s.store_id}</div><div style="font-size:13px;color:var(--sub);">${s.note}</div></div><button onclick="dismissSpecialOrder(${s.id})" style="background:var(--green-light);color:var(--green);border:none;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;">✓ erledigt</button></div>`;});

  if(!hasAny&&!specs.length) html+='<div class="card" style="padding:2rem;text-align:center;color:var(--muted);font-size:14px;">Noch keine Bestellungen heute</div>';

  // Alle Transporter-Artikel — auch ohne heutige Bestellung, damit Lieferbarkeit VORAB gemeldet werden
  // kann (z.B. wenn Servietten leer sind, bevor überhaupt eine Filiale sie nachbestellt hat).
  // Gleiches Prinzip wie bei KC: erst die Artikel ohne Bestand-Daten aussortieren, aber jederzeit einsehbar.

      <summary style="font-size:12px;color:var(--muted);cursor:pointer;padding:6px 2px;">Alle Artikel — Lieferbarkeit verwalten (${notOrderedToday.length})</summary>

    });
    html+='</div></details>';
  }

  el.innerHTML=html;
  translateEl(el);
}

async function toggleKcPacked(articleId, storeId, soll){
  // "Eingepackt" heißt: die Filiale hat nach der Lieferung wieder SOLL-Bestand — wir schreiben das
  // direkt in den IST-Bestand, statt den Bedarf nur zu verstecken. Der Bedarf verschwindet dadurch
  // ganz natürlich aus der Berechnung (SOLL − IST = 0), keine separate Versteck-Logik nötig.
  const today=new Date().toISOString().split('T')[0];
  try{
    await api(`kc_stock?store_id=eq.${storeId}&article_id=eq.${articleId}`,{method:'DELETE'});
    await api('kc_stock',{method:'POST',body:JSON.stringify([{store_id:storeId,article_id:articleId,ist_bestand:soll,updated_date:today}])});
    showToast('✔ Eingepackt — IST-Bestand auf SOLL gesetzt');
    renderPack();
  }catch(e){console.error(e);showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);}
}
window.toggleKcPacked=toggleKcPacked;

async function renderKCOverview(el, tabHtml, storeList){
  let html=tabHtml;
  const today=new Date().toISOString().split('T')[0];
  const kcItems=articles.filter(a=>a.category==='Webshop-Produkte');
  const allIst=await api(`kc_stock?select=store_id,article_id,ist_bestand,updated_date`).catch(()=>[]);
  const istMap={};
  (allIst||[]).forEach(d=>{if(!istMap[d.article_id])istMap[d.article_id]={};istMap[d.article_id][d.store_id]=d;});

  // Nur Artikel mit echtem Nachbestell-Bedarf (SOLL > IST) in mind. einer Filiale direkt zeigen —
  // der Rest (kein Bedarf oder noch keine IST-Daten) wandert in eine einklappbare Sektion darunter.
  const needsAction=[], noAction=[];
  kcItems.forEach(a=>{
    const soll=a.min_stock||0;
    const hasBedarf=storeList.some(s=>{
      const ist=(istMap[a.id]||{})[s.id]?.ist_bestand;
      return ist!=null && (soll-ist)>0;
    });
    (hasBedarf?needsAction:noAction).push(a);
  });

  const activeColor='#A855F7'; // gleiche Rolle wie activeColor bei Transporter, nur in KC-Lila

  // Gleicher Tabellenaufbau wie bei Transporter: Artikel | Filialen | ∑ — für einheitliche Optik
  const renderHeader=()=>{
    let h=`<th style="text-align:left;">Artikel</th>`;
    storeList.forEach(s=>h+=`<th style="color:${STORE_COLORS[s.id]||'#888'};" data-no-translate>${s.name.split(' ')[0]}</th>`);
    h+=`<th style="color:${activeColor};">∑</th>`;
    return h;
  };

  const renderRow=(a)=>{
    const soll=a.min_stock||0;
    const verfuegbar=a.verfuegbar!==false;
    let totalBedarf=0;
    let r=`<tr><td><div style="display:flex;align-items:center;gap:6px;">
      <button onclick="toggleArticleVerfuegbarPack(${a.id},${verfuegbar})" title="${verfuegbar?'Lieferbar':'Nicht lieferbar'}" style="font-size:12px;padding:0;border:none;background:transparent;cursor:pointer;line-height:1;flex-shrink:0;">${verfuegbar?'✅':'❌'}</button>
      ${a.image_url?`<img src="${a.image_url}" alt="" style="width:24px;height:24px;border-radius:5px;object-fit:cover;flex-shrink:0;">`:''}
      <span>${a.name}</span>
    </div></td>`;
    storeList.forEach(s=>{
      const rec=(istMap[a.id]||{})[s.id];
      const ist=rec?.ist_bestand;
      if(ist===undefined||ist===null){
        r+=`<td style="color:var(--border);">·</td>`;
        return;
      }
      const b=soll-ist;
      if(b>0){
        totalBedarf+=b;
        r+=`<td><span onclick="toggleKcPacked(${a.id},'${s.id}',${soll})" style="cursor:pointer;display:inline-block;padding:2px 7px;border-radius:6px;font-weight:600;color:#3B6D11;">+${b}</span></td>`;
      } else {
        const col=b<0?'#A32D2D':'var(--muted)';
        r+=`<td style="color:${col};">${b}</td>`;
      }
    });
    r+=`<td style="font-weight:600;color:${activeColor};background:${activeColor}10;">${totalBedarf||'·'}</td></tr>`;
    return r;
  };

  html+=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Grüne Zahl antippen = eingepackt (setzt IST auf SOLL)</div>`;

  if(needsAction.length){
    html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr>${renderHeader()}</tr></thead><tbody>`;
    needsAction.forEach(a=>{ html+=renderRow(a); });
    html+='</tbody></table></div></div>';
  } else {
    html+=`<div style="text-align:center;padding:1.5rem;color:var(--muted);font-size:13px;background:var(--green-light);border-radius:10px;">✓ Aktuell überall genug Bestand — kein Nachbestell-Bedarf</div>`;

function commitSoldOutTimeText(slot, dishName, el){
  const raw=el.value.trim();
  if(!raw){ updateSoldOutTime(slot, dishName, null); return; }
  const m=raw.match(/^(\d{1,2}):?(\d{2})$/);
  if(!m){ showToast('Bitte als hh:mm eingeben, z.B. 13:45'); return; }
  const hh=parseInt(m[1],10), mm=parseInt(m[2],10);
  if(hh>23||mm>59){ showToast('Ungültige Uhrzeit'); return; }
  const formatted=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  updateSoldOutTime(slot, dishName, formatted);
}

const WEEKDAYS=[{k:'mo',l:'Montag'},{k:'di',l:'Dienstag'},{k:'mi',l:'Mittwoch'},{k:'do',l:'Donnerstag'},{k:'fr',l:'Freitag'}];

function changeKitchenForecastWeek(d){
  const _nowCKFW=new Date(); const _isFridayCKFW=_nowCKFW.getDay()===5;
  const base = kitchenForecastManualOffset ?? (_isFridayCKFW && _nowCKFW.getHours()>=13?1:0);
  const next = base + d;
  // Nicht weiter als -1 (letzte Woche) oder +2 (übernächste Woche) erlauben
  kitchenForecastManualOffset = Math.max(-1, Math.min(2, next));
  renderKitchen();
}

function getWeekDates(offset){
  const now=new Date();
  const monday=new Date(now);
  const dayNum=(now.getDay()+6)%7;
  monday.setDate(now.getDate()-dayNum+offset*7);
  const days=[];
  for(let i=0;i<5;i++){
    const d=new Date(monday);
    d.setDate(monday.getDate()+i);
    days.push(d);
  }
  return days;
}

  const weekDates=getWeekdayDates();
  const todayWeekday=new Date().getDay();
  const WD_LABEL={1:'Montag',2:'Dienstag',3:'Mittwoch',4:'Donnerstag'};

  const baseline=await api('samosa_baseline?select=store_id,weekday,base_qty').catch(()=>[]);
  const todayVals=await api(`samosa_today?select=store_id,supply_date,qty,is_adjusted&supply_date=gte.${weekDates[1]}&supply_date=lte.${weekDates[4]}`).catch(()=>[]);
  const valMap={}; // valMap[date][store_id] = rec
  (todayVals||[]).forEach(d=>{ if(!valMap[d.supply_date])valMap[d.supply_date]={}; valMap[d.supply_date][d.store_id]=d; });

  let html=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table" style="width:100%;"><thead><tr>
    <th style="text-align:left;">Standort</th>
    ${[1,2,3,4].map(wd=>`<th style="${wd===todayWeekday?'color:#F97316;font-weight:700;':''}">${WD_LABEL[wd]}${wd===todayWeekday?' (heute)':''}</th>`).join('')}
  </tr></thead><tbody>`;

  const dayTotals={1:0,2:0,3:0,4:0};
  // dayValues[wd] = [{storeName, val}] — für die Kopier-Textzusammenfassung unten
  const dayValues={1:[],2:[],3:[],4:[]};
  storeList.forEach(s=>{
    html+=`<tr><td data-no-translate style="text-align:left;font-size:12px;color:${STORE_COLORS[s.id]||'#888'};">${s.name.split(' ')[0]}</td>`;
    [1,2,3,4].forEach(wd=>{
      const b=baseline.find(x=>x.store_id===s.id && x.weekday===wd);
      const dateStr=weekDates[wd];
      const rec=(valMap[dateStr]||{})[s.id];
      // Auch ohne hinterlegten Basiswert ein Eingabefeld anzeigen (z.B. für Filialen, die aktuell
      // keine Samosas bekommen, aber künftig vielleicht welche brauchen) — Standard dann 0.
      const val=rec?rec.qty:(b?b.base_qty:0);
      dayTotals[wd]+=parseInt(val)||0;
      if(parseInt(val)>0) dayValues[wd].push({name:s.name.split(' ')[0], val:parseInt(val)});
      const adjusted=!!rec?.is_adjusted;
      const isOptional=!b; // kein Standard-Liefertag für diese Filiale — dezenter dargestellt
      html+=`<td><input type="number" step="1" value="${val}" data-store="${s.id}" data-weekday="${wd}" data-date="${dateStr}"
        onchange="updateSamosaQty(this)"
        style="width:44px;text-align:center;border:1.5px solid ${adjusted?'#F97316':'var(--border)'};border-radius:6px;font-size:12px;padding:3px 1px;background:${adjusted?'#FFF7ED':isOptional?'transparent':'#fff'};color:${isOptional&&!val?'var(--muted)':'inherit'};"></td>`;
    });
    html+='</tr>';
  });
  html+=`<tr style="font-weight:700;background:var(--green-light);"><td style="text-align:left;font-size:12px;color:#3B6D11;">GESAMT</td>
    ${[1,2,3,4].map(wd=>`<td style="color:#3B6D11;font-size:13px;">${dayTotals[wd]}</td>`).join('')}
  </tr>`;
  html+='</tbody></table></div></div>';
  html+=`<div style="font-size:10px;color:var(--muted);padding:6px 2px;">Zahl antippen = für diesen Tag anpassen. Orange = angepasst. Leere/graue Felder = aktuell kein Standard-Liefertag, aber jederzeit eintragbar.</div>`;

  // Kopier-Textblock fürs Weiterleiten an den Produzenten per WhatsApp — der braucht nur die
  // Gesamtmenge pro Tag (und die Wochensumme), keine Aufschlüsselung nach Filiale.
  let weekTotal=0;
  let summary=`🥟 Samosas Woche (Mo–Do):\n`;
  [1,2,3,4].forEach(wd=>{
    if(!dayValues[wd].length) return;
    weekTotal+=dayTotals[wd];
    summary+=`${WD_LABEL[wd]}: ${dayTotals[wd]}\n`;
  });
  summary+=`Gesamt Woche: ${weekTotal}`;
  const summaryEsc=summary.replace(/`/g,'\\`').replace(/</g,'&lt;');
  html+=`<div style="margin-top:14px;">
    <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">📋 Für den Produzenten</div>
    <textarea id="samosa-copy-text" readonly style="width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:13px;min-height:110px;resize:vertical;font-family:inherit;box-sizing:border-box;background:var(--card);">${summary}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button onclick="copySamosaText()" style="flex:1;padding:9px;border:none;border-radius:8px;background:#F97316;color:#fff;font-size:13px;font-weight:500;cursor:pointer;">📋 Kopieren</button>
      <button id="samosa-share-btn" onclick="shareSamosaText()" style="display:${(typeof navigator!=='undefined'&&navigator.share)?'block':'none'};flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;background:none;font-size:13px;cursor:pointer;">📤 Teilen</button>
    </div>
  </div>`;
  return html;
}

function copySamosaText(){
  const el=document.getElementById('samosa-copy-text');
  if(!el) return;
  navigator.clipboard?.writeText(el.value).then(()=>showToast('✔ In Zwischenablage kopiert')).catch(()=>{
    el.select(); document.execCommand('copy'); showToast('✔ Kopiert');
  });
}
window.copySamosaText=copySamosaText;

function shareSamosaText(){
  const el=document.getElementById('samosa-copy-text');
  if(!el) return;
  if(navigator.share){ navigator.share({text:el.value}).catch(()=>{}); }
}
window.shareSamosaText=shareSamosaText;

async function updateSamosaQty(input){
  const storeId=input.dataset.store;
  const dateStr=input.dataset.date;
  const qty=parseInt(input.value);
  if(isNaN(qty)) return;
  try{
    await api(`samosa_today?store_id=eq.${storeId}&supply_date=eq.${dateStr}`,{method:'DELETE'});
    await api('samosa_today',{method:'POST',body:JSON.stringify([{store_id:storeId,supply_date:dateStr,qty,is_adjusted:true}])});
    showToast('✔ Gespeichert');
    if(activePackTab==='transporter') renderPack();
  }catch(e){console.error(e);showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);}
}
window.updateSamosaQty=updateSamosaQty;

// Info-Tab für Michi (Transporter): zeigt Aufgaben, die Tini/Ines in Organisation eingetragen haben,
// datumsverknüpft — heutige/überfällige zuerst, dann kommende. Direkt abhakbar, kein Umweg über Organisation.
async function renderTransporterInfoTabHtml(){
  const todayStr=new Date().toISOString().split('T')[0];
  const [tasks, broadcastsRaw, stores]=await Promise.all([
    api('transporter_tasks?select=*&order=task_date.asc').catch(()=>[]),
    api(`org_broadcasts?target_store_id=eq.transporter&order=created_at.desc&limit=20`).catch(()=>[]),
    api('stores?select=id,name&order=id').catch(()=>[])
  ]);
  const dismissed=JSON.parse(localStorage.getItem('kf_transporter_bc_dismissed')||'[]');
  const broadcasts=(broadcastsRaw||[]).filter(b=>{
    if(dismissed.includes(b.id)) return false;
    if(b.show_until && b.show_until<todayStr) return false;
    return true;
  });
  const storeList=(stores||[]).filter(s=>s.id!=='zentrale'&&s.id!=='1070'&&s.id!=='kitchen');
  let html='';

  // Direkter Schnell-Eintrag für Organisation — kein Umweg über Management nötig.
  // Vorne immer wählbar: für welche Filiale das gilt (oder allgemein/Organisation).
  if(currentStore?.id==='zentrale'){
    const today=todayStr;
    html+=`<div class="card" style="padding:12px;margin-bottom:14px;border:1.5px dashed #F97316;background:#FFF7ED;">
      <div style="font-weight:600;font-size:13px;margin-bottom:8px;color:#9A3412;">➕ Notiz an Michi hinterlassen</div>
      <select id="tt-inline-filiale" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;box-sizing:border-box;background:#fff;">
        <option value="">🏢 Allgemein (Organisation)</option>
        ${storeList.map(s=>`<option value="${escAttr(s.name)}">📍 ${s.name}</option>`).join('')}
      </select>
      <textarea id="tt-inline-text" placeholder="Was soll Michi tun?" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;min-height:60px;resize:vertical;font-family:inherit;font-size:13px;box-sizing:border-box;margin-bottom:8px;"></textarea>
      <input type="date" id="tt-inline-date" value="${today}" min="${today}" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;box-sizing:border-box;font-size:13px;">
      <button onclick="saveTransporterTaskInline()" style="width:100%;background:#F97316;color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;">Hinterlassen</button>
    </div>`;
  }

  if(broadcasts.length){
    html+=`<div class="section-lbl">📣 Nachricht von Organisation</div>`;
    html+=broadcasts.map(b=>`<div class="card" style="padding:12px;margin-bottom:8px;border:1.5px solid #0EA5E9;background:#F0F9FF;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
        <span style="font-size:10.5px;color:var(--muted);">${new Date(b.created_at).toLocaleString('de-AT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${b.created_by||'Organisation'}</span>
        <button onclick="dismissTransporterBroadcast(${b.id})" style="font-size:10.5px;color:var(--muted);background:none;border:none;cursor:pointer;">✕ ausblenden</button>
      </div>
      <div style="font-size:14px;color:#0C4A6E;margin-top:4px;">${b.message}</div>
    </div>`).join('');
  }
  if(!tasks?.length){
    html+=`<div class="card" style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">Aktuell keine offenen Aufgaben von Organisation. 🎉</div>`;
    return html;
  }
  const open=tasks.filter(t=>!t.done);
  const done=tasks.filter(t=>t.done);
  const renderTask=t=>{
    const isToday=t.task_date===todayStr;
    const isPast=t.task_date<todayStr;
    const dateLabel=new Date(t.task_date+'T00:00:00').toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'2-digit'});
    const badgeColor=isPast&&!t.done?'#DC2626':(isToday?'#F97316':'var(--muted)');
    return `<div class="card" style="padding:12px;margin-bottom:8px;${t.done?'opacity:0.5;':''}${isPast&&!t.done?'border:1.5px solid #FCA5A5;':(isToday&&!t.done?'border:1.5px solid #F97316;':'')}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
        <span style="font-size:12px;font-weight:700;color:${badgeColor};">${dateLabel}${isPast&&!t.done?' · überfällig':(isToday?' · heute':'')}</span>
        ${t.filiale?`<span data-no-translate style="font-size:10px;font-weight:600;color:#0369A1;background:#F0F9FF;border-radius:20px;padding:2px 8px;white-space:nowrap;">📍 ${t.filiale}</span>`:''}
      </div>
      <div style="font-size:14px;color:#1a1a18;margin-top:4px;text-decoration:${t.done?'line-through':'none'};">${t.text}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <span style="font-size:10.5px;color:var(--muted);">von ${t.created_by||'Organisation'}</span>
        <div class="cl-item" onclick="toggleTransporterTaskDone(${t.id},${!t.done})" style="padding:0;">
          <div class="check-box${t.done?' done':''}">${t.done?'<svg width="12" height="12" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>':''}</div>
          <span class="cl-text" style="font-size:12px;">erledigt</span>
        </div>
      </div>
    </div>`;
  };
  html+=`<div class="section-lbl" style="margin-top:${broadcasts.length?'14px':'0'};">📋 Aufgaben</div>`;
  if(open.length){
    html+=open.map(renderTask).join('');
  } else {
    html+=`<div class="card" style="padding:16px;text-align:center;color:var(--green);font-size:13px;">Alle Aufgaben erledigt ✓</div>`;
  }
  if(done.length){
    html+=`<div class="section-lbl" style="margin-top:14px;">✓ Erledigt</div>${done.map(renderTask).join('')}`;
  }
  return html;
}

  if(!dismissed.includes(id)) dismissed.push(id);
  localStorage.setItem('kf_transporter_bc_dismissed', JSON.stringify(dismissed));
  renderPack();
}

async function renderTransporterBeilagenHtml(){

  const baseline=await api(`kitchen_supply_baseline?weekday=eq.${weekdayNum}&select=store_id,article_name,unit,base_qty`).catch(()=>[]);

  const valMap={};

  const articleSetToday=new Set(baseline.map(b=>b.article_name));

      const b=baseline.find(x=>x.store_id===st.id&&x.article_name===name);

      return `<td style="text-align:center;padding:6px 4px;">

  });

  html+=`<div style="font-size:10px;color:var(--muted);padding:6px 2px;">Antippen zum Abhaken · orange = von Filiale angepasst</div>`;

          const rec=(valMap[dateStr]?.[st.id]||{})[name];

          if(val!=null){ sum+=parseFloat(val)||0; storeQtys.push({storeName:st.name.split(' · ')[1]||st.name.split(' ')[0], val:Number.isInteger(val)?val:Math.round(val*100)/100, color:STORE_COLORS[st.id]||'#888'}); }
          if(rec?.is_adjusted) adjusted=true;
        });
        if(!sum && !dayItems.length) return `<td style="color:var(--border);font-size:11px;padding:6px 4px;">–</td>`;
        const sumDisplay=Number.isInteger(sum)?sum:Math.round(sum*100)/100;
        const allPacked=isToday && storeList.every(st=>{ const rec=(valMap[dateStr]?.[st.id]||{})[name]; return !rec||!!rec.eingepackt; });
        const breakdown=mode==='transporter' && storeQtys.length>1?`<div style="margin-top:2px;">${storeQtys.map(s=>`<div style="font-size:8px;color:${s.color};line-height:1.4;">${s.storeName}: ${s.val}</div>`).join('')}</div>`:'';
        return `<td style="font-size:12px;font-weight:${isToday?'700':'500'};color:${adjusted?'#C2410C':(isToday?'#9D174D':'#1a1a18')};${isToday?'background:#FDF4FF;':''}padding:6px 4px;vertical-align:top;">${sumDisplay}${adjusted?'*':''}<div style="font-size:9px;color:${allPacked?'var(--green)':'var(--muted)'};">${isToday?(allPacked?'✓':'○'):''}</div>${breakdown}</td>`;
      }).join('');
      html+=`<tr style="border-top:0.5px solid var(--border);">
        <td style="padding:10px 10px;vertical-align:middle;">
          <div style="display:flex;align-items:center;gap:7px;">${img}<div><div style="font-size:12px;font-weight:600;color:${ARTICLE_COLORS[name]||'#1a1a18'};">${name}</div><div style="font-size:9px;font-weight:400;color:var(--muted);margin-top:1px;">${unit}</div></div></div>
        </td>${cells}
      </tr>`;
    });
    html+='</tbody></table></div></div>';
    html+=`<div style="font-size:10px;color:var(--muted);padding:5px 2px;">Pink = heute · * = Filiale hat angepasst · ✓ = eingepackt bestätigt</div>`;
    return html;
  }
