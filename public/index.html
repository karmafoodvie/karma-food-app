// ---- WOCHENMENÜ (Koch-Leitfaden) ----
function formatZutatenFuerKoch(zutaten, allergene){
  if(!zutaten) return '';
  // Bold allergen-relevant ingredients by checking against known allergy markers
  const allergenKeywords = {
    'A':'GLUTEN|WEIZEN|MEHL|DINKEL|ROGGEN|GERSTE|HAFER|KAMUT|LASAGNE BLÄTTER|TEIGBLÄTTER|TEIG BLATTE',
    'C':'SELLERIE|SELLIERE',
    'F':'SOJA|SOJAJOGHURT|SOJAFASCHIERTES|SOJAHACK|TOFU',
    'G':'MILCH|KÄSE|JOGHURT|BUTTER|RAHM|PARMESAN|MOZZARELLA',
    'L':'SESAM|SESAM SAMEN',
    'M':'SENF|DRESSING.*SENF',
    'N':'ERDNUSS|MANDEL|HASELNUSS|CASHEW|WALNUSS|PEKANNUSS|PISTAZIE'
  };
  let items = zutaten.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean);
  return items.map(item=>{
    const upper = item.toUpperCase();
    const isAllergen = Object.values(allergenKeywords).some(kw=>new RegExp(kw).test(upper));
    return isAllergen
      ? `<strong style="color:#0F6E56;">${item}</strong>`
      : item;
  }).join(' · ');
}

let menuEdits = {}; // store_id agnostic, keyed by "w{n}_{day}_{slot}"

async function renderMorgenKoch(el, tabHtml, dayOffset=null){
  // dayOffset: null = auto (morgen), 0 = heute, 1 = übermorgen etc. — außer morgen ist Samstag/Sonntag (nicht gekocht),
  // dann automatisch weiter auf den nächsten Montag springen.
  // Calculate cook day based on offset (skip weekends)
  if(window._morgenDayOffset===undefined) window._morgenDayOffset=null;
  const _offset = dayOffset!==null ? dayOffset : (window._morgenDayOffset!==null ? window._morgenDayOffset : null);
  const tomorrow = new Date();
  if(_offset!==null){
    tomorrow.setDate(tomorrow.getDate()+_offset);
  } else {
    tomorrow.setDate(tomorrow.getDate()+1);
    while([0,6].includes(tomorrow.getDay())){ tomorrow.setDate(tomorrow.getDate()+1); }
  }
  const tomorrowStr = tomorrow.toISOString().split('T')[0];
  const tomorrowWd = (['so','mo','di','mi','do','fr','sa'])[tomorrow.getDay()];
  const DAY_NAME = {mo:'Montag',di:'Dienstag',mi:'Mittwoch',do:'Donnerstag',fr:'Freitag',sa:'Samstag',so:'Sonntag'};
  // For day navigation
  const todayStr = new Date().toISOString().split('T')[0];
  const isToday = tomorrowStr===todayStr;

  const stores = await api('stores?select=id,name&order=id').catch(()=>[]);
  const storeList = (stores||[]).filter(s=>s.id!=='zentrale'&&s.id!=='1070'&&s.id!=='kitchen');

  const forecasts = await api(`forecast_qty?forecast_date=eq.${tomorrowStr}&select=store_id,dish_name,qty,source,changed_at,groesse`).catch(()=>[]);
  const fMap = {}; const fMapByCat = {};
  (forecasts||[]).forEach(f=>{
    if(!fMap[f.dish_name]) fMap[f.dish_name]={};
    if(!fMap[f.dish_name][f.store_id]) fMap[f.dish_name][f.store_id]=[];
    fMap[f.dish_name][f.store_id].push(f);
    const _cat=mapDishNameToCategory(f.dish_name);
    if(!fMapByCat[_cat]) fMapByCat[_cat]={};
    if(!fMapByCat[_cat][f.store_id]) fMapByCat[_cat][f.store_id]=[];
    fMapByCat[_cat][f.store_id].push(f);
  });

  // Get tomorrow's menu dishes from MENU_DATA
  const _cookWoche=getMenuWocheForDate(tomorrowStr);
  const menuDishes = (typeof MENU_DATA!=='undefined'&&MENU_DATA[`w${_cookWoche}_${tomorrowWd}`])||[];
  const dishNames = menuDishes.map(d=>d.name).filter(n=>n&&!n.startsWith('ÖL'));
  const overrides = await api('allergene_rezepturen?select=*').catch(()=>[]);
  const overrideMap = {};
  (overrides||[]).forEach(e=>{
    overrideMap[e.gericht]=e; // Fallback für Altbestand
    if(e.zkey) overrideMap[e.zkey]=e; // stabiler Schlüssel hat Vorrang
  });
  // Load structured rezept_zutaten if available
  const rezeptZutatenRaw = await api('rezept_zutaten?select=gericht,menge,notiz,zutaten(id,name,kategorie,ist_allergen,allergen_code)').catch(()=>[]);
  const rezeptZutaten = {};
  (rezeptZutatenRaw||[]).forEach(rz=>{
    if(!rezeptZutaten[rz.gericht]) rezeptZutaten[rz.gericht]=[];
    if(rz.zutaten) rezeptZutaten[rz.gericht].push({...rz.zutaten, menge:rz.menge, notiz:rz.notiz});
  });

  // Last update time
  const lastUpdate = forecasts.length ? forecasts.reduce((a,b)=>(!a||b.changed_at>a)?b.changed_at:a, null) : null;
  const lastUpdateLabel = lastUpdate ? new Date(lastUpdate).toLocaleString('de-AT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : null;

  // Wetter (Referenz Wien-Innenstadt) + Feiertage/Ferien für morgen — Küche soll das auch ohne Umweg wissen
  const [morgenWeatherMap, morgenCalendarEvents] = await Promise.all([
    fetchWeatherForStore('lb', tomorrowStr, tomorrowStr).catch(()=>({})),
    getCalendarEvents().catch(()=>[])
  ]);
  const zeroSettings = {weather_sunny_pct:0, weather_rain_pct:0, feiertag_pct:0, ferien_pct:0};
  const {reason:morgenReason} = getDayModifiers(tomorrowStr, 'lb', morgenWeatherMap, morgenCalendarEvents, zeroSettings);

  let html = tabHtml;

  // ── Day Navigation ──────────────────────────────────────────────────────
  const navPrevDay=()=>{
    const d=new Date(tomorrowStr+'T00:00:00');
    d.setDate(d.getDate()-1);
    while([0,6].includes(d.getDay())) d.setDate(d.getDate()-1);
    window._morgenDayOffset=Math.round((d-new Date(new Date().toDateString()))/(86400000));
    renderKitchen();
  };
  const navNextDay=()=>{
    const d=new Date(tomorrowStr+'T00:00:00');
    d.setDate(d.getDate()+1);
    while([0,6].includes(d.getDay())) d.setDate(d.getDate()+1);
    window._morgenDayOffset=Math.round((d-new Date(new Date().toDateString()))/(86400000));
    renderKitchen();
  };
  const navToday=()=>{ window._morgenDayOffset=null; renderKitchen(); };
  window.navPrevDay=navPrevDay; window.navNextDay=navNextDay; window.navToday=navToday;

  // ── Header Card — richer UX ─────────────────────────────────────────────
  const dateDisplay=tomorrow.toLocaleDateString('de-AT',{weekday:'long',day:'numeric',month:'long'});
  const shortDate=tomorrow.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});
  html+=`<div style="border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <div style="background:var(--green);padding:14px 16px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;">
        <div>
          <div style="font-size:10px;font-weight:600;letter-spacing:0.08em;color:rgba(255,255,255,0.65);text-transform:uppercase;margin-bottom:3px;">🍽️ Kochtermin</div>
          <div style="font-size:24px;font-weight:700;color:#fff;font-family:'Boldonse',sans-serif;line-height:1.1;">${dateDisplay.split(',')[0]}</div>
          <div style="font-size:13px;color:rgba(255,255,255,0.8);margin-top:2px;">${tomorrow.toLocaleDateString('de-AT',{day:'2-digit',month:'long',year:'numeric'})}</div>
        </div>
        <div style="text-align:right;">
          ${lastUpdateLabel?`<div style="font-size:9px;color:rgba(255,255,255,0.5);margin-bottom:4px;">↻ ${lastUpdateLabel}</div>`:''}
          ${morgenReason?`<div style="font-size:11px;color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.15);border-radius:6px;padding:3px 8px;">${morgenReason}</div>`:''}
        </div>
      </div>
    </div>
    <div style="background:rgba(29,94,58,0.06);border:0.5px solid rgba(29,94,58,0.15);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;">
      <button onclick="navPrevDay()" style="background:none;border:1px solid rgba(29,94,58,0.25);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--green);cursor:pointer;font-weight:500;">← Vorheriger</button>
      ${!isToday?`<button onclick="navToday()" style="background:var(--green);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;font-weight:600;">Heute</button>`:`<div style="font-size:11px;color:var(--muted);">Heute · ${shortDate}</div>`}
      <button onclick="navNextDay()" style="background:none;border:1px solid rgba(29,94,58,0.25);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--green);cursor:pointer;font-weight:500;">Nächster →</button>
    </div>
  </div>`;

  if(!dishNames.length || !['mo','di','mi','do','fr'].includes(tomorrowWd)){
    html+=`<div style="text-align:center;padding:2rem;color:var(--muted);">Kein Menü für morgen eingetragen.</div>`;
    el.innerHTML=html; return;
  }

  const GROESSE_LABEL={gross:'Groß·18 Stk',mittel:'Mittel·12 Stk',klein:'Klein·8 Stk'};
  const validDishObjs=menuDishes.filter(d=>d.name&&!d.name.startsWith('ÖL'));
  // Lasagne-Legende: einmalig oben, kompakt, damit Mitarbeitende die Größen verstehen
  const hasAnyLasagne=validDishObjs.some(d=>d.name.includes('Lasagne'));
  html+=`<div style="display:flex;align-items:center;gap:8px;margin:4px 0 10px;">
    <span style="font-size:18px;">🍽️</span>
    <span style="font-size:14px;font-weight:800;color:#1a1a18;letter-spacing:-0.01em;">Gerichte &amp; Mengen</span>
  </div>`;
  if(hasAnyLasagne){
    html+=`<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:4px;background:#FEF3C7;border:1px solid #FCD34D;border-radius:6px;padding:3px 8px;">
        <span style="font-size:11px;font-weight:700;color:#92400E;">K</span>
        <span style="font-size:10px;color:#78350F;">Klein = 8 Stk</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px;background:#FEF3C7;border:1px solid #FCD34D;border-radius:6px;padding:3px 8px;">
        <span style="font-size:11px;font-weight:700;color:#92400E;">M</span>
        <span style="font-size:10px;color:#78350F;">Mittel = 12 Stk</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px;background:#FEF3C7;border:1px solid #FCD34D;border-radius:6px;padding:3px 8px;">
        <span style="font-size:11px;font-weight:700;color:#92400E;">G</span>
        <span style="font-size:10px;color:#78350F;">Groß = 18 Stk</span>
      </div>
    </div>`;
  }
  html+=`<div style="background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:12px;">
  <div style="overflow-x:auto;"><table class="pack-table" style="width:100%;border-collapse:collapse;">
  <thead><tr style="background:var(--surface-1);">
    <th style="text-align:left;padding:8px 10px;font-size:11px;font-weight:600;letter-spacing:0.04em;color:var(--sub);border-bottom:1.5px solid var(--border);border-right:1px solid var(--border);">Gericht</th>
    ${storeList.map((s,si)=>`<th data-no-translate style="padding:8px 6px;font-size:10px;font-weight:700;color:${STORE_COLORS[s.id]||'#888'};border-bottom:1.5px solid var(--border);${si<storeList.length-1?'border-right:1px solid var(--border);':''}white-space:nowrap;">${s.name.split(' ')[0]}</th>`).join('')}
    <th style="padding:8px 6px;font-size:11px;font-weight:700;color:var(--green);border-bottom:1.5px solid var(--border);border-left:1px solid var(--border);">Σ</th>
  </tr></thead><tbody>`;
  validDishObjs.forEach((dishObj,dIdx)=>{
    const dish=dishObj.name;
    // Lookup by exact name, fallback to category (cross-week matching)
    const cat=mapDishNameToCategory(dish, dishObj.slot);
    const storeData = (Object.keys(fMap[dish]||{}).length ? fMap[dish] : (fMapByCat[cat]||{}));
    const isLasagne=dish.includes('Lasagne');
    const total = storeList.reduce((sum,s)=>sum+((storeData[s.id]||[]).reduce((a,r)=>a+(r.qty||0),0)),0);
    const hasData = total>0;
    const detailId = `morgen_zut_${dIdx}`;
    const cells=storeList.map((s,si)=>{
      const recs=storeData[s.id]||[];
      const qty=recs.reduce((a,r)=>a+(r.qty||0),0);
      const changed=recs.some(r=>r.source==='manual'||r.source==='store'||r.source==='org');
      const changedByOrg=recs.some(r=>r.source==='org');
      const changedColor=changedByOrg?'#2B3A67':'#0369A1';
      const sizeLabel=isLasagne&&recs.length?recs.map(r=>`${formatQty(r.qty)}×${r.groesse==='mittel'?'M':(r.groesse==='klein'?'K':'G')}`).join('+'):null;
      return `<td style="font-weight:${changed?'700':'400'};color:${changed?changedColor:(qty?'#1a1a18':'var(--border)')};border-bottom:1px solid var(--border);${si<storeList.length-1?'border-right:1px solid var(--border);':''}">${qty?formatQty(qty):'–'}${sizeLabel?`<div style="font-size:8.5px;color:var(--muted);">${sizeLabel}</div>`:''}</td>`;
    }).join('');
    html+=`<tr onclick="document.getElementById('${detailId}').style.display=document.getElementById('${detailId}').style.display==='none'?'block':'none'" style="cursor:pointer;background:${hasData?'var(--green-light)':''};">
      <td style="text-align:left;border-bottom:1px solid var(--border);border-right:1px solid var(--border);"><span style="display:inline-flex;align-items:center;gap:5px;vertical-align:middle;">${dishImgHtml(dish, 22)}<span style="font-weight:600;">${dish}</span></span></td>
      ${cells}
      <td style="font-weight:700;color:${hasData?'var(--green)':'var(--muted)'};border-bottom:1px solid var(--border);border-left:1px solid var(--border);">${total>0?formatQty(total):'–'}</td>
    </tr>`;
  });
  html+='</tbody></table></div></div>';

  // "Serviert mit" — kompakte Badge-Zeile pro Gericht mit Beilage-Zuordnung
  const beilagenChips=validDishObjs.map(dishObj=>{
    const dish=dishObj.name;
    const beilagen=getDishBeilagen(dish);
    if(!beilagen.length) return '';
    const chips=beilagen.map(b=>{
      const img=KITCHEN_SUPPLY_IMAGES[b]?`<img src="${KITCHEN_SUPPLY_IMAGES[b]}" alt="" style="width:14px;height:14px;border-radius:3px;object-fit:cover;vertical-align:middle;margin-right:3px;">`:'';
      return `<span style="display:inline-flex;align-items:center;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:5px;padding:2px 6px;font-size:10px;color:#166534;">${img}${b}</span>`;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:6px;padding:4px 2px;flex-wrap:wrap;">
      <span style="font-size:10px;color:var(--muted);white-space:nowrap;">${dishImgHtml(dish,14)} ${dish.length>22?dish.slice(0,22)+'…':dish} →</span>
      ${chips}
    </div>`;
  }).filter(Boolean).join('');
  if(beilagenChips){
    html+=`<div style="background:var(--surface-1);border-radius:10px;padding:8px 10px;margin-top:6px;margin-bottom:2px;">
      <div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:5px;">🥗 SERVIERT MIT</div>
      ${beilagenChips}
    </div>`;
  }

  // Zutaten-Panels — eingeklappt unter der Tabelle, pro Gericht per Klick auf die Zeile sichtbar.
  // Stift-Icon oben rechts verankert (nicht als Button ganz unten) — direkter Bearbeitungs-Einstieg
  // genau dort, wo der Koch heute tatsächlich arbeitet.
  validDishObjs.forEach((dishObj,dIdx)=>{
    const dish=dishObj.name;
    const zKey=zutatenKey(_cookWoche, tomorrowWd, dishObj.slot);
    const override = (zKey && overrideMap[zKey]) || overrideMap[dish];
    const zutaten = (override?.zutaten||dishObj.zutaten||'').replace(/\n/g,' ').trim();
    const detailId = `morgen_zut_${dIdx}`;
    html+=`<div id="${detailId}" class="card" style="display:none;position:relative;margin-top:-4px;margin-bottom:8px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;">
      <button onclick="openZutatenEditor(this.dataset.dish, this.dataset.zutaten, ${_cookWoche}, '${tomorrowWd}', '${dishObj.slot||''}')" data-dish="${dish}" data-zutaten="${zutaten.replace(/"/g,'&quot;')}"
        title="Zutaten bearbeiten"
        style="position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:none;background:var(--green-light);color:var(--green);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✏️</button>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-right:36px;">
        <span style="font-size:20px;">${getDishEmoji(dish)}</span>
        <span style="font-size:13.5px;font-weight:700;" data-no-translate>${dish}</span>
      </div>
      <div style="font-size:11px;line-height:1.6;">${renderZutatenReadOnly(zutaten)}</div>
    </div>`;
  });

  // Beilagen für morgen — Salat Lasagne + alle anderen Beilagen aus kitchen_supply_baseline
  const tomorrowWdShort = tomorrowWd; // 'mo','di' etc.
  const supplyBaseline = await api(`kitchen_supply_baseline?weekday=eq.${tomorrowWdShort}&select=store_id,article_name,unit,base_qty`).catch(()=>[]);
  const supplyToday = await api(`kitchen_supply_today?supply_date=eq.${tomorrowStr}&select=store_id,article_name,qty,is_adjusted`).catch(()=>[]);
  const supplyValMap = {}; // store_id -> article_name -> rec
  (supplyToday||[]).forEach(d=>{
    if(!supplyValMap[d.store_id]) supplyValMap[d.store_id]={};
    supplyValMap[d.store_id][d.article_name]=d;
  });
  // Alle Artikel für morgen sammeln
  const tomorrowArticles = {};
  (supplyBaseline||[]).forEach(b=>{
    if(!tomorrowArticles[b.article_name]) tomorrowArticles[b.article_name]={unit:b.unit, stores:{}};
    tomorrowArticles[b.article_name].stores[b.store_id]=b.base_qty;
  });
  // Salat Lasagne: Stadtplatz (3400) bekommt jeden Tag, Wien-Stores nur wenn Lasagne im Menü
  const tomorrowDishNamesLower = dishNames.map(d=>d.toLowerCase());
  const hasLasagne = tomorrowDishNamesLower.some(n=>n.includes('lasagne'));
  const wienerStores = storeList.filter(s=>s.id!=='3400');
  const stadtplatz = storeList.find(s=>s.id==='3400');
  // Salat Lasagne immer für Stadtplatz, für Wien nur wenn Lasagne am Menü
  const salatLasagneStores = [];
  if(stadtplatz) salatLasagneStores.push(stadtplatz);
  if(hasLasagne) wienerStores.forEach(s=>salatLasagneStores.push(s));

  // Beilagen für morgen entfernt (nicht benötigt)

  // Beilagen für morgen — zum Abhaken für die Küche (Prep)
  const _wdMap={'mo':1,'di':2,'mi':3,'do':4,'fr':5,'sa':6,'so':7}; const tomorrowWdNum = _wdMap[tomorrowWd]||1;
  const beilagenBaselineMorgen = await api(`kitchen_supply_baseline?weekday=eq.${tomorrowWdNum}&select=store_id,article_name,unit,base_qty`).catch(()=>[]);
  const beilagenTodayMorgen = await api(`kitchen_supply_today?supply_date=eq.${tomorrowStr}&select=store_id,article_name,qty,is_adjusted,eingepackt`).catch(()=>[]);
  const beilagenValMapMorgen={};
  (beilagenTodayMorgen||[]).forEach(d=>{
    if(!beilagenValMapMorgen[d.store_id])beilagenValMapMorgen[d.store_id]={};
    beilagenValMapMorgen[d.store_id][d.article_name]=d;
  });
  // Wichtig: Artikel-Liste aus BEIDEN Quellen zusammensetzen (Grundmenge UND tatsächlich
  // eingetragene Werte) — sonst verschwindet ein Artikel wie "Sauce Bowl", den eine Filiale
  // für diesen Tag eingetragen hat, komplett aus der Liste, nur weil es dafür keine
  // hinterlegte Grundmenge für genau diesen Wochentag gibt.
  const beilagenArticleSet=new Set((beilagenBaselineMorgen||[]).map(b=>b.article_name));
  (beilagenTodayMorgen||[]).forEach(d=>beilagenArticleSet.add(d.article_name));
  const allBeilagenMorgen=[...beilagenArticleSet];

  if(allBeilagenMorgen.length){
    html+=`<div style="display:flex;align-items:center;gap:8px;margin:20px 0 10px;">
      <span style="font-size:18px;">🥗</span>
      <span style="font-size:14px;font-weight:800;color:#1a1a18;letter-spacing:-0.01em;">Beilagen vorbereiten</span>
    </div>`;
    html+=`<div style="background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
    <div style="overflow-x:auto;"><table class="pack-table" style="width:100%;border-collapse:separate;border-spacing:0;">
      <thead><tr style="background:var(--surface-1);">
        <th style="text-align:left;font-size:11px;padding:9px 10px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--border);">Artikel</th>
        ${storeList.map(s=>`<th style="font-size:11px;font-weight:700;color:${STORE_COLORS[s.id]||'#888'};padding:9px 6px;border-bottom:1px solid var(--border);" data-no-translate>${s.name.split(' · ')[1]||s.name.split(' ')[0]}</th>`).join('')}
      </tr></thead><tbody>`;
    allBeilagenMorgen.forEach(name=>{
      const unit=(beilagenBaselineMorgen||[]).find(b=>b.article_name===name)?.unit||'';
      const img=KITCHEN_SUPPLY_IMAGES[name]?`<img src="${KITCHEN_SUPPLY_IMAGES[name]}" alt="" style="width:22px;height:22px;border-radius:4px;object-fit:cover;vertical-align:middle;margin-right:5px;">`:'' ;
      const cells=storeList.map(st=>{
        const b=(beilagenBaselineMorgen||[]).find(x=>x.store_id===st.id&&x.article_name===name);
        const rec=(beilagenValMapMorgen[st.id]||{})[name];
        const val=rec?rec.qty:(b?b.base_qty:null);
        const packed=!!rec?.eingepackt;
        if(val==null) return `<td style="color:var(--border);text-align:center;">–</td>`;
        return `<td style="text-align:center;padding:4px 3px;">
          <div onclick="toggleKuecheEingepackt('${st.id}','${escAttr(name)}','${tomorrowStr}',${val},${packed})"
            style="display:inline-flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:3px 6px;border-radius:7px;background:${packed?'var(--green-light)':'var(--surface-1)'};border:1.5px solid ${packed?'var(--green)':'var(--border)'};">
            <span style="font-size:12px;font-weight:600;color:${packed?'var(--green)':'#1a1a18'};">${val%1===0?val:val}</span>
            <span style="font-size:9px;color:${packed?'var(--green)':'var(--muted)'};">${packed?'✓':'○'}</span>
          </div>
        </td>`;
      }).join('');
      html+=`<tr style="border-top:0.5px solid var(--border);">
        <td style="font-size:11px;font-weight:600;color:${ARTICLE_COLORS[name]||'#444'};padding:6px 6px;">
          ${img}${name}<div style="font-size:9px;font-weight:400;color:var(--muted);">${unit}</div>
        </td>${cells}
      </tr>`;
    });
    html+='</tbody></table></div></div>';
  }

  html+=`<div style="font-size:11px;color:var(--muted);text-align:center;padding:8px 4px 16px;">Wenn ein Store die Menge ändert, wird diese Seite automatisch aktualisiert.</div>`;
  html+=`<button onclick="renderKitchen()" style="width:100%;padding:10px;background:var(--green-light);color:var(--green);border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;">🔄 Aktualisieren</button>`;

  el.innerHTML=html;
  translateEl(el);
}

async function renderMenuWoche(el, tabHtml){
  const woche = CURRENT_MENU_WOCHE;
  const DAYS_ORDER = ['mo','di','mi','do','fr'];
  const DAYS_DE = {mo:'Montag',di:'Dienstag',mi:'Mittwoch',do:'Donnerstag',fr:'Freitag'};
  const SLOT_EMOJI = {salat:'🥗',gericht2:'🍲',gericht3:'🥘'};
  const todayWd = (['so','mo','di','mi','do','fr','sa'])[new Date().getDay()];

  const overrides = await api('allergene_rezepturen?select=*').catch(()=>[]);
  const overrideMap = {};
  (overrides||[]).forEach(e=>{ overrideMap[e.gericht]=e; });
  // Load structured rezept_zutaten if available
  const rezeptZutatenRaw = await api('rezept_zutaten?select=gericht,menge,notiz,zutaten(id,name,kategorie,ist_allergen,allergen_code)').catch(()=>[]);
  const rezeptZutaten = {};
  (rezeptZutatenRaw||[]).forEach(rz=>{
    if(!rezeptZutaten[rz.gericht]) rezeptZutaten[rz.gericht]=[];
    if(rz.zutaten) rezeptZutaten[rz.gericht].push({...rz.zutaten, menge:rz.menge, notiz:rz.notiz});
  });

  let html = tabHtml;
  html += `<div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Woche ${woche} von 4 · aktuelles Menü mit Zutaten & Allergenen</div>`;

  DAYS_ORDER.forEach(day=>{
    const key = `w${woche}_${day}`;
    const dishes = (typeof MENU_DATA!=='undefined'&&MENU_DATA[key])||[];
    if(!dishes.length) return;
    const isToday = day===todayWd;
    html += `<div style="font-size:12px;font-weight:700;color:${isToday?'var(--green)':'var(--sub)'};letter-spacing:.04em;margin:12px 0 6px;padding-bottom:4px;border-bottom:2px solid ${isToday?'var(--green)':'var(--border)'};">${DAYS_DE[day]}${isToday?' 👈 HEUTE':''}</div>`;
    dishes.filter(d=>d.name&&!d.name.startsWith('ÖL')).forEach(dish=>{
      const override = overrideMap[dish.name];
      const zutaten = (override?.zutaten||dish.zutaten||'').replace(/\n/g,' ').trim();
      const allergene = override?.allergene_codes||[];
      const allergenStr = dish.allergene?.main?.length ? dish.allergene.main.join(', ') : (allergene.join(', ')||'');
      const dressingStr = dish.allergene?.dressing?.length ? dish.allergene.dressing.join(', ') : '';
      html += `<div style="border:0.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;">
        <div style="background:var(--green-light);padding:10px 14px;display:flex;align-items:center;gap:8px;">
          <span style="font-size:20px;">${SLOT_EMOJI[dish.slot]||'🍽️'}</span>
          <div>
            <div style="font-weight:700;font-size:14px;color:var(--green);">${dish.name}</div>
            ${allergenStr?`<div style="font-size:11px;margin-top:2px;">⚠️ <strong style="color:#92400E;">${allergenStr}</strong>${dressingStr?` · Dressing: <strong style="color:#92400E;">${dressingStr}</strong>`:''}</div>`:'<div style="font-size:11px;color:var(--muted);">✅ Keine Allergene</div>'}
          </div>
        </div>
        ${zutaten?`<div style="padding:8px 14px;">
          <div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;">🧂 ZUTATEN</div>
          <div style="font-size:12px;color:var(--sub);line-height:1.6;">${renderZutatenForGericht(zutaten, rezeptZutaten[dish.name])}</div>
        </div>`:''}
      </div>`;
    });
  });

  el.innerHTML=html;
  translateEl(el);
}

async function openZutatenManager(dishName){
  const [allZutaten, rezeptLinks] = await Promise.all([
    api('zutaten?select=*&order=kategorie,name').catch(()=>[]),
    api('rezept_zutaten?gericht=eq.'+encodeURIComponent(dishName)+'&select=*,zutaten(id,name,kategorie,ist_allergen,allergen_code)').catch(()=>[])
  ]);
  window._zmDish = dishName;
  window._zmAllZutaten = allZutaten||[];
  window._zmRezeptLinks = rezeptLinks||[];

  const overlay = document.createElement('div');
  overlay.id = 'zm-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:flex-end;';
  overlay.innerHTML = '<div id="zm-sheet" style="background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:0 0 40px;box-shadow:0 -4px 30px rgba(0,0,0,0.12);">'

    +'<button onclick="closeZutatenManager()" style="background:var(--surface-1);border:none;border-radius:50%;width:28px;height:28px;font-size:16px;cursor:pointer;line-height:1;">✕</button>'
    +'</div><div id="zm-body" style="padding:14px 16px;"></div></div>';
  document.body.appendChild(overlay);
  renderZutatenManagerBody();
}
window.openZutatenManager=openZutatenManager;

function renderZutatenManagerBody(){
  const body = document.getElementById('zm-body');
  if(!body) return;
  const allZ = window._zmAllZutaten||[];
  const links = window._zmRezeptLinks||[];
  const linkedIds = new Set(links.map(l=>l.zutat_id));

  const byKat = {};
  allZ.forEach(z=>{ const k=z.kategorie||'Sonstiges'; if(!byKat[k]) byKat[k]=[]; byKat[k].push(z); });
  const katOrder = typeof ZUTAT_KATEGORIEN!=='undefined' ? ZUTAT_KATEGORIEN : ['Gemüse','Obst','Hülsenfrüchte','Kräuter','Getreide/Reis','Milchprodukte','Nüsse/Samen','Öle/Fette','Gewürze','Sonstiges'];
  const sortedKats = katOrder.filter(k=>byKat[k]).concat(Object.keys(byKat).filter(k=>!katOrder.includes(k)));

  let html = '';

  // Current linked zutaten
  html += '<div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Im Rezept ('+links.length+')</div>';
  if(links.length){
    html += '<div style="background:var(--surface-1);border-radius:10px;margin-bottom:14px;overflow:hidden;">';
    links.forEach((l,i)=>{
      const z=l.zutaten||{};
      const isAllergen=z.ist_allergen;
      html += '<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;'+(i>0?'border-top:0.5px solid var(--border);':'')+'">'
        +'<div style="flex:1;"><span style="font-size:13px;'+(isAllergen?'font-weight:700;color:#92400E;':'')+'" data-no-translate>'+z.name+'</span>'
        +(z.allergen_code?'<span style="font-size:9px;color:var(--muted);margin-left:4px;">('+z.allergen_code+')</span>':'')+'</div>'
        +'<input type="text" value="'+(l.menge||'')+'" placeholder="Menge" data-link-id="'+l.id+'" onchange="updateLinkMenge(this)" style="width:65px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px;text-align:center;">'
        +'<button onclick="removeZutatFromRezept('+l.id+')" style="background:#FEE2E2;color:#DC2626;border:none;border-radius:6px;width:28px;height:28px;font-size:13px;cursor:pointer;flex-shrink:0;">✕</button>'
        +'</div>';
    });
    html += '</div>';
  } else {
    html += '<div style="color:var(--muted);font-size:12px;padding:8px 0 14px;">Noch keine Zutaten verknüpft</div>';
  }

  // Search & add
  html += '<div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Aus Datenbank hinzufügen</div>';
  html += '<input type="text" id="zm-search" placeholder="Zutat suchen..." oninput="filterZutatenLibrary(this.value)" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;margin-bottom:8px;">';
  html += '<div id="zm-library" style="max-height:180px;overflow-y:auto;border:0.5px solid var(--border);border-radius:10px;margin-bottom:14px;">';
  sortedKats.forEach(kat=>{
    const items = byKat[kat];
    html += '<div style="padding:5px 12px;font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-1);sticky:top">'+(kat)+'</div>';
    items.forEach(z=>{
      const already=linkedIds.has(z.id);
      html += '<div class="zm-lib-item" data-id="'+z.id+'" data-name="'+z.name.replace(/"/g,'&quot;')+'" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:0.5px solid var(--border);'+(already?'opacity:0.4;background:var(--surface-1);':'')+'">'
        +'<span style="font-size:13px;'+(z.ist_allergen?'font-weight:700;color:#92400E;':'')+'" data-no-translate>'+z.name+'</span>'
        +(already
          ? '<span style="font-size:10px;color:var(--muted);">✓ vorhanden</span>'
          : '<button onclick="addZutatToRezept('+z.id+')" style="background:var(--green-light);color:var(--green);border:1px solid var(--green);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;font-weight:600;">+ Add</button>')
        +'</div>';
    });
  });
  html += '</div>';

  // Create new
  html += '<div style="background:var(--surface-1);border-radius:12px;padding:12px;margin-bottom:14px;">'
    +'<div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Neue Zutat anlegen</div>'
    +'<input id="zm-new-name" type="text" placeholder="Name der Zutat *" style="width:100%;box-sizing:border-box;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:6px;">'
    +'<select id="zm-new-kat" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:6px;">'
    +katOrder.map(k=>'<option value="'+k+'">'+k+'</option>').join('')
    +'</select>'
    +'<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">'
    +'<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;"><input type="checkbox" id="zm-new-allergen"> Ist Allergen</label>'
    +'<input id="zm-new-code" type="text" placeholder="Code (G, M, Sf...)" style="flex:1;padding:7px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;">'
    +'</div>'
    +'<button onclick="createNewZutat()" style="width:100%;padding:10px;border:none;border-radius:8px;background:var(--green);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">+ Anlegen & zum Rezept hinzufügen</button>'
    +'</div>';

  html += '<button onclick="closeZutatenManager()" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;font-size:13px;cursor:pointer;background:var(--card);">Fertig</button>';
  body.innerHTML = html;
}
window.renderZutatenManagerBody=renderZutatenManagerBody;

function filterZutatenLibrary(q){
  const items = document.querySelectorAll('.zm-lib-item');
  q = (q||'').toLowerCase().trim();
  items.forEach(el=>{ el.style.display=(!q||el.dataset.name.toLowerCase().includes(q))?'':'none'; });
}
window.filterZutatenLibrary=filterZutatenLibrary;

async function addZutatToRezept(zutatId){
  const dish = window._zmDish; if(!dish) return;
  try{
    await api('rezept_zutaten',{method:'POST',body:JSON.stringify([{gericht:dish,zutat_id:zutatId,menge:''}])});
    window._zmRezeptLinks = await api('rezept_zutaten?gericht=eq.'+encodeURIComponent(dish)+'&select=*,zutaten(id,name,kategorie,ist_allergen,allergen_code)').catch(()=>[]);
    window._zmAllZutaten = await api('zutaten?select=*&order=kategorie,name').catch(()=>[]);
    renderZutatenManagerBody(); showToast('✓ Zutat hinzugefügt');
  }catch(e){ showToast('Fehler'); }
}
window.addZutatToRezept=addZutatToRezept;

async function removeZutatFromRezept(linkId){
  try{
    await api('rezept_zutaten?id=eq.'+linkId,{method:'DELETE'});
    window._zmRezeptLinks = (window._zmRezeptLinks||[]).filter(l=>l.id!==linkId);
    renderZutatenManagerBody(); showToast('✓ Entfernt');
  }catch(e){ showToast('Fehler'); }
}
window.removeZutatFromRezept=removeZutatFromRezept;

async function updateLinkMenge(input){
  try{ await api('rezept_zutaten?id=eq.'+input.dataset.linkId,{method:'PATCH',body:JSON.stringify({menge:input.value.trim()})}); }
  catch(e){ showToast('Fehler'); }
}
window.updateLinkMenge=updateLinkMenge;

async function createNewZutat(){
  const name=(document.getElementById('zm-new-name')?.value||'').trim();
  const kat=document.getElementById('zm-new-kat')?.value||'Sonstiges';
  const isAllergen=document.getElementById('zm-new-allergen')?.checked||false;
  const code=(document.getElementById('zm-new-code')?.value||'').trim()||null;
  if(!name){ showToast('Bitte Namen eingeben'); return; }
  try{
    const rows=await api('zutaten',{method:'POST',body:JSON.stringify([{name,kategorie:kat,ist_allergen:isAllergen,allergen_code:code}])});
    if(rows?.[0]?.id) await addZutatToRezept(rows[0].id);
    else{ window._zmAllZutaten=await api('zutaten?select=*&order=kategorie,name').catch(()=>[]); renderZutatenManagerBody(); }
    showToast('✓ Neue Zutat angelegt');
  }catch(e){ showToast('Fehler: '+(e.message||'')); }
}
window.createNewZutat=createNewZutat;

function closeZutatenManager(){
  document.getElementById('zm-overlay')?.remove();
  if(window._currentKitchenView==='kitchen') renderKitchen();
}
window.closeZutatenManager=closeZutatenManager;

async function renderSweets(){
  const el=document.getElementById('v-sweets');
  const TEAMTAB_COLORS={sweets:'#EC4899', supply:'#22C55E'};
  const ttab=(key,label)=>{
    const active=teamTab===key;
    const col=TEAMTAB_COLORS[key];
    return `<button class="cl-tab" onclick="switchTeamTab('${key}')" style="border-color:${col};font-family:'Boldonse',sans-serif;font-weight:400;letter-spacing:0.3px;line-height:1.4;${active?`background:${col};color:#fff;`:`background:${col}15;color:${col};`}">${label}</button>`;
  };
  let tabsHtml=`<div class="cl-tabs">${ttab('sweets','🍰 Sweets')}</div>`;

  const stores=await api('stores?select=id,name&order=id');
  // Gleiche Datums-Logik wie bei der Transporter-Bestellliste: Filialen tragen Sweets-Bestellungen
  // am Vortag ein (order_date = Eintragstag), Team bereitet sie am nächsten Tag vor. "Heute" für
  // das Team bedeutet daher: Datenbank-Abfrage auf GESTERN, Anzeige/Label bleibt der heutige Tag.
  const sweetsViewDate=new Date(); sweetsViewDate.setDate(sweetsViewDate.getDate()+sweetsDateOffset);
  const sweetsEntryDate=new Date(sweetsViewDate); sweetsEntryDate.setDate(sweetsEntryDate.getDate()-1);
  const sweetsDateStr=sweetsEntryDate.toISOString().split('T')[0];
  const isSweetsToday=sweetsDateOffset===0;
  const allOrdRaw=await api(`orders?order_date=eq.${sweetsDateStr}&select=store_id,article_id,quantity`);
  const allOrd={};
  allOrdRaw.forEach(o=>{if(!allOrd[o.article_id])allOrd[o.article_id]={};allOrd[o.article_id][o.store_id]=o.quantity;});
  const storeList=stores.filter(s=>s.id!=='zentrale' && s.id!=='1070');
  const sweetsItems=articles.filter(a=>a.category==='Sweets');
  const sweetsDateLabel=sweetsViewDate.toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'2-digit'});

  let html=tabsHtml;

  if(currentStore?.id==='zentrale'){
    html+=`<div class="section-lbl" style="margin-top:10px;">🚫 Verfügbarkeit</div>
    <div class="card" style="padding:4px 0;">
      ${sweetsItems.map(a=>{
        const verf=a.verfuegbar!==false;
        return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:8px;">
            ${a.image_url?`<img src="${a.image_url}" alt="" style="width:28px;height:28px;border-radius:6px;object-fit:cover;flex-shrink:0;">`:''}
            <span style="font-size:13px;">${a.name}</span>
          </div>
          <button onclick="toggleArticleVerfuegbar(${a.id},${verf})" style="background:${verf?'var(--green-light)':'#FEE2E2'};color:${verf?'var(--green)':'#DC2626'};border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;">${verf?'✅ Lieferbar':'❌ Nicht lieferbar'}</button>
        </div>`;
      }).join('')}
    </div>
    <div style="font-size:10.5px;color:var(--muted);padding:6px 2px 2px;">"Nicht lieferbar" markiert = Stores können diesen Artikel nicht mehr bestellen</div>`;
  }

  html+=`<div class="card" style="padding:8px 10px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;">
    <button onclick="navSweetsDate(-1)" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;">← Vorheriger</button>
    <div style="text-align:center;">
      <div style="font-size:12.5px;font-weight:600;">${sweetsDateLabel}${isSweetsToday?' · heute':''}</div>
      <div style="font-size:10px;color:var(--muted);">Bestellungen von ${sweetsEntryDate.toLocaleDateString('de-AT',{weekday:'short',day:'2-digit',month:'2-digit'})}</div>
      ${!isSweetsToday?`<div onclick="navSweetsToday()" style="font-size:10px;color:#EC4899;cursor:pointer;text-decoration:underline;">zu heute zurück</div>`:''}
    </div>
    <button onclick="navSweetsDate(1)" ${isSweetsToday?'disabled style="opacity:0.35;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;"':'style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;"'}>Nächster →</button>
  </div>`;
  html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table">
    <thead><tr>
      <th style="text-align:left;">Sweets 🍰</th>`;
  storeList.forEach(s=>{
    const col=STORE_COLORS[s.id]||'#888';
    const hasOrder=sweetsItems.some(a=>(allOrd[a.id]||{})[s.id]>0);
    html+=`<th style="color:${col};" data-no-translate>${s.name.split(' ')[0]}${hasOrder?' ✓':''}</th>`;
  });
  html+=`</tr></thead><tbody>`;
  sweetsItems.forEach(a=>{
    html+=`<tr><td style="font-size:12px;"><div style="display:flex;align-items:center;gap:6px;">${a.image_url?`<img src="${a.image_url}" alt="" style="width:24px;height:24px;border-radius:5px;object-fit:cover;flex-shrink:0;">`:''}<span>${a.name}</span></div></td>`;
    storeList.forEach(s=>{
      const v=(allOrd[a.id]||{})[s.id]||0;
      const hasOrder=sweetsItems.some(x=>(allOrd[x.id]||{})[s.id]>0);
      html+=`<td style="font-weight:${v?'600':'400'};color:${v?'#1a1a18':'var(--border)'};background:${hasOrder?'#F0FDF4':'transparent'};">${v||'·'}</td>`;
    });
    html+=`</tr>`;
  });
  html+='</tbody></table></div></div>';

  html+=`<div class="section-lbl">Bestellstatus</div><div class="card">`;
  storeList.forEach(s=>{
    const hasOrder=sweetsItems.some(a=>(allOrd[a.id]||{})[s.id]>0);
    const col=STORE_COLORS[s.id]||'#888';
    html+=`<div style="display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);gap:10px;">
      <span style="width:12px;height:12px;border-radius:50%;background:${col};flex-shrink:0;"></span>
      <span style="flex:1;font-size:13px;" data-no-translate>${s.name}</span>
      <span class="badge ${hasOrder?'badge-ok':'badge-warn'}">${hasOrder?(isSweetsToday?'✓ aktualisiert heute':'✓ eingetragen'):'noch ausstehend'}</span>
    </div>`;
  });
  html+='</div>';

  el.innerHTML=html;
  translateEl(el);
}

    const istData=await api(`kc_stock?store_id=eq.${kcLagerStoreId}&select=article_id,ist_bestand,updated_date`).catch(()=>[]);
    const istMap={};
    (istData||[]).forEach(d=>istMap[d.article_id]=d);

        <td style="font-size:12px;">${a.name}</td>

  }else{
    html+=`<div class="card"><div style="overflow-x:auto;"><table class="pack-table"><thead><tr><th>Produkt</th><th>Verpackung</th><th>Bestand</th><th style="text-align:left;">Einheit</th></tr></thead><tbody>`;
    KC_KITCHEN_ITEMS.forEach(r=>{html+=`<tr><td style="color:var(--muted);">${r.p}</td><td style="text-align:left;">${r.v}</td><td><input type="number" min="0" style="width:50px;text-align:center;border:1px solid var(--border);border-radius:4px;font-size:12px;padding:2px;" placeholder="${r.n}"></td><td style="text-align:left;font-size:11px;color:var(--muted);">${r.e}</td></tr>`;});
    html+='</tbody></table></div></div>';
  }
  el.innerHTML=html;
  translateEl(el);
}
function switchKCTab(t){kcTab=t;renderKCLager();}
function switchKCStore(id){kcLagerStoreId=id;renderKCLager();}
async function updateIstBestand(articleId, value){
  const today=new Date().toISOString().split('T')[0];
  const v=value===''?null:parseFloat(value);
  try{
    await api(`kc_stock?store_id=eq.${kcLagerStoreId}&article_id=eq.${articleId}`,{method:'DELETE'});
    if(v!==null){
      await api('kc_stock',{method:'POST',body:JSON.stringify([{store_id:kcLagerStoreId,article_id:articleId,ist_bestand:v,updated_date:today}])});
    }
    renderKCLager();
  }catch(e){console.error(e);showToast('Fehler beim Speichern: '+(e?.message||String(e)).slice(0,120),true);}
}
window.switchKCTab=switchKCTab;
window.switchKCStore=switchKCStore;
window.updateIstBestand=updateIstBestand;

// ---- LAGER ----
function renderLager(){
  const warn=articles.filter(a=>(stockData[a.id]||0)<(a.min_stock||4));
  const el=document.getElementById('v-lager');
  let html=`<div class="metric-grid">
    <div class="metric-card"><div style="font-size:11px;color:var(--muted);">Artikel gesamt</div><div style="font-size:26px;font-weight:600;">${articles.length}</div></div>
    <div class="metric-card"><div style="font-size:11px;color:var(--muted);">Nachbestellen</div><div style="font-size:26px;font-weight:600;color:${warn.length?'#A32D2D':'inherit'}">${warn.length}</div></div>
  </div>`;
  CATS.forEach(cat=>{
    const items=articles.filter(a=>a.category===cat);
    if(!items.length) return;
    html+=`<div class="section-lbl">${cat}</div><div class="card">`;
    items.forEach(a=>{const qty=stockData[a.id]||0;const low=qty<(a.min_stock||4);html+=`<div style="display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);"><span style="flex:1;font-size:14px;">${a.name}</span><span style="width:40px;text-align:center;font-size:13px;color:var(--muted);">${qty}</span><span class="badge ${low?'badge-warn':'badge-ok'}">${low?'nachbestellen':'ok'}</span></div>`;});
    html+='</div>';
  });
  el.innerHTML=html;
  translateEl(el);
}

// ---- UTILS ----
function showToast(msg,isError=false){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),isError?6000:2500);}
window.addEventListener('online',()=>{});

initLogin().catch(console.error);
</script>
